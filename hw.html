<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hazel_studylog · 반·숙제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Archivo:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#EEEFF5; --surface:#fff; --surface-2:#F7F7FB; --surface-3:#EFEFF6;
  --line:#E4E4EF; --line-2:#D8D8E6;
  --ink:#16151F; --ink-2:#55536A; --ink-3:#8A87A0;
  --accent:#6B4EFF; --accent-soft:#EDE9FF; --on-accent:#fff;
  --ok:#12A150; --ok-soft:#E4F5EA; --no:#E5484D; --no-soft:#FCEBEB; --warn:#E8890C; --warn-soft:#FDF1E0;
  --shadow:0 1px 2px rgba(22,21,31,.05), 0 10px 26px -16px rgba(22,21,31,.30);
  --grid:rgba(22,21,31,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E0E17; --surface:#1A1A27; --surface-2:#21212F; --surface-3:#282838;
  --line:#2C2C3D; --line-2:#3A3A4E; --ink:#F1F0F8; --ink-2:#A7A4BB; --ink-3:#7B7894;
  --accent:#8E76FF; --accent-soft:#241F42; --on-accent:#12101F;
  --ok:#3ECF7E; --ok-soft:#12301F; --no:#FF6B6F; --no-soft:#3A1B1E; --warn:#F2A93B; --warn-soft:#382712;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -18px rgba(0,0,0,.85); --grid:rgba(241,240,248,.09);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Gothic A1','Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.bar h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.bar .sub{font-size:12.5px;color:var(--ink-3)}
.btn{display:inline-block;padding:9px 15px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-2);text-decoration:none}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px}
.sec h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.sec .note{font-size:12.5px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{padding:18px 16px;text-align:center}
.tile b{display:block;font-family:'Archivo',sans-serif;font-size:29px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.tile span{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em;padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;font-family:'Archivo',sans-serif}
.p-hi{background:var(--ok-soft);color:var(--ok)} .p-mid{background:var(--accent-soft);color:var(--accent)} .p-lo{background:var(--no-soft);color:var(--no)}
.vd{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.vd.pass{background:var(--ok-soft);color:var(--ok)}
.vd.part{background:#FFF3D6;color:#B87A00}
.vd.full{background:var(--no-soft);color:var(--no)}
.vd.todo{background:var(--accent-soft);color:var(--accent)}
@media (prefers-color-scheme: dark){ .vd.part{background:#3A2E10;color:#F0C34B} }
.meter{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:12px;padding:8px 0}
.meter .lb{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.meter .tr{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.meter .tr>i{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--accent)}
.meter .vl{font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.meter .tr>i.lo{background:var(--no)} .meter .tr>i.hi{background:var(--ok)}
.gate{max-width:400px;margin:14vh auto;padding:0 20px}
.gate h2{margin:0 0 6px;font-size:23px;font-weight:800;letter-spacing:-.02em}
.gate p{margin:0 0 22px;font-size:14px;color:var(--ink-2)}
.gate input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);font-size:16px;font-weight:600}
.gate input:focus{border-color:var(--accent);outline:none}
.gate button{width:100%;margin-top:12px;padding:15px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:15.5px;font-weight:800}
.err{color:var(--no);font-size:13px;font-weight:700;margin-top:10px;min-height:19px}
.empty{text-align:center;padding:56px 24px;color:var(--ink-3)}
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);max-width:640px;width:calc(100% - 32px);box-shadow:0 30px 70px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,10,20,.5)}
.dl-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dl-b{padding:8px 20px 20px;max-height:65vh;overflow:auto}
.wrongrow{padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6}
.wrongrow:last-child{border-bottom:0}
.k{color:var(--ink-3);font-weight:700;margin-right:6px;font-size:12px}
.bad{color:var(--no);font-weight:700;text-decoration:line-through}
.good{color:var(--ok);font-weight:700}
.tabsw{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabsw button{padding:9px 14px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-3)}
.tabsw button.on{background:var(--accent);color:var(--on-accent)}

input,textarea,select{font:inherit;color:inherit}
.fld{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-size:14px}
.fld:focus{border-color:var(--accent);outline:none}
textarea.fld{min-height:64px;resize:vertical;line-height:1.55}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;font-weight:800;color:var(--ink-2)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.chip small{font-weight:600;opacity:.75;margin-left:4px}
.mem{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 11px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:700;margin:0 6px 6px 0}
.mem button{width:20px;height:20px;border-radius:50%;font-size:12px;color:var(--ink-3)}
.mem button:hover{background:var(--no-soft);color:var(--no)}
.sug{display:inline-block;padding:4px 10px;border-radius:999px;border:1px dashed var(--line-2);font-size:12px;color:var(--ink-3);margin:0 6px 6px 0}
.sug:hover{border-color:var(--accent);color:var(--accent)}
.hw{padding:0;overflow:hidden;margin-bottom:12px}
.hw-h{display:flex;gap:12px;align-items:center;padding:15px 18px;cursor:pointer}
.hw-h .d{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:8px;white-space:nowrap}
.hw-h .t{flex:1;min-width:0}
.hw-h .t b{display:block;font-size:14.5px;font-weight:800}
.hw-h .t span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.stat b{color:var(--ok)}
.hw-b{border-top:1px solid var(--line);padding:6px 18px 16px}
.ck{display:grid;grid-template-columns:110px auto 70px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .nm{font-weight:800;font-size:14px}
.seg{display:flex;gap:4px}
.seg button{padding:7px 10px;border-radius:9px;background:var(--surface-2);font-size:12.5px;font-weight:800;color:var(--ink-3);white-space:nowrap}
.seg button.on.done{background:var(--ok);color:#fff} .seg button.on.part{background:var(--warn);color:#fff}
.seg button.on.none{background:var(--no);color:#fff} .seg button.on.skip{background:var(--ink-3);color:#fff}
.ck input{padding:8px 10px;border-radius:9px;border:1.5px solid var(--line-2);background:var(--surface);font-size:13px;width:100%;min-width:0}
.ck a{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
.saved{font-size:11px;color:var(--ok);font-weight:700}
@media (max-width:720px){.ck{grid-template-columns:1fr auto;}.ck .seg{grid-column:1 / 3}.ck input.sc{grid-column:1}.ck input.mm{grid-column:1 / 3}}
.grid{min-width:100%;width:auto;font-size:13px}
.grid th,.grid td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.grid .stk{position:sticky;left:0;background:var(--surface);z-index:2;min-width:96px;white-space:nowrap;box-shadow:1px 0 0 var(--line)}
.grid td.stk b{display:block;font-size:14px}
.grid td.stk a{font-size:11px;color:var(--accent);text-decoration:none;font-weight:700}
.grid .gh{min-width:128px;max-width:170px;white-space:normal;letter-spacing:0;font-size:12px;color:var(--ink-2)}
.grid .gh .gd{display:inline-block;font-family:'Archivo',sans-serif;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;margin-bottom:4px}
.grid .gh b{display:block;font-size:12.5px;color:var(--ink);line-height:1.4;margin-bottom:5px}
.gall{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-radius:7px;padding:4px 7px}
.gall:hover{color:var(--ok)}
.gcell{min-width:128px}
.gc{width:100%;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 6px;border-radius:10px;background:var(--surface-2);font-size:15px;font-weight:800;color:var(--ink-3);border:1.5px dashed var(--line-2)}
.gc span{font-size:12px}
.gc.done{background:var(--ok-soft);color:var(--ok);border:1.5px solid transparent}
.gc.part{background:var(--warn-soft);color:var(--warn);border:1.5px solid transparent}
.gc.none{background:var(--no-soft);color:var(--no);border:1.5px solid transparent}
.gc.skip{background:var(--surface-3);color:var(--ink-3);border:1.5px solid transparent}
.gm{width:100%;margin-top:5px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:11.5px}
.rr,.cc{font-family:'Archivo',sans-serif;font-size:12.5px;text-align:center;white-space:nowrap;color:var(--ink-3)}
.rr b,.cc b{color:var(--ink);font-size:14px} .rr.all b{color:var(--ok)}
.cc small{display:block;font-size:10.5px;color:var(--accent)}
.warn{display:inline-block;margin-left:4px;font-size:10px;font-weight:800;color:#B45309;background:#FEF3C7;border-radius:6px;padding:1px 5px}
.cpy{display:block;margin-top:3px;font-size:10.5px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-radius:6px;padding:2px 6px}
.cpy:hover{color:var(--accent)}
.ck .cpy{display:inline-block;margin:0 0 0 4px}
.tabs3{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.tabs3 button{padding:11px 16px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:800;color:var(--ink-2)}
.tabs3 button.on{background:var(--accent);color:var(--on-accent)}
.tc{text-align:center;white-space:nowrap}
.tc small{display:block;font-size:10.5px;color:var(--ink-3);font-family:'Archivo',sans-serif}
.tp{font-family:'Archivo',sans-serif;font-weight:800;font-size:14px}
.tp.hi{color:var(--ok)} .tp.mid{color:var(--warn)} .tp.lo{color:var(--no)}
.na{font-size:11.5px;color:var(--ink-3)}
.snd td,.snd th{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13.5px}
.snd tr.dim td{opacity:.55}
.snd .ic{letter-spacing:1px}
.snd td.act{display:flex;gap:6px;justify-content:flex-end}
.btn.sm{padding:7px 11px;font-size:12px}
.dlt{font-size:12.5px} .dlt small{color:var(--ink-3);font-size:11px}
.up{color:var(--ok);font-weight:800;font-family:'Archivo',sans-serif} .dn{color:var(--no);font-weight:800;font-family:'Archivo',sans-serif}
.bell{display:inline-block;margin-left:4px;font-size:10px;font-weight:800;color:#B91C1C;background:#FEE2E2;border-radius:6px;padding:1px 5px;white-space:nowrap}
.alerts{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:14px;padding:11px 14px;font-size:13px;line-height:1.7;margin:0 0 12px}
.alerts b{color:#7C2D12}
.seen{font-size:12px;font-weight:700;color:var(--ok)} .seen small{display:block;font-weight:600;color:var(--ink-3);font-size:10.5px}
.mcards{display:grid;gap:10px}
.mcard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.mcard .mh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mcard .mh b{flex:1;font-size:15px}
.mcard .mi{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.mcard .mi>span{flex:1;min-width:0;font-size:13px;color:var(--ink-2);line-height:1.45}
.mcard .mi .gc{flex:none;width:104px}
@media (max-width:700px){
  .bar-in{flex-wrap:wrap;gap:8px;padding:12px 16px}
  .bar-in>div:first-child{flex:1 0 100%}
  .bar-in .btn{padding:7px 10px;font-size:12px}
  .hw-h{flex-wrap:wrap;gap:8px;padding:13px 14px}
  .hw-h .t{flex:1 1 60%}
  .hw-h .stat{flex:1 0 100%;order:5;font-size:12px}
}
.nmrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.nmrow .who{flex:1;min-width:180px} .nmrow .who small{display:block;color:var(--ink-3);font-size:11.5px}
@media (prefers-color-scheme: dark){ .alerts{background:#3B2410;border-color:#7C2D12;color:#FED7AA} .alerts b{color:#FFEDD5} .bell{background:#4C1D1D;color:#FCA5A5} }
.att{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.att .an{width:96px;font-size:14px}
.aseg{display:flex;gap:4px;flex-wrap:wrap}
.aseg button{padding:7px 10px;border-radius:10px;background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--ink-2);border:1.5px solid transparent}
.aseg button.a-on.sel{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.aseg button.a-late.sel{background:#FEF3C7;color:#B45309;border-color:#F59E0B}
.aseg button.a-absent.sel{background:var(--no-soft);color:var(--no);border-color:var(--no)}
.aseg button.a-etc.sel{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.att .am{flex:1;min-width:150px;padding:7px 10px;font-size:12.5px}
@media (max-width:700px){ .att .an{width:100%} .att .am{min-width:100%} }
.ivg-wrap{padding:0;overflow:auto;max-height:calc(100vh - 230px)}
.ivg{border-collapse:separate;border-spacing:0;font-size:13px}
.ivg th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-size:12px;font-weight:800;color:var(--ink-2);padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.ivg td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px;vertical-align:top;background:var(--surface)}
.ivg .sk{position:sticky;left:0;z-index:1;min-width:92px;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.ivg th.sk{z-index:3;background:var(--surface-2)}
.ivg td.sk{padding:6px 8px}.ivg td.sk b{display:block;font-size:14px}.ivg td.sk small{font-size:10.5px;color:var(--ink-3)}
.ivg .rs{font-size:11px;font-weight:800;color:var(--ok);margin-left:4px}.ivg .rs.no{color:var(--no)}
.ivg td.hs{min-width:96px;font-size:11px;color:var(--ink-2);padding:5px 6px;line-height:1.7;white-space:nowrap}
.ivg input,.ivg textarea,.ivg select{width:100%;font:inherit;font-size:13px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);padding:6px 6px;resize:none;line-height:1.45}
.ivg input:focus,.ivg textarea:focus,.ivg select:focus{border-color:var(--accent);background:var(--surface);outline:none}
.ivg textarea{min-height:32px;overflow:hidden}
.gg{display:inline-block;min-width:16px;text-align:center;border-radius:4px;color:#fff;font-weight:800;font-size:10.5px;margin-right:2px;padding:0 3px}
.gg.g1,.gsel.g1{background:#2E7D4F!important}.gg.g2,.gsel.g2{background:#D08A1A!important}.gg.g3,.gsel.g3{background:#C0392B!important}.gg.g4,.gsel.g4{background:#7B1E1E!important}.gg.g5,.gg.g6,.gsel.g5,.gsel.g6{background:#A3A8B4!important}
.gsel{font-weight:800;text-align:center}.gsel.g1,.gsel.g2,.gsel.g3,.gsel.g4,.gsel.g5,.gsel.g6{color:#fff!important}
.mrt{font-size:11px;color:var(--ink-2);line-height:1.35;padding:3px 4px 0;max-height:30px;overflow:hidden}
.mrs.ok{color:var(--ok);font-weight:800}.mrs.no{color:var(--no);font-weight:800}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:50}
#live{position:fixed;left:12px;bottom:12px;z-index:50;background:#111;color:#fff;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none}
#live.on{opacity:.92}
.ivg .live-new{background:#FFF3B0!important;transition:background .6s}
</style>
</head>
<body>
<div id="gate" class="gate">
  <h2>반 · 숙제 관리</h2>
  <p>선생님 비밀번호를 입력하세요.<br><span style="font-size:12.5px;color:var(--ink-3)">이 기기에서 한 번만 입력하면 다음부터는 바로 들어가요.</span></p>
  <input id="pin" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="pin-go">들어가기</button>
  <div class="err" id="pin-err"></div>
</div>
<div id="app" hidden>
  <header class="bar"><div class="bar-in">
    <div style="flex:1"><h1>반별 관리</h1><div class="sub" id="bar-sub">숙제 검사 · 테스트 현황 · 리포트 보내기를 반별로</div></div>
    <button class="btn pri" id="iv-btn" title="조교 입력시트의 그날 인터뷰로 리포트 만들기">🎤 인터뷰 리포트</button>

<script>
"use strict";

const fmtD=d=>{const [y,m,dd]=d.split("-");const w="일월화수목금토"[new Date(+y,+m-1,+dd).getDay()];return `${+m}.${+dd} (${w})`;};

}
async function load(){ DB=await api(); HWSTAMP=+DB.stamp||0; }

let HWSTAMP=0;
function ownStamp(n){ n=+n; if(n===HWSTAMP+1) HWSTAMP=n; }   // 내가 방금 한 저장이면 다시 안 불러옴 (사이에 다른 사람이 있었으면 다음 확인 때 불러옴)

function liveNote(t){ let e=$("#live"); if(!e){ e=document.createElement("div"); e.id="live"; document.body.appendChild(e); }

const hhmm=()=>new Date().toTimeString().slice(0,8);

    if(VIEW==="names") return;
    const r=await fetch("/api/hw?stamp=1",{headers:{"x-pin":PIN},cache:"no-store"}); const j=await r.json().catch(()=>({}));
    if(!r.ok||+j.stamp===HWSTAMP) return;

}
setInterval(livePoll,5000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) livePoll(); });
async function act(body,msg){ try{ const j=await api(body); await load(); render(); if(msg) toast(msg); return j; }catch(e){ alert(e.message); } }

  $("#cls").innerHTML=HEAD+`<div id="alerts"></div>`+tabsHTML()+`
  <div class="card" style="padding:16px 18px">
    <div>${mem.map(s=>{ const f=focusOf(s); return `<span class="mem"${f?` style="background:#FEF3C7;color:#92400E" title="집중관리: ${esc(f)}"`:""}><button data-focus="${esc(s)}" title="★ 집중관리 표시·사유" style="margin:0 3px 0 0;opacity:${f?1:.35}">★</button>${esc(s)}<button data-rm="${esc(s)}" title="반에서 빼기">✕</button></span>`; }).join("")||`<span style="color:var(--ink-3);font-size:13px">아직 학생이 없어요</span>`}</div>
    <div class="row" style="margin-top:10px"><input class="fld" id="mem-in" placeholder="학생 이름 (여러 명은 쉼표·줄바꿈으로)" style="flex:1;min-width:200px"><button class="btn pri" id="mem-add">추가</button></div>
    ${others.length?`<div style="margin-top:10px;font-size:11.5px;color:var(--ink-3);font-weight:700">앱에서 시험 본 학생 · 눌러서 추가</div><div style="margin-top:6px">${others.map(s=>`<button class="sug" data-add="${esc(s)}">+ ${esc(s)}</button>`).join("")}</div>`:""}
    <div style="margin-top:8px;font-size:11.5px;color:var(--ink-3)">학생이 앱 첫 화면에서 이름과 <b>이 반</b>을 고르면 자동으로 들어와요. 직접 넣을 때는 앱 이름과 똑같이 써야 리포트에 연결돼요.</div>
  </div>

  ${attendHTML(mem)}

  <div class="sec"><h2>숙제 내기</h2><span class="note">시험과 별개 · 검사 날짜 기준으로 리포트에 들어가요</span></div>
  <div class="card" style="padding:16px 18px">
    <div class="row"><input class="fld" type="date" id="hw-day" value="${EDIT?EDIT.day:today()}" style="width:170px">
      ${EDIT?`<input class="fld" id="hw-title" value="${esc(EDIT.title)}" style="flex:1;min-width:200px">`
        :`<textarea class="fld" id="hw-title" rows="3" placeholder="숙제를 한 줄에 하나씩 (여러 개 한 번에)&#10;1) 워크북 3과 p.12–15&#10;   대충하면 다시 시킵니다  ← 번호 없는 줄은 위 숙제의 메모로&#10;2) 단어 3과 30개 뜻 쓰기" style="flex:1;min-width:200px;min-height:84px"></textarea>`}</div>
    <textarea class="fld" id="hw-memo" placeholder="(선택) 공통 메모 · 자세한 범위 (예: 다음 수업 시작 전 검사)" style="margin-top:8px">${EDIT?esc(EDIT.memo):""}</textarea>
    <div class="row" style="margin-top:8px;justify-content:flex-end">${EDIT?`<button class="btn" id="hw-cancel">취소</button><button class="btn pri" id="hw-save">수정 저장</button>`:`<button class="btn pri" id="hw-add">숙제 추가</button>`}</div>
  </div>

  ${gridHTML(mem, items, chk)}

  <div class="sec"><h2>숙제별로 검사 · 점수</h2><span class="note">숙제를 누르면 학생별로 점수·메모까지 자세히 넣어요</span></div>
  ${items.length?items.map((it,ix)=>{ const o=stat(it), open=!!OPEN[it.id];
    const grp=ix===0||items[ix-1].day!==it.day ? `<div class="row" style="justify-content:space-between;margin:${ix?16:4}px 2px 6px"><b style="font-size:13.5px">${fmtD(it.day)} 숙제 ${items.filter(x=>x.day===it.day).length}개</b><button class="btn sm" data-delday="${it.day}" style="color:var(--no)">🗑 이 날짜 숙제 모두 삭제</button></div>` : "";
    return grp+`<div class="card hw">
      <div class="hw-h" data-open="${it.id}"><span class="d">${fmtD(it.day)}</span>
        <span class="t"><b>${esc(it.title)}</b>${it.memo?`<span>${esc(it.memo)}</span>`:""}</span>
        <span class="stat"><b>완료 ${o.done}</b> · 일부 ${o.part} · 안 함 ${o.none}${o.no?` · <span style="color:var(--accent)">미검사 ${o.no}</span>`:""}</span>
        <button class="btn sm" data-del="${it.id}" title="이 숙제 삭제" style="color:var(--no);flex:none">🗑</button>
        <span style="color:var(--ink-3)">${open?"▲":"▼"}</span></div>
      ${open?`<div class="hw-b">
        <div class="row" style="justify-content:space-between;padding:8px 0">
          <span style="font-size:12px;color:var(--ink-3)">점수(선택)·메모는 입력 후 칸을 벗어나면 저장돼요</span>
          <span class="row"><button class="btn" data-all="${it.id}">미검사 전원 완료</button><button class="btn" data-edit="${it.id}">수정</button><button class="btn" data-del="${it.id}" style="color:var(--no)">삭제</button></span></div>
        ${mem.map(s=>{ const k=chk[it.id+"|"+s]||{};
          return `<div class="ck" data-it="${it.id}" data-st="${esc(s)}"><span class="nm">${esc(s)}</span>
            <span class="seg">${Object.entries(ST).map(([v,n])=>`<button class="${v}${k.status===v?" on":""}" data-v="${v}">${n}</button>`).join("")}</span>
            <input class="sc" type="number" min="0" max="100" placeholder="점수" value="${k.score??""}">
            <input class="mm" placeholder="메모 (예: 2쪽 빠짐, 오답 정리 안 함)" value="${esc(k.memo||"")}">
            <a href="report?student=${encodeURIComponent(s)}&day=${it.day}" target="_blank" rel="noopener">리포트</a><button class="cpy" data-copy="report?student=${encodeURIComponent(s)}&day=${it.day}">복사</button></div>`; }).join("")||`<div class="empty" style="padding:20px">반에 학생을 먼저 넣어 주세요</div>`}
      </div>`:""}
    </div>`; }).join(""):`<div class="card empty">아직 낸 숙제가 없어요</div>`}`;
}
/* ── 표로 한 번에 검사: 왼쪽 학생, 오른쪽 숙제 ── */
function gridItems(items){
  const its=items.slice().sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:a.id-b.id);
  if(GR.mode==="day") return its.filter(i=>i.day===GR.day);
  if(GR.mode==="7"){ const from=new Date(Date.now()+9*3600e3-6*864e5).toISOString().slice(0,10); return its.filter(i=>i.day>=from); }
  return its.slice(-12);
}
function gridHTML(mem, items, chk){
  const cols=gridItems(items);
  const head=`<div class="sec"><h2>한 번에 검사 (표)</h2><span class="note">칸을 누를 때마다 ✅완료 → 🟡일부 → ❌안 함 → ➖면제 → 미검사 · 바로 저장</span></div>${sheetBar()}
  <div class="row" style="margin-bottom:10px">
    <button class="chip${GR.mode==="day"?" on":""}" data-gmode="day">하루</button>
    ${GR.mode==="day"?`<input class="fld" type="date" id="g-day" value="${GR.day}" style="width:170px">`:""}
    <button class="chip${GR.mode==="7"?" on":""}" data-gmode="7">최근 7일</button>
    <button class="chip${GR.mode==="all"?" on":""}" data-gmode="all">최근 숙제 12개</button>
  </div>`;
  if(!mem.length) return head+`<div class="card empty" style="padding:24px">반에 학생이 없어요</div>`;
  if(!cols.length) return head+`<div class="card empty" style="padding:24px">이 기간에 낸 숙제가 없어요 · 위 '숙제 내기'에서 여러 개를 한 번에 낼 수 있어요</div>`;
  const cell=(it,s)=>{ const k=chk[it.id+"|"+s]||{}, st=k.status||"";
    return `<td class="gcell"><button class="gc ${st}" data-gc="${it.id}" data-gs="${esc(s)}" title="${ST[st]||"미검사"}">${ICON[st]}<span>${ST[st]||""}</span></button>
      <input class="gm" data-gm="${it.id}" data-gs="${esc(s)}" placeholder="메모" value="${esc(k.memo||"")}"></td>`; };
  if(NARROW()) return head+`<div class="mcards">${mem.map(s=>`<div class="mcard"><div class="mh"><b>${esc(s)}</b><span data-bell="${esc(s)}"></span><span class="rr" data-rr="${esc(s)}"></span></div>
      ${cols.map(it=>{ const k=chk[it.id+"|"+s]||{}, st=k.status||"";
        return `<div class="mi"><span>${fmtD(it.day).replace(/ \(.\)/,"")} · ${esc(it.title)}</span><button class="gc ${st}" data-gc="${it.id}" data-gs="${esc(s)}">${ICON[st]}<span>${ST[st]||"미검사"}</span></button></div>`; }).join("")}
      <div class="row" style="margin-top:8px;gap:6px"><a class="btn sm" href="report?student=${encodeURIComponent(s)}${GR.mode==="day"?`&day=${GR.day}`:""}" target="_blank" rel="noopener">리포트</a><button class="btn sm" data-tcopy="${esc(s)}" data-tday="${GR.mode==="day"?GR.day:""}">학부모 링크 복사</button></div></div>`).join("")}
    </div><div hidden>${cols.map(it=>`<span data-cc="${it.id}"></span>`).join("")}</div>
    <div class="row" style="margin-top:10px">${cols.map(it=>`<button class="btn sm" data-gall="${it.id}">${esc(it.title.slice(0,12))} · 미검사 → 완료</button>`).join("")}</div>`;
  return head+`<div class="card scroll"><table class="grid">
    <thead><tr><th class="stk">학생</th>${cols.map(it=>`<th class="gh"><span class="gd">${fmtD(it.day)}</span><b title="${esc(it.memo||"")}">${esc(it.title)}</b>
      <button class="gall" data-gall="${it.id}">미검사 → 완료</button><button class="gall" data-del="${it.id}" style="color:var(--no)">🗑 삭제</button></th>`).join("")}<th class="gh">완료</th></tr></thead>
    <tbody>${mem.map(s=>`<tr><td class="stk"><b>${esc(s)}</b><span data-bell="${esc(s)}"></span><a href="report?student=${encodeURIComponent(s)}${GR.mode==="day"?`&day=${GR.day}`:""}" target="_blank" rel="noopener">리포트</a><button class="cpy" data-tcopy="${esc(s)}" data-tday="${GR.mode==="day"?GR.day:""}">학부모 링크 복사</button></td>
      ${cols.map(it=>cell(it,s)).join("")}<td class="rr" data-rr="${esc(s)}"></td></tr>`).join("")}</tbody>
    <tfoot><tr><td class="stk">완료</td>${cols.map(it=>`<td class="cc" data-cc="${it.id}"></td>`).join("")}<td></td></tr></tfoot>
  </table></div>`;
}
function gridStats(){
  const chk={}; DB.checks.forEach(k=>{chk[k.item_id+"|"+k.student]=k;});
  const mem=DB.members.filter(m=>+m.class_id===CUR).map(m=>m.student);
  const cols=[...document.querySelectorAll("[data-cc]")].map(e=>+e.dataset.cc);
  document.querySelectorAll("[data-rr]").forEach(e=>{ const s=e.dataset.rr; const v=cols.map(i=>chk[i+"|"+s]).filter(k=>k&&k.status!=="skip");
    const d=v.filter(k=>k.status==="done").length, n=cols.filter(i=>!chk[i+"|"+s]||chk[i+"|"+s].status!=="skip").length;
    e.innerHTML=`<b>${d}</b>/${n}`; e.className="rr"+(n&&d===n?" all":""); });
  document.querySelectorAll("[data-cc]").forEach(e=>{ const i=+e.dataset.cc; const v=mem.map(s=>chk[i+"|"+s]);
    const d=v.filter(k=>k&&k.status==="done").length, no=v.filter(k=>!k).length;
    e.innerHTML=`<b>${d}</b>/${mem.length}${no?`<small>미검사 ${no}</small>`:""}`; });
}
async function setCheck(it, st, status, memo){
  const cur=DB.checks.find(k=>+k.item_id===+it&&k.student===st);
  const m=memo!==undefined?memo:(cur?cur.memo:""), sc=cur&&cur.score!=null?cur.score:"";
  await api({action:"check.set",item_id:+it,student:st,status,score:status?sc:"",memo:status?m:""});
  if(cur){ if(status){cur.status=status;cur.memo=m;} else DB.checks=DB.checks.filter(k=>k!==cur); }
  else if(status) DB.checks.push({item_id:+it,student:st,status,score:null,memo:m});
}
/* ── 반별 탭: 숙제 검사 / 테스트 현황 / 리포트 보내기 ── */
let TAB=localStorage.getItem("hw.tab")||"hw", RES=null, RESERR="", VD=today();
const baseNm=n=>String(n||"").replace(/[A-Za-z0-9]+$/,"");
const dkeyL=v=>new Date(new Date(v).getTime()+9*3600e3).toISOString().slice(0,10);
async function loadRes(){
  try{ const r=await fetch("/api/results",{headers:{"x-pin":PIN},cache:"no-store"}); const j=await r.json();
    if(!r.ok) throw new Error(j.error||"불러오지 못했어요");
    RES=(j.rows||[]).map(x=>({...x, book:String(x.book||"").replace(/\s*올킬\s*$/,"").trim(), day:dkeyL(x.created_at)})); RESERR=""; }
  catch(e){ RES=[]; RESERR=e.message; }
}

/* 학생 이름 → 그 학생 시험 기록 (명단 이름, 또는 구분자 뺀 예전 이름이 반 전체에서 하나뿐일 때) */
function rowsOfMem(s){
  const allMem=DB.members.map(m=>m.student), b=baseNm(s);
  const uniq=allMem.filter(m=>baseNm(m)===b).length===1;
  return (RES||[]).filter(x=>x.student===s || (uniq && b!==s && x.student===b));
}
function dayChips(mem, items){
  const ds=new Set(items.map(i=>i.day)); mem.forEach(s=>rowsOfMem(s).forEach(x=>ds.add(x.day)));
  const list=[...ds].filter(d=>d<=today()).sort().reverse().slice(0,8);
  if(!list.includes(VD)) list.unshift(VD);
  return `<div class="row" style="margin:4px 0 12px"><input class="fld" type="date" id="v-day" value="${VD}" style="width:170px">
    ${list.map(d=>`<button class="chip${d===VD?" on":""}" data-vday="${d}">${fmtD(d)}</button>`).join("")}</div>`;
}
function dayTests(s, d){   // 그날 시험: 파트마다 최고 기록 (재시험 제외)
  const best={}; d=d||VD;
  rowsOfMem(s).filter(x=>x.day===d && x.scope!=="재시험" && !/^오답노트/.test(x.part_name||"")).forEach(x=>{
    const k=x.book+"|"+x.part, r=x.total?x.correct/x.total:0;
    if(!best[k]||r>best[k].r) best[k]={k,book:x.book,part:x.part,name:x.part_name,t:x.total,c:x.correct,r}; });
  return Object.values(best);
}

/* 학생 한 명의 하루 요약 + 바로 전 학습일 */
function dayStat(s, d, items, chk){
  const v=dayTests(s,d), t=v.reduce((a,x)=>a+x.t,0), c=v.reduce((a,x)=>a+x.c,0);
  const ks=items.filter(i=>i.day===d).map(i=>chk[i.id+"|"+s]).filter(k=>k&&k.status!=="skip"), hd=ks.filter(k=>k.status==="done").length;
  return {tp:t?Math.round(c/t*100):null, hp:ks.length?Math.round(hd/ks.length*100):null};
}
function prevStat(s, items, chk){
  const ds=new Set(rowsOfMem(s).map(x=>x.day)); items.forEach(i=>{ if(chk[i.id+"|"+s]) ds.add(i.day); });
  const before=[...ds].filter(d=>d<VD).sort().reverse();
  let pt=null, ph=null;
  for(const d of before){ const st=dayStat(s,d,items,chk); if(pt===null&&st.tp!==null) pt={d,v:st.tp}; if(ph===null&&st.hp!==null) ph={d,v:st.hp}; if(pt&&ph) break; }
  return {pt, ph};
}
const arr=(v)=>v===null?"":v>0?`<span class="up">▲${v}</span>`:v<0?`<span class="dn">▼${-v}</span>`:`<span class="na">–</span>`;

async function saveCheck(row, status){
  const it=+row.dataset.it, st=row.dataset.st;
  const cur=DB.checks.find(k=>+k.item_id===it&&k.student===st);
  const sc=row.querySelector(".sc").value, mm=row.querySelector(".mm").value;
  const s=status!==undefined?status:(cur?cur.status:"");
  if(!s && (sc!==""||mm.trim())){ toast("먼저 완료·일부·안 함 중 하나를 골라 주세요"); return; }
  try{ await api({action:"check.set",item_id:it,student:st,status:s,score:sc,memo:mm});
    if(cur){ if(s){cur.status=s;cur.score=sc===""?null:+sc;cur.memo=mm;} else DB.checks=DB.checks.filter(k=>k!==cur); }
    else if(s) DB.checks.push({item_id:it,student:st,status:s,score:sc===""?null:+sc,memo:mm});
    render(); toast("저장했어요");
  }catch(e){ alert(e.message); }
}

const focusOf=s=>((DB.members.find(m=>+m.class_id===CUR&&m.student===s)||{}).focus||"");
function alertsOf(s, items, chk, upto){
  const out=[]; upto=upto||VD;
  const ar=(DB.attend||[]).filter(a=>+a.class_id===CUR&&a.student===s&&a.day<=upto).sort((a,b)=>a.day<b.day?1:-1);
  if(ar.length>=2&&ar.slice(0,2).every(a=>a.status==="late"||a.status==="absent")) out.push("지각·결석 2번 연속");
  const ks=items.slice().sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:b.id-a.id).map(i=>chk[i.id+"|"+s]).filter(k=>k&&k.status!=="skip");
  if(ks.length>=2 && ks.slice(0,2).every(k=>k.status==="none"||k.status==="part")) out.push("숙제 2번 연속 못 함");
  if(RES&&RES.length){
    const ds=[...new Set(rowsOfMem(s).map(x=>x.day))].filter(d=>d<=upto).sort().reverse();
    const tp=[]; for(const d of ds){ const v=dayTests(s,d); if(v.length){ const t=v.reduce((a,x)=>a+x.t,0), c=v.reduce((a,x)=>a+x.c,0); if(t) tp.push(Math.round(c/t*100)); } if(tp.length>=3) break; }

  }
  return out;
}

function dupCheck(names){

  for(const n0 of names){ let n=n0;
    const other=DB.members.filter(m=>m.student===n&&+m.class_id!==CUR).map(m=>(DB.classes.find(c=>+c.id===+m.class_id)||{}).name).filter(Boolean);
    if(other.length){
      const v=prompt(`'${n}' 이름이 ${other.join(", ")}에도 있어요.\n\n· 같은 학생(반을 옮기거나 두 반 수강)이면 그대로 확인\n· 동명이인이면 이름 뒤에 구분 글자를 붙여 주세요 (예: ${n}2)\n  → 학생은 앱에서 '${n}'만 써도 들어와요`, n);
      if(v===null) continue; n=v.trim().replace(/\s+/g,""); if(!n) continue; }
    out.push(n); }
  return out;
}

    :`<div class="card empty" style="padding:24px">${fmtD(IV.day)}에 불러온 인터뷰가 없어요 · 위 버튼으로 시트에서 불러오세요</div>`}`;

async function ivClick(t){
  if(t.closest("#iv-btn")){ VIEW="iv"; IV.list=null; IV.mode="input"; IVG.data=null; render(); scrollTo({top:0}); return true; }
  const mo=t.closest("[data-ivmode]"); if(mo){ IV.mode=mo.dataset.ivmode; IV.list=null; IVG.data=null; render(); return true; }
  const ic=t.closest("[data-ivcls]"); if(ic){ IVG.cid=+ic.dataset.ivcls; IVG.data=null; render(); return true; }
  if(t.closest("#ivg-batch")){ const cls=(DB.classes.find(c=>+c.id===IVG.cid)||{}).name||"";
    const n=(IVG.data&&IVG.data.members||[]).filter(m=>m.input&&["g0","g1","g2","g3"].some(k=>m.input[k])).length;
    if(!n){ toast("등급을 입력한 학생이 없어요"); return true; }
    window.open(`interview?day=${IV.day}&cls=${encodeURIComponent(cls)}&auto=zip`,"_blank","noopener"); toast(`${cls} ${n}명 리포트를 새 탭에서 만들고 있어요 (ZIP으로 받아져요)`); return true; }
  if(t.closest("#ivg-xlsx")){ try{ await ivXlsx(); }catch(err){ alert(err.message); } return true; }
  if(t.closest("#iv-close")){ VIEW=""; render(); return true; }
  if(t.closest("#iv-sync")){ IV.busy="sync"; render(); try{ IV.last=await ivApi({action:"sync",day:IV.day}); toast(`인터뷰 ${IV.last.made.length}명을 불러왔어요`); }catch(e){ alert(e.message); } IV.busy=""; await ivLoad(); return true; }
  if(t.closest("#iv-ai-all")){ if(!confirm(`${IV.list.length}명 코멘트를 AI로 다듬을까요? 직접 고친 코멘트도 다시 써져요.`)) return true;
    await ivAutoPolish(true); return true; }
  const a=t.closest("[data-ivai]"); if(a){ a.textContent="다듬는 중…"; a.disabled=true; try{ const j=await ivApi({action:"comment.ai",ids:[+a.dataset.ivai]}); if(j.fail.length) alert(j.fail.join("\n")); }catch(e){ alert(e.message); } await ivLoad(false); return true; }
  const e=t.closest("[data-ivedit]"); if(e){ IV.edit=e.dataset.ivedit; render(); return true; }
  if(t.closest("[data-ivcancel]")){ IV.edit=null; render(); return true; }
  const s=t.closest("[data-ivsave]"); if(s){ try{ const R=IV.list.find(x=>String(x.id)===s.dataset.ivsave), ti=$("#iv-et").value, bo=$("#iv-eb").value, sp=$("#iv-es").value;
      const areas=[0,1,2,3].map(i=>{ const el=document.querySelector(`[data-iva="${i}"]`); return el?el.value:""; });
      if(R&&ti===R.c_title&&bo===R.c_body) await ivApi({action:"comment.set",id:+s.dataset.ivsave,special:sp,areas});
      else await ivApi({action:"comment.set",id:+s.dataset.ivsave,title:ti,body:bo,special:sp,areas});
      IV.edit=null; toast("저장했어요"); }catch(err){ alert(err.message); } await ivLoad(false); return true; }
  const rs=t.closest("[data-ivreset]"); if(rs){ if(!confirm("조교 메모로 되돌릴까요?")) return true; try{ await ivApi({action:"comment.set",id:+rs.dataset.ivreset,reset:true}); IV.edit=null; }catch(err){ alert(err.message); } await ivLoad(false); return true; }
  const lk=t.closest("[data-ivlink]"); if(lk){ try{ const j=await ivApi({action:"tokens",ids:[+lk.dataset.ivlink]}); const R=IV.list.find(x=>String(x.id)===lk.dataset.ivlink);
      const ok=await copyText(`헤이즐 쌤과 ${R.data.name}의 1:1 밀착인터뷰 결과(${R.day.slice(5).replace("-",".")})\n${location.origin}/iv/${j.tokens[lk.dataset.ivlink]}?d=${R.day}`); toast(ok?"인터뷰 리포트 링크를 복사했어요":"복사가 안 돼요"); }catch(err){ alert(err.message); } return true; }
  return false;
}
async function namesClick(t){
  if(await ivClick(t)) return true;
  if(t.closest("#names-btn")){ VIEW="names"; render(); scrollTo({top:0}); return true; }
  if(t.closest("#names-close")){ VIEW=""; render(); return true; }
  const mg=t.closest("[data-merge]"), go=t.closest("#mg-go");
  if(mg||go){
    const from=mg?mg.dataset.merge:$("#mg-from").value.trim(), to=mg?mg.dataset.into:$("#mg-to").value.trim();
    if(!from||!to||from===to){ toast("두 이름을 골라 주세요"); return true; }
    if(!confirm(`'${from}'의 기록을 모두 '${to}'(으)로 합칠까요?\n같은 학생일 때만 합치세요. 되돌릴 수 없어요.`)) return true;
    try{ const j=await api({action:"student.merge",from,to}); delete TOK[from]; await load(); RES=null; render(); toast(`합쳤어요 · 시험 기록 ${j.moved}건 옮김`); }catch(err){ alert(err.message); }
    return true; }
  const dn=t.closest("[data-delname]"); if(dn){ const s=dn.dataset.delname;
    if(!confirm(`'${s}' 이름의 시험 기록을 모두 지울까요? 되돌릴 수 없어요.`)) return true;
    try{ const r=await fetch("/api/delete",{method:"POST",headers:{"x-pin":PIN,"content-type":"application/json"},body:JSON.stringify({student:s})}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||"지우지 못했어요");
      await load(); RES=null; render(); toast("지웠어요"); }catch(err){ alert(err.message); }
    return true; }
  const ab=t.closest("[data-att]"); if(ab){ const s=ab.dataset.as, k=ab.dataset.att, cur=attRec(s,AD);
    try{ await setAtt(s, cur&&cur.status===k?"":k); render(); if((k==="late"||k==="absent"||k==="etc")&&!(cur&&cur.status===k)){ const m=document.querySelector(`[data-am="${CSS.escape(s)}"]`); if(m) m.focus(); } }catch(err){ alert(err.message); }
    return true; }
  if(t.closest("[data-attrest]")){ try{ await api({action:"attend.rest",class_id:CUR,day:AD}); await load(); render(); toast("미체크 학생을 정시로 표시했어요"); }catch(err){ alert(err.message); } return true; }
  const fo=t.closest("[data-focus]"); if(fo){ const s=fo.dataset.focus, cur=focusOf(s);
    const v=prompt(`${s} — ★ 집중관리 사유 (검사표·반 화면에 표시돼요)\n비우고 확인하면 해제돼요.`, cur||""); if(v===null) return true;
    try{ await api({action:"member.focus",class_id:CUR,student:s,focus:v.trim()}); await load(); render(); toast(v.trim()?`${s} ★ 집중관리로 표시했어요`:`${s} 집중관리 해제`); }catch(err){ alert(err.message); }
    return true; }
  if(t.closest("#sheet-pdf")||t.closest("#sheet-print")){ const d=$("#sheet-day")&&$("#sheet-day").value; if(d) await sheetPDF(d, !!t.closest("#sheet-print")); return true; }
  if(t.closest("#backup-btn")){ await backup(); return true; }
  return false;
}
/* ── 💾 엑셀 백업 ── */
async function backup(){
  toast("백업 파일을 만드는 중…");
  try{
    const j=await api({action:"export"});
    if(!window.XLSX) await new Promise((ok,no)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload=ok; sc.onerror=()=>no(new Error("엑셀 도구를 불러오지 못했어요")); document.head.appendChild(sc); });
    const KS={done:"완료",part:"일부",none:"안 함",skip:"면제"}, dt=v=>v?new Date(v).toLocaleString("ko-KR"):"";
    const sh=(rows,map)=>XLSX.utils.json_to_sheet(rows.map(map));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, sh(j.classes,r=>({반:r.name,시험이름:r.exam_name,시험날짜:r.exam_date})),"반");
    XLSX.utils.book_append_sheet(wb, sh(j.members,r=>({반:r.class_name,학생:r.student})),"명단");
    XLSX.utils.book_append_sheet(wb, sh(j.items,r=>({날짜:r.day,반:r.class_name,숙제:r.title,메모:r.memo})),"숙제");
    XLSX.utils.book_append_sheet(wb, sh(j.checks,r=>({날짜:r.day,반:r.class_name,숙제:r.title,학생:r.student,결과:KS[r.status]||r.status,점수:r.score??"",메모:r.memo,검사시각:dt(r.checked_at)})),"숙제검사");
    XLSX.utils.book_append_sheet(wb, sh(j.attempts,r=>({시각:dt(r.created_at),학생:r.student,반:r.class_name,교재:r.book,시험:r.part_name,범위:r.scope,문항:r.total,정답:r.correct,"정답률(%)":r.pct,"걸린시간(초)":r.secs})),"시험기록");
    XLSX.utils.book_append_sheet(wb, sh(j.notes,r=>({날짜:r.day,학생:r.student,종류:{day:"하루",week:"주간",month:"월간"}[r.kind]||r.kind,요약:r.headline,한마디:r.note})),"선생님한마디");
    XLSX.utils.book_append_sheet(wb, sh(j.views,r=>({리포트날짜:r.day,학생:r.student,처음열람:dt(r.first_at),마지막열람:dt(r.last_at),횟수:r.n})),"학부모열람");
    XLSX.writeFile(wb, `스터디로그_백업_${today()}.xlsx`);
    toast(`백업 완료 · 시험 ${j.attempts.length}건 · 숙제검사 ${j.checks.length}건`);
  }catch(err){ alert(err.message); }
}
/* ── 🕘 출결: 정시 · 지각 · 결석 · 기타 ── */

  const amI=e.target.closest&&e.target.closest("[data-am]"); if(amI){ const s=amI.dataset.am, cur=attRec(s,AD);
    try{ await setAtt(s, cur?cur.status:"etc", amI.value.trim()); if(!cur) render(); toast(cur?"메모 저장":"메모 저장 · 상태는 📝기타로 표시했어요"); }catch(err){ alert(err.message); } return; }
  if(e.target.id==="v-day"){ VD=e.target.value||today(); render(); return; }
  if(e.target.id==="g-day"){ GR.day=e.target.value||today(); render(); return; }
  const gmi=e.target.closest("[data-gm]"); if(gmi){ const it=gmi.dataset.gm, st=gmi.dataset.gs, cur=DB.checks.find(k=>+k.item_id===+it&&k.student===st);
    if(!cur){ if(!gmi.value.trim()) return; try{ await setCheck(it,st,"part",gmi.value); toast("메모 저장 · 상태는 🟡일부로 표시했어요 (칸을 눌러 바꾸세요)"); render(); }catch(err){ alert(err.message); } return; }
    try{ await setCheck(it,st,cur.status,gmi.value); toast("메모 저장"); }catch(err){ alert(err.message); } return; } const row=e.target.closest(".ck"); if(row && (e.target.classList.contains("sc")||e.target.classList.contains("mm"))) saveCheck(row); });
let WASN=NARROW(); window.addEventListener("resize",()=>{ const n=NARROW(); if(n!==WASN&&DB&&TAB==="hw"&&VIEW!=="names") render(); WASN=n; });
$("#pin-go").onclick=async()=>{ PIN=$("#pin").value.trim(); $("#pin-err").textContent="";
  try{ await load(); try{localStorage.setItem("naesinfit.pin",PIN);}catch(e){} $("#gate").hidden=true; $("#app").hidden=false; render(); }catch(e){ $("#pin-err").textContent=e.message; } };
$("#pin").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#pin-go").click(); });
(async()=>{ if(PIN){ try{ await load(); try{localStorage.setItem("naesinfit.pin",PIN);}catch(e){} $("#gate").hidden=true; $("#app").hidden=false; render(); }catch(e){ PIN=""; } } })();
