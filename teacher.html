<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hazel_studylog · 선생님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Archivo:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#EEEFF5; --surface:#fff; --surface-2:#F7F7FB; --surface-3:#EFEFF6;
  --line:#E4E4EF; --line-2:#D8D8E6;
  --ink:#16151F; --ink-2:#55536A; --ink-3:#8A87A0;
  --accent:#6B4EFF; --accent-soft:#EDE9FF; --on-accent:#fff;
  --ok:#12A150; --ok-soft:#E4F5EA; --no:#E5484D; --no-soft:#FCEBEB; --warn:#E8890C; --warn-soft:#FDF1E0;
  --shadow:0 1px 2px rgba(22,21,31,.05), 0 10px 26px -16px rgba(22,21,31,.30);
  --grid:rgba(22,21,31,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E0E17; --surface:#1A1A27; --surface-2:#21212F; --surface-3:#282838;
  --line:#2C2C3D; --line-2:#3A3A4E; --ink:#F1F0F8; --ink-2:#A7A4BB; --ink-3:#7B7894;
  --accent:#8E76FF; --accent-soft:#241F42; --on-accent:#12101F;
  --ok:#3ECF7E; --ok-soft:#12301F; --no:#FF6B6F; --no-soft:#3A1B1E; --warn:#F2A93B; --warn-soft:#382712;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -18px rgba(0,0,0,.85); --grid:rgba(241,240,248,.09);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Gothic A1','Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.bar h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.bar .sub{font-size:12.5px;color:var(--ink-3)}
.btn{display:inline-block;padding:9px 15px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-2);text-decoration:none}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px}
.sec h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.sec .note{font-size:12.5px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{padding:18px 16px;text-align:center}
.tile b{display:block;font-family:'Archivo',sans-serif;font-size:29px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.tile span{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em;padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;font-family:'Archivo',sans-serif}
.p-hi{background:var(--ok-soft);color:var(--ok)} .p-mid{background:var(--accent-soft);color:var(--accent)} .p-lo{background:var(--no-soft);color:var(--no)}
.vd{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.vd.pass{background:var(--ok-soft);color:var(--ok)}
.vd.part{background:#FFF3D6;color:#B87A00}
.vd.full{background:var(--no-soft);color:var(--no)}
.vd.todo{background:var(--accent-soft);color:var(--accent)}
@media (prefers-color-scheme: dark){ .vd.part{background:#3A2E10;color:#F0C34B} }
.meter{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:12px;padding:8px 0}
.meter .lb{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.meter .tr{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.meter .tr>i{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--accent)}
.meter .vl{font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.meter .tr>i.lo{background:var(--no)} .meter .tr>i.hi{background:var(--ok)}
.gate{max-width:400px;margin:14vh auto;padding:0 20px}
.gate h2{margin:0 0 6px;font-size:23px;font-weight:800;letter-spacing:-.02em}
.gate p{margin:0 0 22px;font-size:14px;color:var(--ink-2)}
.gate input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);font-size:16px;font-weight:600}
.gate input:focus{border-color:var(--accent);outline:none}
.gate button{width:100%;margin-top:12px;padding:15px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:15.5px;font-weight:800}
.err{color:var(--no);font-size:13px;font-weight:700;margin-top:10px;min-height:19px}
.empty{text-align:center;padding:56px 24px;color:var(--ink-3)}
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);max-width:640px;width:calc(100% - 32px);box-shadow:0 30px 70px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,10,20,.5)}
.dl-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dl-b{padding:8px 20px 20px;max-height:65vh;overflow:auto}
.wrongrow{padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6}
.wrongrow:last-child{border-bottom:0}
.k{color:var(--ink-3);font-weight:700;margin-right:6px;font-size:12px}
.bad{color:var(--no);font-weight:700;text-decoration:line-through}
.good{color:var(--ok);font-weight:700}
.tabsw{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabsw button{padding:9px 14px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-3)}
.tabsw button.on{background:var(--accent);color:var(--on-accent)}
/* 지필 점수 일괄 입력 */
#pdlg{max-width:min(1100px,calc(100% - 24px))}
.pgrid{width:auto;min-width:0;font-size:13px;border-collapse:separate;border-spacing:0}
.pgrid th,.pgrid td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.pgrid .pstk{position:sticky;left:0;background:var(--surface);z-index:2;min-width:92px;max-width:140px;box-shadow:1px 0 0 var(--line)}
.pgrid td.pstk b{display:block;font-size:13.5px}
.pgrid td.pstk a{font-size:11px;color:var(--accent);text-decoration:none;font-weight:700}
.pgrid .pch{min-width:150px;width:150px;background:var(--surface-2);color:var(--ink);font-size:12px;letter-spacing:0}
.pgrid .pch input,.pgrid .pch select{width:100%;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);font:inherit;font-size:12.5px;color:var(--ink)}
.pgrid .pch .pnm{font-weight:800}
.pgrid .pch select{display:block;margin-top:5px;font-size:11.5px;color:var(--ink-2)}
.pgrid .pdel{flex:none;width:26px;height:26px;border-radius:8px;color:var(--ink-3);font-size:13px}
.pgrid .pdel:hover{background:var(--no-soft);color:var(--no)}
.psv{display:block;margin-top:5px;font-size:10.5px;font-weight:800;color:var(--ok)} .psv.new{color:var(--accent)}
.psc{width:64px;text-align:center;padding:7px 4px;border-radius:9px;border:1.5px solid var(--line-2);background:var(--surface);font:inherit;font-weight:700;color:var(--ink)}
.psc:focus,.pgrid .pch input:focus{border-color:var(--accent);outline:none}
.psc.chg{background:var(--accent-soft)} .psc.bad{border-color:var(--no)}
.ppc{display:inline-block;min-width:38px;margin-left:6px;font-size:11.5px;font-weight:800;font-family:'Archivo',sans-serif;vertical-align:middle;border-radius:99px;padding:2px 6px;text-align:center}
.ppc.bad{color:var(--no);font-family:inherit}
.pavg{font-size:12px}
.pf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin:14px 0 6px}
.pf label{display:block;font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:4px}
.pf select,.pf input,.pin{width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}
.pf .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{padding:5px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2)}
.chips button.on{background:var(--accent-soft);color:var(--accent)}
.ptab td{padding:7px 10px}
.ptab input{width:92px;text-align:center;padding:8px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font:inherit;font-weight:700;color:var(--ink)}
.ptab input:focus,.pf select:focus,.pf input:focus{border-color:var(--accent);outline:none}
.pmsg{font-size:13px;font-weight:700;min-height:20px;margin-top:10px}
@media (max-width:560px){ .pf{grid-template-columns:1fr} .bar-in{flex-wrap:wrap} }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>hazel_studylog</h2>
  <p>선생님 대시보드 · 비밀번호를 입력하세요.<br><span style="font-size:12.5px;color:var(--ink-3)">이 기기에서 한 번만 입력하면 다음부터는 바로 들어가요.</span></p>
  <input id="pin" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="pin-go">들어가기</button>
  <div class="err" id="pin-err"></div>
</div>

<div id="app" hidden>
  <header class="bar"><div class="bar-in">
    <div style="flex:1">
      <h1>hazel_studylog</h1>
      <div class="sub" id="bar-sub">불러오는 중…</div>
    </div>
    <a class="btn pri" href="hw">반별 관리 · 리포트 보내기</a>
    <a class="btn" href="report" target="_blank" rel="noopener">리포트 만들기</a>
    <button class="btn pri" id="paper-open">✍️ 지필 점수 입력</button>
    <button class="btn" id="csv">CSV 내려받기</button>
    <button class="btn pri" id="reload">새로고침</button>
  </div></header>

  <div class="wrap">
    <div class="sec"><h2>교재 · 과</h2><span class="note">고르면 아래 전체가 그 교재 기준으로 바뀝니다</span></div>
    <div class="tabsw" id="btabs"></div>

    <div class="sec"><h2>오늘</h2><span class="note" id="today-date"></span></div>
    <div class="card" id="today-card" style="padding:18px 20px"></div>

    <div class="sec"><h2>누적</h2><span class="note" id="upd"></span></div>
    <div class="tiles" id="tiles"></div>

    <div class="sec"><h2>학생별</h2><span class="note">이름을 누르면 응시 내역이 열려요</span></div>
    <div class="card scroll"><table id="stu"></table></div>

    <div class="sec"><h2>파트별 평균 정답률</h2><span class="note">낮은 파트가 보강 1순위</span></div>
    <div class="card" style="padding:18px 20px" id="parts"></div>

    <div class="sec"><h2>많이 틀린 문항</h2><span class="note">오답률 높은 순 · 2명 이상 푼 것만</span></div>
    <div class="tabsw" id="ptabs"></div>
    <div class="card scroll"><table id="items"></table></div>

    <div class="sec"><h2>최근 응시</h2><span class="note">최근 60건</span></div>
    <div class="card scroll"><table id="recent"></table></div>
  </div>
</div>

<dialog id="pdlg"><div class="dl-h"><b>✍️ 지필 점수 입력</b><button class="btn" id="p-close">닫기</button></div><div class="dl-b" id="p-body" style="max-height:75vh"></div></dialog>
<dialog id="dlg"><div class="dl-h"><b id="dlg-t">상세</b><button class="btn" onclick="document.getElementById('dlg').close()">닫기</button></div><div class="dl-b" id="dlg-b"></div></dialog>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PARTNAMES={wmean:"단어 뜻 쓰기",wsyn:"유의어 객관식",wsynw:"유의어 주관식",wdef:"영영풀이",vocab:"어휘 선택",gram:"어법 선택",word:"단어 밑줄",word2:"통변형 ②",fixg:"통변형 ③ 어법 집중",fixv:"통변형 ④ 어휘 집중",fix:"어법 오류 수정",tf:"내용일치 TF",order:"순서 배열",insert:"문장 삽입",arrange:"단어배열",write:"영작",twrite:"주제문 영작",cloze:"빈칸 추론",choice:"독해",sjt:"영문선지 비법 TEST",gbbw:"어법 비법 밑줄 고치기",gbb:"어법 비법 TEST",vbbw:"어휘 비법 밑줄 고치기",vbb:"어휘 비법 TEST",mwrite:"중요 문장 영작",review:"오답노트(전체)"};
const ORDER=["wmean","wsyn","wsynw","wdef","twrite","cloze","vocab","gram","word","word2","fix","fixg","fixv","tf","choice","sjt","gbbw","gbb","vbbw","vbb","order","insert","arrange","mwrite","write"];
let PIN=(()=>{try{return localStorage.getItem("naesinfit.pin")||sessionStorage.getItem("naesinfit.pin")||""}catch(e){return ""}})(), ALL=[], ROWS=[], TAB="all", BOOK="all";

const pctClass=p=>p>=90?"p-hi":p>=75?"p-mid":"p-lo";
const VD_PASS=90, VD_PART=75;
let MF={books:[]};
const vd=(p,done)=> (done!=null&&done<100) ? {k:"todo",n:`진행 ${done}%`}
                  : p>=VD_PASS?{k:"pass",n:"통과"}:p>=VD_PART?{k:"part",n:"부분 재시험"}:{k:"full",n:"전체 재시험"};
const vdPill=(p,done)=>`<span class="vd ${vd(p,done).k}">${vd(p,done).n}</span>`;
function unitByBook(book, uid){
  if(uid) for(const b of (MF.books||[])) for(const u of (b.units||[]))      // 저장된 단원 id가 있으면 그게 정답
    if(u.id===String(uid).replace(/ak$/,"")) return u;
  for(const b of (MF.books||[])) for(const u of (b.units||[]))   // 과목·출판사·과가 정확히 같은 단원 먼저
    if(book===`${b.subject} · ${b.publisher} · ${u.no}`) return u;
  for(const b of (MF.books||[])) for(const u of (b.units||[]))
    if(book && book.includes(u.no) && book.includes(b.publisher)) return u;
  for(const b of (MF.books||[])) for(const u of (b.units||[]))
    if(book && book.includes(u.no)) return u;
  return null;
}
const uidOf=rows=>{ const c={}; rows.forEach(x=>{ if(x.unit_id) c[x.unit_id]=(c[x.unit_id]||0)+1; });
  return (Object.entries(c).sort((a,b)=>b[1]-a[1])[0]||[])[0]||""; };
/* 학생의 '지금 보는 과' = 가장 최근 학습일에 가장 많이 푼 과 */
const dk0=v=>{const d=new Date(v);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
function mainBookOf(rows){
  if(!rows.length) return "";
  const last=rows.reduce((m,x)=>+new Date(x.created_at)>+new Date(m.created_at)?x:m,rows[0]), ld=dk0(last.created_at), w={};
  rows.filter(x=>dk0(x.created_at)===ld).forEach(x=>{w[x.book]=(w[x.book]||0)+x.total;});
  return Object.entries(w).sort((a,b)=>b[1]-a[1])[0][0];
}
const lastDayOf=rows=>{ if(!rows.length) return ""; const l=rows.reduce((m,x)=>+new Date(x.created_at)>+new Date(m.created_at)?x:m,rows[0]); const d=new Date(l.created_at),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const repHref=(n,rows)=>`report?student=${encodeURIComponent(n)}&book=${encodeURIComponent(mainBookOf(rows))}&day=${lastDayOf(rows)}`;   // 그 학생이 마지막으로 본 날 · 그날 과로 고정
function nPartsOf(rows){
  const mb=mainBookOf(rows), main=mb?[mb]:null;
  const u=main&&unitByBook(main[0], uidOf(rows.filter(x=>x.book===main[0])));
  return (u&&u.pts)?Object.keys(u.pts).length:7;
}
/* 학생의 주력 교재 소화율 = 응시한 파트 배점 합 ÷ 교재 전체 배점 */
function doneRateOf(rows){
  const byBook={};
  rows.forEach(r=>{const o=byBook[r.book]=byBook[r.book]||{t:0,parts:new Set()}; o.t+=r.total; o.parts.add(r.part);});
  const mb=mainBookOf(rows); if(!mb) return null;
  const main=[mb,byBook[mb]];
  const u=unitByBook(main[0], uidOf(rows.filter(x=>x.book===main[0])));
  if(!u || !u.pts || !u.total) return null;
  const done=Object.keys(u.pts).filter(k=>main[1].parts.has(k)).reduce((s,k)=>s+u.pts[k],0);
  return Math.min(100, Math.round(done/u.total*100));
}
const fmt=d=>{const x=new Date(d);const p=n=>String(n).padStart(2,"0");
  return `${x.getFullYear()}.${p(x.getMonth()+1)}.${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}`;};

async function load(){
  const r=await fetch("/api/results",{headers:{"x-pin":PIN}});
  if(r.status===401){ const j=await r.json().catch(()=>({})); throw new Error(j.error||"비밀번호가 맞지 않습니다"); }
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||"불러오지 못했습니다"); }
  const j=await r.json(); ALL=(j.rows||[]).map(x=>({...x, book:String(x.book||"").replace(/\s*올킬\s*$/,"").trim()}));
  try{ const cr=await fetch("content/index.json",{cache:"no-store"}); if(cr.ok) MF=await cr.json(); }catch(e){}
}
$("#pin-go").onclick=async()=>{
  PIN=$("#pin").value.trim(); $("#pin-err").textContent="";
  try{ await load(); try{localStorage.setItem("naesinfit.pin",PIN);}catch(e){} $("#gate").hidden=true; $("#app").hidden=false; render(); if(location.hash==="#paper") openPaper(); }
  catch(e){ $("#pin-err").textContent=e.message; }
};
$("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("#pin-go").click();});
$("#reload").onclick=async()=>{ try{ await load(); render(); }catch(e){ alert(e.message); } };

function render(){
  const books=[...new Set(ALL.map(x=>x.book).filter(Boolean))].sort();
  if(BOOK!=="all" && !books.includes(BOOK)) BOOK="all";
  ROWS = BOOK==="all" ? ALL : ALL.filter(x=>x.book===BOOK);
  $("#btabs").innerHTML = books.length>1
    ? [["all","전체 교재"]].concat(books.map(b=>[b,b])).map(([k,n])=>
        `<button data-book="${esc(k)}"${BOOK===k?' class="on"':""}>${esc(n)}</button>`).join("")
    : (books[0]?`<div style="font-size:13.5px;color:var(--ink-3);font-weight:600">${esc(books[0])}</div>`:"");
  const R=ROWS;
  $("#bar-sub").textContent = R.length ? `${new Set(R.map(x=>x.student)).size}명 · 총 ${R.length}회 응시` : "아직 응시 기록이 없습니다";
  $("#upd").textContent = "갱신 "+fmt(Date.now());
  const dkey=v=>{const d=new Date(v);const p=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
  const tk=dkey(new Date());
  const todayRows=R.filter(x=>dkey(x.created_at)===tk);
  const today=new Date().toDateString();

  /* ── 오늘 ── */
  $("#today-date").textContent=tk.replace(/-/g,".");
  if(!todayRows.length){
    $("#today-card").innerHTML=`<div style="color:var(--ink-3);font-size:14px">오늘 응시한 학생이 아직 없습니다.</div>`;
  } else {
    const tS=new Set(todayRows.map(x=>x.student));
    const tt=todayRows.reduce((s,x)=>s+x.total,0), tc=todayRows.reduce((s,x)=>s+x.correct,0);
    const perS={};
    todayRows.forEach(x=>{const o=perS[x.student]=perS[x.student]||{t:0,c:0,n:0,parts:[]};
      o.t+=x.total;o.c+=x.correct;o.n++;o.parts.push(PARTNAMES[x.part]||x.part_name||x.part);});
    const list=Object.entries(perS).map(([n,o])=>({n,pct:Math.round(o.c/o.t*100),cnt:o.n,parts:o.parts,
        done:doneRateOf(R.filter(x=>x.student===n))}))
      .sort((a,b)=>a.pct-b.pct);
    $("#today-card").innerHTML=`
      <div style="display:flex;gap:26px;flex-wrap:wrap;align-items:baseline">
        <div><b class="num" style="font-size:30px;font-weight:700">${tS.size}</b>
          <span style="font-size:12.5px;color:var(--ink-3);margin-left:5px">명 응시</span></div>
        <div><b class="num" style="font-size:30px;font-weight:700">${todayRows.length}</b>
          <span style="font-size:12.5px;color:var(--ink-3);margin-left:5px">회</span></div>
        <div><b class="num" style="font-size:30px;font-weight:700;color:${tc/tt>=.9?"var(--ok)":tc/tt<.75?"var(--no)":"var(--accent)"}">${Math.round(tc/tt*100)}%</b>
          <span style="font-size:12.5px;color:var(--ink-3);margin-left:5px">정답률 · ${tc}/${tt}</span></div>
      </div>
      <div style="margin-top:16px;display:grid;gap:8px">
        ${list.map(x=>`<div style="display:flex;align-items:center;gap:10px">
          <span class="pill ${pctClass(x.pct)}" style="min-width:46px;text-align:center">${x.pct}%</span>
          ${vdPill(x.pct, x.done)}
          <button style="font-weight:700;color:var(--accent)" data-stu="${esc(x.n)}">${esc(x.n)}</button>
          <span style="font-size:12.5px;color:var(--ink-3)">${x.parts.slice(0,3).map(esc).join(" · ")}${x.parts.length>3?` 외 ${x.parts.length-3}`:""}</span>
          <span class="num" style="margin-left:auto;font-size:12.5px;color:var(--ink-3)">${x.cnt}회</span>
          <a class="btn" style="padding:5px 11px;font-size:11.5px" href="${repHref(x.n, todayRows.filter(y=>y.student===x.n))}" target="_blank" rel="noopener">리포트</a>
        </div>`).join("")}
      </div>`;
  }
  const tot=R.reduce((s,x)=>s+x.total,0), cor=R.reduce((s,x)=>s+x.correct,0);
  $("#tiles").innerHTML=[
    ["응시 학생", new Set(R.map(x=>x.student)).size, ""],
    ["총 응시", R.length, ""],
    ["평균 정답률", tot?Math.round(cor/tot*100)+"%":"—", tot?(cor/tot>=.9?"var(--ok)":cor/tot<.75?"var(--no)":""):""],
    ["학습한 날", new Set(R.map(x=>dkey(x.created_at))).size, ""]
  ].map(([l,v,c])=>`<div class="card tile"><b class="num"${c?` style="color:${c}"`:""}>${v}</b><span>${l}</span></div>`).join("");

  if(!R.length){
    $("#stu").innerHTML=`<tr><td class="empty">학생이 링크로 접속해 응시하면 여기에 쌓입니다</td></tr>`;
    $("#parts").innerHTML=`<div class="empty">아직 데이터가 없습니다</div>`;
    $("#items").innerHTML=""; $("#recent").innerHTML=""; $("#ptabs").innerHTML=""; return;
  }

  /* 학생별 */
  const byS={};
  R.forEach(r=>{ (byS[r.student]=byS[r.student]||[]).push(r); });
  const studs=Object.entries(byS).map(([n,rs])=>{
    const t=rs.reduce((s,x)=>s+x.total,0), c=rs.reduce((s,x)=>s+x.correct,0);
    const parts=new Set(rs.map(x=>x.part));
    return {n, cnt:rs.length, pct:Math.round(c/t*100), parts:parts.size, done:doneRateOf(rs), np:nPartsOf(rs),
            last:rs.reduce((m,x)=>Math.max(m,+new Date(x.created_at)),0)};
  }).sort((a,b)=>a.pct-b.pct);
  $("#stu").innerHTML=`<thead><tr><th>이름</th><th>정답률</th><th>판정</th><th>응시</th><th>진행 파트</th><th>마지막 응시</th><th></th></tr></thead><tbody>`+
    studs.map(s=>`<tr><td><button style="font-weight:700;color:var(--accent)" data-stu="${esc(s.n)}">${esc(s.n)}</button></td>
      <td><span class="pill ${pctClass(s.pct)}">${s.pct}%</span></td>
      <td>${vdPill(s.pct, s.done)}</td>
      <td class="num">${s.cnt}회</td><td class="num">${s.parts} / ${s.np||7}</td>
      <td style="color:var(--ink-3);font-size:13px">${fmt(s.last)}</td>
      <td><a class="btn" href="${repHref(s.n, byS[s.n])}" target="_blank" rel="noopener">리포트</a></td></tr>`).join("")+`</tbody>`;

  /* 파트별 */
  const byP={};
  R.forEach(r=>{ const p=byP[r.part]=byP[r.part]||{t:0,c:0,n:0}; p.t+=r.total; p.c+=r.correct; p.n++; });
  $("#parts").innerHTML=ORDER.map(p=>{
    const v=byP[p]; const pct=v?Math.round(v.c/v.t*100):null;
    return `<div class="meter"><span class="lb">${PARTNAMES[p]}</span>
      <span class="tr"><i class="${pct==null?"":pct>=90?"hi":pct<75?"lo":""}" style="width:${pct||0}%"></i></span>
      <span class="vl">${pct==null?"—":pct+"%"}</span></div>`;}).join("");

  /* 문항별 오답률 */
  const agg={};
  R.forEach(r=>(r.detail||[]).forEach(it=>(it.d||[]).forEach(x=>{
    const k=`${r.part}|${it.sec}|${it.no}|${x.l}`;
    const a=agg[k]=agg[k]||{part:r.part,sec:it.sec,no:it.no,l:x.l,n:0,w:0,ex:null};
    a.n++; if(!x.ok){ a.w++; if(!a.ex) a.ex={m:x.m,r:x.r}; }
  })));
  const list=Object.values(agg).filter(a=>a.n>=2&&a.w>0)
    .filter(a=>TAB==="all"||a.part===TAB)
    .map(a=>({...a,rate:Math.round(a.w/a.n*100)}))
    .sort((a,b)=>b.rate-a.rate||b.n-a.n).slice(0,40);
  $("#ptabs").innerHTML=[["all","전체"]].concat(ORDER.filter(p=>byP[p]).map(p=>[p,PARTNAMES[p]]))
    .map(([k,n])=>`<button data-tab="${k}"${TAB===k?' class="on"':""}>${n}</button>`).join("");
  $("#items").innerHTML = list.length
    ? `<thead><tr><th>파트</th><th>위치</th><th>번호</th><th>오답률</th><th>틀린 답 예시</th><th>정답</th></tr></thead><tbody>`+
      list.map(a=>`<tr><td>${PARTNAMES[a.part]}</td>
        <td style="color:var(--ink-3)">${esc(a.sec||"")} ${a.no}</td>
        <td class="num">${esc(a.l)}</td>
        <td><span class="pill ${a.rate>=60?"p-lo":a.rate>=30?"p-mid":"p-hi"}">${a.rate}%</span>
          <span style="color:var(--ink-3);font-size:12px" class="num"> ${a.w}/${a.n}</span></td>
        <td class="bad">${esc(a.ex?.m||"")}</td><td class="good">${esc(a.ex?.r||"")}</td></tr>`).join("")+`</tbody>`
    : `<tr><td class="empty">2명 이상이 같은 문항을 풀면 집계됩니다</td></tr>`;

  /* 최근 응시 */
  $("#recent").innerHTML=`<thead><tr><th>시각</th><th>이름</th><th>교재·과</th><th>파트</th><th>범위</th><th>점수</th><th></th></tr></thead><tbody>`+
    R.slice(0,60).map(r=>`<tr>
      <td style="color:var(--ink-3);font-size:13px">${fmt(r.created_at)}</td>
      <td style="font-weight:700">${esc(r.student)}</td>
      <td style="color:var(--ink-3);font-size:13px">${esc(r.book||"")}</td>
      <td>${PARTNAMES[r.part]||esc(r.part_name||r.part)}</td>
      <td style="color:var(--ink-3)">${r.scope==="all"?"전체":esc(r.scope)}</td>
      <td><span class="pill ${pctClass(r.pct)}">${r.pct}%</span> <span class="num" style="color:var(--ink-3);font-size:12px">${r.correct}/${r.total}</span></td>
      <td>${r.scope==="동형"?`<span style="font-size:12px;color:var(--ink-3)">📝 동형 OMR</span>`:r.scope==="지필"?`<span style="font-size:12px;color:var(--ink-3)">✍️ 수기 입력</span>`:`<button class="btn" data-att="${r.id}">오답 보기</button>`}</td></tr>`).join("")+`</tbody>`;
}

document.addEventListener("click",e=>{
  const bk=e.target.closest("[data-book]"); if(bk){ BOOK=bk.dataset.book; TAB="all"; render(); return; }
  const t=e.target.closest("[data-tab]"); if(t){ TAB=t.dataset.tab; render(); return; }
  const s=e.target.closest("[data-stu]"); if(s){ openStudent(s.dataset.stu); return; }
  const a=e.target.closest("[data-att]"); if(a){ openAttempt(+a.dataset.att); return; }
});
function openStudent(n){
  const rs=ROWS.filter(r=>r.student===n);
  $("#dlg-t").textContent=`${n} · ${rs.length}회 응시`;
  $("#dlg-b").innerHTML=`<table><thead><tr><th>시각</th><th>파트</th><th>점수</th><th></th></tr></thead><tbody>`+
    rs.map(r=>`<tr><td style="color:var(--ink-3);font-size:13px">${fmt(r.created_at)}</td>
      <td>${PARTNAMES[r.part]||esc(r.part_name||r.part)}</td>
      <td><span class="pill ${pctClass(r.pct)}">${r.pct}%</span> <span class="num" style="font-size:12px;color:var(--ink-3)">${r.correct}/${r.total}</span></td>
      <td><button class="btn" data-att="${r.id}">오답</button></td></tr>`).join("")+`</tbody></table>`;
  $("#dlg").showModal();
}
function openAttempt(id){
  const r=ALL.find(x=>x.id===id); if(!r) return;
  const wrong=[]; const notes=[];
  (r.detail||[]).forEach(it=>{
    (it.d||[]).forEach(x=>{ if(!x.ok) wrong.push({it,x}); });
    if(it.why||it.voc) notes.push(it);
  });
  $("#dlg-t").textContent=`${r.student} · ${PARTNAMES[r.part]||r.part_name||r.part} · ${r.pct}%`;
  $("#dlg-b").innerHTML = (wrong.length
    ? wrong.map(({it,x})=>`<div class="wrongrow">
        <div style="font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:3px">${esc(it.sec||"")} ${it.no} · ${esc(x.l)}</div>
        <span class="k">학생</span><span class="bad">${esc(x.m)}</span><br>
        <span class="k">정답</span><span class="good">${esc(x.r)}</span></div>`).join("")
    : `<div class="empty">틀린 문항이 없습니다 👏</div>`)
    + (notes.length ? `<div style="margin-top:14px;font-weight:800;font-size:13px">✍️ 학생 오답 정리</div>`
      + notes.map(it=>`<div class="wrongrow">
        <div style="font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:3px">${esc(it.sec||"")} ${it.no}</div>
        ${it.why?`<span class="k">틀린 이유</span>${esc(it.why)}<br>`:""}
        ${it.voc?`<span class="k">몰랐던 단어</span>${esc(it.voc)}`:""}</div>`).join("") : "");
  $("#dlg").showModal();
}
/* ───── 지필(종이) 테스트 점수 일괄 입력 → 데일리 리포트에 반영 ─────
   숙제 검사표처럼: 줄 = 학생, 칸 = 그날 본 지필 시험들. 한 번 저장으로 전부 반영 */
let HWS=null, PF={cid:"", day:"", bi:""}, COLS=[], PD={}, CK=0;   // PD["칸|학생"] = 선생님이 친 점수
const todayKST=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const dKST=v=>new Date(+new Date(v)+9*3600e3).toISOString().slice(0,10);
const unitsAll=()=>{ const L=[]; (MF.books||[]).forEach(b=>(b.units||[]).forEach(u=>L.push({label:`${b.subject} · ${b.publisher} · ${u.no}`, id:u.id, b, u}))); return L; };
const OTHER="지필 테스트";
const paperRows=()=>ALL.filter(r=>r.scope==="지필");
const QUICK=["단어 시험","어법 시험","본문 암기","서술형","통변형","동형 지필"];
function membersOf(cid){ return HWS?(HWS.members||[]).filter(m=>+m.class_id===+cid).map(m=>m.student).sort((a,b)=>a.localeCompare(b,"ko")):[]; }
function guessBook(cid){   // 반 학생들이 최근 2주에 가장 많이 푼 과
  const ms=new Set(membersOf(cid)), lim=Date.now()-14*864e5, w={};
  ALL.forEach(r=>{ if(ms.has(r.student)&&r.scope!=="지필"&&+new Date(r.created_at)>lim) w[r.book]=(w[r.book]||0)+r.total; });
  const top=(Object.entries(w).sort((a,b)=>b[1]-a[1])[0]||[])[0]; const i=unitsAll().findIndex(x=>x.label===top);
  return i>=0?String(i):OTHER; }
const biOf=label=>{ const i=unitsAll().findIndex(x=>x.label===label); return i>=0?String(i):OTHER; };
const bookOf=bi=>{ if(bi===OTHER) return {label:OTHER,id:""}; const x=unitsAll()[+bi]; return x?{label:x.label,id:x.id}:{label:OTHER,id:""}; };
const shortBook=bi=>{ if(bi===OTHER) return "교재 무관"; const x=unitsAll()[+bi]; return x?`${x.b.publisher.replace(/\(.*\)/,"")} ${x.u.no}`:"교재 무관"; };
function newCol(name){ return {k:"c"+(++CK), bi:PF.bi, name:name||"", total:"", orig:null, have:{}}; }
function loadCols(){   // 이 반 · 이날 이미 넣은 지필 시험 → 칸으로
  const ms=new Set(membersOf(PF.cid)), g={};
  paperRows().forEach(r=>{ if(!ms.has(r.student)||dKST(r.created_at)!==PF.day) return;
    const k=r.book+"\u0001"+r.part_name, o=g[k]=g[k]||{book:r.book,name:r.part_name.replace(/^지필 · /,""),total:r.total,have:{}}; o.have[r.student]=r.correct; });
  COLS=Object.values(g).map(o=>({k:"c"+(++CK), bi:biOf(o.book), name:o.name, total:String(o.total), orig:{book:o.book,name:o.name,total:o.total}, have:o.have}));
  if(!COLS.length) COLS=[newCol("")];
  PD={};
}
async function openPaper(){
  $("#pdlg").showModal(); $("#p-body").innerHTML=`<div class="empty" style="padding:30px">불러오는 중…</div>`;
  if(!HWS){ try{ const r=await fetch("/api/hw",{headers:{"x-pin":PIN},cache:"no-store"}); HWS=await r.json(); if(!r.ok) throw new Error(HWS.error||"반 목록을 못 불러왔어요"); }catch(e){ HWS=null; $("#p-body").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; } }
  if(!PF.cid&&HWS.classes&&HWS.classes[0]) PF.cid=String(HWS.classes[0].id);
  if(!PF.day) PF.day=todayKST();
  if(!PF.bi) PF.bi=guessBook(PF.cid);
  loadCols(); drawPaper();
}
function bookOpts(sel){ const L=unitsAll(), groups=[...new Set(L.map(x=>x.b.subject+" · "+x.b.publisher))];
  return `<option value="${OTHER}"${sel===OTHER?" selected":""}>교재와 상관없는 지필 테스트</option>`+
    groups.map(g=>`<optgroup label="${esc(g)}">${L.map((x,i)=>x.b.subject+" · "+x.b.publisher===g?`<option value="${i}"${String(i)===sel?" selected":""}>${esc(x.u.no)}${x.u.title?" · "+esc(x.u.title):""}</option>`:"").join("")}</optgroup>`).join(""); }
function drawPaper(){

  $("#p-body").innerHTML=`

    <b>저장</b> 한 번이면 그날 <b>데일리 리포트</b>(시험 결과·누적·반평균)에 전부 들어가요. 빈칸 = 그 시험 안 본 학생.
    <span style="color:var(--ink-3)">엑셀에서 점수 열을 복사해 첫 칸에 붙여넣으면 아래로 쭉 채워져요.</span></p>
  <div class="pf">
    <div><label>반</label><select id="p-cls">${C.map(c=>`<option value="${c.id}"${String(c.id)===PF.cid?" selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
    <div><label>시험 본 날</label><input type="date" id="p-day" value="${PF.day}"></div>
    <div class="full"><label>새 시험 칸의 기본 교재 · 과 <span style="font-weight:500">(온라인 시험과 같은 과면 같은 리포트에 같이 나와요 · 칸마다 바꿀 수 있어요)</span></label>
      <select id="p-book">${bookOpts(PF.bi)}</select></div>
  </div>
  <div class="chips" style="margin-top:10px"><span style="font-size:12px;font-weight:700;color:var(--ink-3);align-self:center;margin-right:2px">시험 칸 추가</span>
    ${QUICK.map(t=>`<button data-padd="${t}">＋ ${t}</button>`).join("")}<button data-padd="">＋ 직접 입력</button></div>
  <div class="scroll pgrid-wrap" style="margin-top:12px"><table class="pgrid"><thead><tr><th class="pstk">학생</th>
    ${COLS.map(c=>`<th class="pch" data-pk="${c.k}">
      <div style="display:flex;gap:4px;align-items:center"><input class="pnm" data-pcol="${c.k}" data-f="name" maxlength="40" placeholder="시험 이름" value="${esc(c.name)}">
        <button class="pdel" data-pdel="${c.k}" title="이 시험 칸 지우기">✕</button></div>
      <div style="display:flex;gap:4px;align-items:center;margin-top:5px"><span style="font-size:11px;color:var(--ink-3);white-space:nowrap">만점</span>
        <input class="ptot" data-pcol="${c.k}" data-f="total" type="number" min="1" max="1000" inputmode="numeric" placeholder="문항 수" value="${esc(c.total)}"></div>
      <select class="pbk" data-pcol="${c.k}" data-f="bi" title="교재 · 과">${bookOpts(c.bi)}</select>
      ${c.orig?`<span class="psv">저장됨</span>`:`<span class="psv new">새 시험</span>`}</th>`).join("")}</tr></thead>
    <tbody>${studs.length?studs.map((st,ri)=>`<tr><td class="pstk"><b>${esc(st)}</b><a href="report?student=${encodeURIComponent(st)}&day=${PF.day}" target="_blank" rel="noopener">리포트</a></td>
      ${COLS.map((c,ci)=>`<td><input class="psc" type="number" min="0" inputmode="numeric" data-pc="${c.k}" data-ps="${esc(st)}" data-r="${ri}" data-c="${ci}" placeholder="–"><span class="ppc" data-pp="${c.k}|${esc(st)}"></span></td>`).join("")}</tr>`).join("")
      :`<tr><td class="pstk">—</td><td colspan="${COLS.length}" class="empty" style="padding:24px">이 반에 학생이 없어요 (반별 관리에서 명단을 넣어 주세요)</td></tr>`}</tbody>
    <tfoot><tr><td class="pstk">반 평균</td>${COLS.map(c=>`<td class="pavg" data-pavg="${c.k}"></td>`).join("")}</tr></tfoot>
  </table></div>
  <div style="position:sticky;bottom:-20px;z-index:3;background:var(--surface);margin:0 -20px -20px;padding:12px 20px 14px;border-top:1px solid var(--line)">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn pri" id="p-save" style="padding:11px 20px;font-size:14px">전체 저장하고 리포트에 반영</button>
    <span style="font-size:12px;color:var(--ink-3)">Enter = 아래 학생 · Tab = 옆 시험</span></div>
    <div class="pmsg" id="p-msg" style="margin-top:6px;min-height:0"></div></div>`;
  document.querySelectorAll(".psc").forEach(i=>{ const c=COLS.find(x=>x.k===i.dataset.pc), st=i.dataset.ps, key=c.k+"|"+st;
    i.value = key in PD ? PD[key] : (st in c.have ? c.have[st] : ""); });
  pctSync();
}
const colOf=k=>COLS.find(c=>c.k===k);
function pctSync(){
  COLS.forEach(c=>{ const t=+c.total||0; let n=0, sum=0, bad=0;
    document.querySelectorAll(`.psc[data-pc="${c.k}"]`).forEach(i=>{ const v=i.value===""?null:+i.value, pp=document.querySelector(`[data-pp="${CSS.escape(c.k+"|"+i.dataset.ps)}"]`);
      const over=v!==null&&(v<0||(t&&v>t)); i.classList.toggle("bad",over); const st=i.dataset.ps, key=c.k+"|"+st;
      i.classList.toggle("chg", key in PD && String(PD[key])!==String(st in c.have?c.have[st]:""));
      if(over){ bad++; pp.textContent="만점↑"; pp.className="ppc bad"; return; }
      if(v===null||!t){ pp.textContent=""; pp.className="ppc"; return; }
      const pc=Math.round(v/t*100); n++; sum+=pc; pp.textContent=pc+"%"; pp.className="ppc "+pctClass(pc); });
    const av=document.querySelector(`[data-pavg="${c.k}"]`); if(av) av.innerHTML=n?`<span class="pill ${pctClass(Math.round(sum/n))}">${Math.round(sum/n)}%</span> <span style="font-size:11px;color:var(--ink-3)">${n}명</span>`:""; });
}
$("#paper-open").onclick=openPaper;
$("#p-close").onclick=()=>$("#pdlg").close();
const pDirty=()=>Object.keys(PD).length>0 || COLS.some(c=>!c.orig&&(c.name||c.total)) || COLS.some(c=>c.orig&&(c.name!==c.orig.name||String(c.total)!==String(c.orig.total)||bookOf(c.bi).label!==c.orig.book));
$("#pdlg").addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="p-cls"||id==="p-day"){
    if(pDirty()&&!confirm("저장 안 한 점수가 있어요. 버리고 바꿀까요?")){ e.target.value=id==="p-cls"?PF.cid:PF.day; return; }
    if(id==="p-cls"){ PF.cid=e.target.value; PF.bi=guessBook(PF.cid); } else PF.day=e.target.value||todayKST();
    loadCols(); drawPaper(); }
  else if(id==="p-book"){ PF.bi=e.target.value; COLS.forEach(c=>{ if(!c.orig&&!c.name&&!Object.keys(PD).some(k=>k.startsWith(c.k+"|"))) c.bi=PF.bi; }); drawPaper(); }
  else if(e.target.dataset.f==="bi"){ colOf(e.target.dataset.pcol).bi=e.target.value; }
});
$("#pdlg").addEventListener("input",e=>{ const t=e.target;
  if(t.dataset.f==="name"){ colOf(t.dataset.pcol).name=t.value.trim(); return; }
  if(t.dataset.f==="total"){ colOf(t.dataset.pcol).total=t.value; pctSync(); return; }
  if(t.dataset.pc){ PD[t.dataset.pc+"|"+t.dataset.ps]=t.value; pctSync(); } });
$("#pdlg").addEventListener("keydown",e=>{ const t=e.target; if(!t.classList||!t.classList.contains("psc")||e.key!=="Enter") return;
  e.preventDefault(); const n=document.querySelector(`.psc[data-c="${t.dataset.c}"][data-r="${+t.dataset.r+(e.shiftKey?-1:1)}"]`); if(n){ n.focus(); n.select(); } });
$("#pdlg").addEventListener("paste",e=>{ const t=e.target; if(!t.classList||!t.classList.contains("psc")) return;
  const txt=(e.clipboardData||window.clipboardData).getData("text"); if(!/[\n\t]/.test(txt.trim())) return;
  e.preventDefault(); const lines=txt.replace(/\r/g,"").replace(/\n$/,"").split("\n");
  lines.forEach((ln,dr)=>ln.split("\t").forEach((v,dc)=>{ const i=document.querySelector(`.psc[data-c="${+t.dataset.c+dc}"][data-r="${+t.dataset.r+dr}"]`); if(!i) return;
    const x=String(v).trim().replace(/[^\d.\-]/g,""); i.value=x===""?"":String(Math.round(+x)); PD[i.dataset.pc+"|"+i.dataset.ps]=i.value; }));
  pctSync(); });
async function paperPost(body){ const r=await fetch("/api/hw",{method:"POST",headers:{"x-pin":PIN,"content-type":"application/json"},body:JSON.stringify({action:"paper.save",...body})});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||"저장하지 못했어요"); return j; }
$("#pdlg").addEventListener("click",async e=>{
  const ad=e.target.closest("[data-padd]"); if(ad){ const nm=ad.dataset.padd;
    const empty=COLS.find(c=>!c.orig&&!c.name&&!Object.keys(PD).some(k=>k.startsWith(c.k+"|")));
    let tg; if(empty){ tg=empty; if(nm) tg.name=nm; } else { tg=newCol(nm); COLS.push(tg); }
    drawPaper(); const f=document.querySelector(`.${nm?"ptot":"pnm"}[data-pcol="${tg.k}"]`); if(f){ f.focus(); f.scrollIntoView({block:"nearest",inline:"nearest"}); } return; }
  const dl=e.target.closest("[data-pdel]"); if(dl){ const c=colOf(dl.dataset.pdel);
    if(c.orig){ if(!confirm(`'${c.orig.name}' 점수를 이 반·이날에서 모두 지울까요? (리포트에서도 빠져요)`)) return;
      try{ await paperPost({day:PF.day, book:c.orig.book, unit_id:"", name:c.orig.name, total:c.orig.total, class_name:"", rows:membersOf(PF.cid).map(st=>({student:st,correct:null}))});
        await load(); render(); }catch(err){ alert(err.message); return; } }
    Object.keys(PD).forEach(k=>{ if(k.startsWith(c.k+"|")) delete PD[k]; });
    COLS=COLS.filter(x=>x!==c); if(!COLS.length) COLS=[newCol("")]; drawPaper(); return; }
  if(e.target.closest("#p-save")){
    const msg=$("#p-msg"), studs=membersOf(PF.cid), cls=(HWS.classes||[]).find(c=>String(c.id)===PF.cid);
    const val=(c,st)=>{ const key=c.k+"|"+st, v=key in PD?PD[key]:(st in c.have?c.have[st]:""); return v===""||v==null?null:Math.round(+v); };
    const work=COLS.filter(c=>c.orig||studs.some(st=>val(c,st)!==null));
    const err=t=>{ msg.style.color="var(--no)"; msg.textContent=t; };
    if(!work.length) return err("넣은 점수가 없어요");
    for(const c of work){
      const lab=c.name||"(이름 없음)";
      if(!c.name) return err("시험 이름이 빈 칸이 있어요");
      if(!(+c.total>0)) return err(`'${lab}' 만점(문항 수)을 넣어 주세요`);
      if(studs.some(st=>{ const v=val(c,st); return v!==null&&(v<0||v>+c.total); })) return err(`'${lab}'에 만점보다 큰 점수가 있어요`);
    }
    const names=work.map(c=>bookOf(c.bi).label+"|"+c.name); if(new Set(names).size!==names.length) return err("같은 교재에 같은 시험 이름이 두 칸 있어요");
    const b=e.target.closest("#p-save"); b.disabled=true; msg.style.color="var(--ink-3)";
    let saved=0, removed=0;
    try{
      for(const [n,c] of work.entries()){
        msg.textContent=`저장 중… (${n+1}/${work.length}) ${c.name}`;
        const bk=bookOf(c.bi);
        if(c.orig&&(c.orig.name!==c.name||c.orig.book!==bk.label))   // 이름·교재를 바꾼 칸 → 예전 기록 지우고 새로
          await paperPost({day:PF.day, book:c.orig.book, unit_id:"", name:c.orig.name, total:c.orig.total, class_name:"", rows:studs.map(st=>({student:st,correct:null}))});
        const j=await paperPost({day:PF.day, book:bk.label, unit_id:bk.id, name:c.name, total:+c.total, class_name:cls?cls.name:"", rows:studs.map(st=>({student:st,correct:val(c,st)}))});
        saved+=j.saved; removed+=j.removed;
      }
      await load(); render(); loadCols(); drawPaper();
      const m=$("#p-msg"); m.style.color="var(--ok)"; m.textContent=`저장했어요 · 시험 ${work.length}개 · 점수 ${saved}개 반영${removed?` · ${removed}개 지움`:""} · ${PF.day} 데일리 리포트에 나와요`;
    }catch(er){ err(er.message+" — 다시 저장을 눌러 주세요"); b.disabled=false; }
  }
});

$("#csv").onclick=()=>{
  const head=["시각","이름","교재","파트","범위","정답","전체","정답률(%)","소요(초)"];
  const rows=ALL.map(r=>[fmt(r.created_at),r.student,r.book,PARTNAMES[r.part]||r.part_name||r.part,r.scope,r.correct,r.total,r.pct,r.secs]);
  const csv="﻿"+[head,...rows].map(a=>a.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a"); a.href=url; a.download="hazel_studylog_결과.csv"; a.click(); URL.revokeObjectURL(url);
};
(async()=>{ if(PIN){ try{ await load(); try{localStorage.setItem("naesinfit.pin",PIN);}catch(e){} $("#gate").hidden=true; $("#app").hidden=false; render(); if(location.hash==="#paper") openPaper(); }catch(e){} } })();
</script>
