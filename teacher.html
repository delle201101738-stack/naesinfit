<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hazel_studylog · 선생님</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Archivo:wght@500;600;700&display=swap">
<style>
:root{
  --ground:#EEEFF5; --surface:#fff; --surface-2:#F7F7FB; --surface-3:#EFEFF6;
  --line:#E4E4EF; --line-2:#D8D8E6;
  --ink:#16151F; --ink-2:#55536A; --ink-3:#8A87A0;
  --accent:#6B4EFF; --accent-soft:#EDE9FF; --on-accent:#fff;
  --ok:#12A150; --ok-soft:#E4F5EA; --no:#E5484D; --no-soft:#FCEBEB; --warn:#E8890C; --warn-soft:#FDF1E0;
  --shadow:0 1px 2px rgba(22,21,31,.05), 0 10px 26px -16px rgba(22,21,31,.30);
  --grid:rgba(22,21,31,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E0E17; --surface:#1A1A27; --surface-2:#21212F; --surface-3:#282838;
  --line:#2C2C3D; --line-2:#3A3A4E; --ink:#F1F0F8; --ink-2:#A7A4BB; --ink-3:#7B7894;
  --accent:#8E76FF; --accent-soft:#241F42; --on-accent:#12101F;
  --ok:#3ECF7E; --ok-soft:#12301F; --no:#FF6B6F; --no-soft:#3A1B1E; --warn:#F2A93B; --warn-soft:#382712;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -18px rgba(0,0,0,.85); --grid:rgba(241,240,248,.09);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Gothic A1','Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.bar h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.bar .sub{font-size:12.5px;color:var(--ink-3)}
.btn{display:inline-block;padding:9px 15px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-2);text-decoration:none}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px}
.sec h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.sec .note{font-size:12.5px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{padding:18px 16px;text-align:center}
.tile b{display:block;font-family:'Archivo',sans-serif;font-size:29px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.tile span{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em;padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;font-family:'Archivo',sans-serif}
.p-hi{background:var(--ok-soft);color:var(--ok)} .p-mid{background:var(--accent-soft);color:var(--accent)} .p-lo{background:var(--no-soft);color:var(--no)}
.vd{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.vd.pass{background:var(--ok-soft);color:var(--ok)}
.vd.part{background:#FFF3D6;color:#B87A00}
.vd.full{background:var(--no-soft);color:var(--no)}
.vd.todo{background:var(--accent-soft);color:var(--accent)}
@media (prefers-color-scheme: dark){ .vd.part{background:#3A2E10;color:#F0C34B} }
.meter{display:grid;grid-template-columns:120px 1fr 52px;align-items:center;gap:12px;padding:8px 0}
.meter .lb{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.meter .tr{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.meter .tr>i{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--accent)}
.meter .vl{font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.meter .tr>i.lo{background:var(--no)} .meter .tr>i.hi{background:var(--ok)}
.gate{max-width:400px;margin:14vh auto;padding:0 20px}
.gate h2{margin:0 0 6px;font-size:23px;font-weight:800;letter-spacing:-.02em}
.gate p{margin:0 0 22px;font-size:14px;color:var(--ink-2)}
.gate input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);font-size:16px;font-weight:600}
.gate input:focus{border-color:var(--accent);outline:none}
.gate button{width:100%;margin-top:12px;padding:15px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:15.5px;font-weight:800}
.err{color:var(--no);font-size:13px;font-weight:700;margin-top:10px;min-height:19px}
.empty{text-align:center;padding:56px 24px;color:var(--ink-3)}
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);max-width:640px;width:calc(100% - 32px);box-shadow:0 30px 70px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,10,20,.5)}
.dl-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dl-b{padding:8px 20px 20px;max-height:65vh;overflow:auto}
.wrongrow{padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6}
.wrongrow:last-child{border-bottom:0}
.k{color:var(--ink-3);font-weight:700;margin-right:6px;font-size:12px}
.bad{color:var(--no);font-weight:700;text-decoration:line-through}
.good{color:var(--ok);font-weight:700}
.tabsw{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabsw button{padding:9px 14px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-3)}
.tabsw button.on{background:var(--accent);color:var(--on-accent)}
/* 지필 점수 일괄 입력 */
#pdlg{max-width:min(1100px,calc(100% - 24px))}
.pgrid{width:auto;min-width:0;font-size:13px;border-collapse:separate;border-spacing:0}
.pgrid th,.pgrid td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.pgrid .pstk{position:sticky;left:0;background:var(--surface);z-index:2;min-width:92px;max-width:140px;box-shadow:1px 0 0 var(--line)}
.pgrid td.pstk b{display:block;font-size:13.5px}
.pgrid td.pstk a{font-size:11px;color:var(--accent);text-decoration:none;font-weight:700}
.pgrid .pch{min-width:150px;width:150px;background:var(--surface-2);color:var(--ink);font-size:12px;letter-spacing:0}
.pgrid .pch input,.pgrid .pch select{width:100%;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--surface);font:inherit;font-size:12.5px;color:var(--ink)}
.pgrid .pch .pnm{font-weight:800}
.pgrid .pch select{display:block;margin-top:5px;font-size:11.5px;color:var(--ink-2)}
.pgrid .pdel{flex:none;width:26px;height:26px;border-radius:8px;color:var(--ink-3);font-size:13px}
.pgrid .pdel:hover{background:var(--no-soft);color:var(--no)}
.psv{display:block;margin-top:5px;font-size:10.5px;font-weight:800;color:var(--ok)} .psv.new{color:var(--accent)}
.psc{width:64px;text-align:center;padding:7px 4px;border-radius:9px;border:1.5px solid var(--line-2);background:var(--surface);font:inherit;font-weight:700;color:var(--ink)}
.psc:focus,.pgrid .pch input:focus{border-color:var(--accent);outline:none}
.psc.chg{background:var(--accent-soft)} .psc.bad{border-color:var(--no)}
.ppc{display:inline-block;min-width:38px;margin-left:6px;font-size:11.5px;font-weight:800;font-family:'Archivo',sans-serif;vertical-align:middle;border-radius:99px;padding:2px 6px;text-align:center}
.ppc.bad{color:var(--no);font-family:inherit}
.pavg{font-size:12px}
.pf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin:14px 0 6px}
.pf label{display:block;font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:4px}
.pf select,.pf input,.pin{width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--surface);font:inherit;font-size:14px;color:var(--ink)}
.pf .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{padding:5px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2)}
.chips button.on{background:var(--accent-soft);color:var(--accent)}
.ptab td{padding:7px 10px}
.ptab input{width:92px;text-align:center;padding:8px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font:inherit;font-weight:700;color:var(--ink)}
.ptab input:focus,.pf select:focus,.pf input:focus{border-color:var(--accent);outline:none}
.pmsg{font-size:13px;font-weight:700;min-height:20px;margin-top:10px}
@media (max-width:560px){ .pf{grid-template-columns:1fr} .bar-in{flex-wrap:wrap} }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>hazel_studylog</h2>
  <p>선생님 대시보드 · 비밀번호를 입력하세요.<br><span style="font-size:12.5px;color:var(--ink-3)">이 기기에서 한 번만 입력하면 다음부터는 바로 들어가요.</span></p>
  <input id="pin" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="pin-go">들어가기</button>
  <div class="err" id="pin-err"></div>
</div>

<div id="app" hidden>
  <header class="bar"><div class="bar-in">
    <div style="flex:1">
      <h1>hazel_studylog</h1>
      <div class="sub" id="bar-sub">불러오는 중…</div>
    </div>
    <a class="btn pri" href="hw">반별 관리 · 리포트 보내기</a>
    <a class="btn" href="report" target="_blank" rel="noopener">리포트 만들기</a>
    <button class="btn pri" id="paper-open">✍️ 지필 점수 입력</button>
    <button class="btn" id="csv">CSV 내려받기</button>
    <button class="btn pri" id="reload">새로고침</button>
  </div></header>

  <div class="wrap">
    <div class="sec"><h2>📊 오늘의 인사이트</h2><span class="note" style="display:flex;gap:6px;align-items:center">
      <button class="btn" style="padding:6px 10px" data-ishift="-1">◀</button><input type="date" id="ins-day" style="padding:6px 8px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface)">
      <button class="btn" style="padding:6px 10px" data-ishift="1">▶</button></span></div>
    <div class="tabsw" id="ins-cls"></div>
    <div id="ins"></div>

    <div class="sec"><h2>교재 · 과</h2><span class="note">고르면 아래 전체가 그 교재 기준으로 바뀝니다</span></div>
    <div class="tabsw" id="btabs"></div>

    <div class="sec"><h2>오늘</h2><span class="note" id="today-date"></span></div>
    <div class="card" id="today-card" style="padding:18px 20px"></div>

    <div class="sec"><h2>누적</h2><span class="note" id="upd"></span></div>
    <div class="tiles" id="tiles"></div>

    <div class="sec"><h2>학생별</h2><span class="note">이름을 누르면 응시 내역이 열려요</span></div>
    <div class="card scroll"><table id="stu"></table></div>

    <div class="sec"><h2>파트별 평균 정답률</h2><span class="note">낮은 파트가 보강 1순위</span></div>
    <div class="card" style="padding:18px 20px" id="parts"></div>

    <div class="sec"><h2>많이 틀린 문항</h2><span class="note">오답률 높은 순 · 2명 이상 푼 것만</span></div>
    <div class="tabsw" id="ptabs"></div>
    <div class="card scroll"><table id="items"></table></div>

    <div class="sec"><h2>최근 응시</h2><span class="note">최근 60건</span></div>
    <div class="card scroll"><table id="recent"></table></div>
  </div>
</div>

<dialog id="pdlg"><div class="dl-h"><b>✍️ 지필 점수 입력</b><button class="btn" id="p-close">닫기</button></div><div class="dl-b" id="p-body" style="max-height:75vh"></div></dialog>
<dialog id="dlg"><div class="dl-h"><b id="dlg-t">상세</b><button class="btn" onclick="document.getElementById('dlg').close()">닫기</button></div><div class="dl-b" id="dlg-b"></div></dialog>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PARTNAMES={dtv:"구문 단어 뜻 고르기",dtr:"직독직해",dtg:"어법 O/X 고치기",vmc:"⏱ 뜻 고르기(시간제 객관식)",vmcr:"⏱ 단어 고르기(시간제 객관식)",vdm1:"단어 동형 모고 1세트",vdm2:"단어 동형 모고 2세트",vdm3:"단어 동형 모고 3세트",vdt1:"단어 동형 동형모고 30문제",vdt2:"단어 동형 예문변형 동형모고 30문제",vdc1:"단어 동형 객관식 Set 1",vdc2:"단어 동형 객관식 Set 2",vdw1:"단어 동형 주관식 Set 1",vdw2:"단어 동형 주관식 Set 2",vds:"단어 동형 스페셜 변형",wmean:"단어 뜻 쓰기",wsyn:"유의어 객관식",wsynw:"유의어 주관식",wdef:"영영풀이",dfa:"영영풀이 매칭",dfb:"영영풀이 정오",vocab:"어휘 선택",gram:"어법 선택",word:"단어 밑줄",word2:"통변형 ②",fixg:"통변형 ③ 어법 집중",fixv:"통변형 ④ 어휘 집중",fix:"어법 오류 수정",tf:"내용일치 TF",order:"순서 배열",insert:"문장 삽입",arrange:"단어배열",write:"영작",twrite:"주제문 영작",cloze:"빈칸 추론",choice:"독해",sjt:"영문선지 비법 TEST",gbbw:"어법 비법 밑줄 고치기",gbb:"어법 비법 TEST",vbbw:"어휘 비법 밑줄 고치기",vbb:"어휘 비법 TEST",mwrite:"중요 문장 영작",review:"오답노트(전체)"};
const ORDER=["wmean","wsyn","wsynw","wdef","dfa","dfb","vdc1","vdc2","vdm1","vdm2","vdm3","vdt1","vdt2","vdw1","vdw2","vds","vmc","vmcr","dtv","dtr","twrite","cloze","vocab","gram","word","word2","fix","fixg","fixv","tf","choice","sjt","gbbw","gbb","vbbw","vbb","order","insert","arrange","mwrite","write"];
let PIN=(()=>{try{return localStorage.getItem("naesinfit.pin")||sessionStorage.getItem("naesinfit.pin")||""}catch(e){return ""}})(), ALL=[], ROWS=[], TAB="all", BOOK="all";

const pctClass=p=>p>=90?"p-hi":p>=75?"p-mid":"p-lo";
const VD_PASS=90, VD_PART=75;
let MF={books:[]};
let DTCHK=null, DTCHK_ING=false;   // 데일리테스트 회차별 어법 추가 문제 풀(dtgx) 점검
async function dtChkLoad(){ if(DTCHK_ING) return; DTCHK_ING=true; const R={};
  const us=[]; (MF.books||[]).forEach(b=>(b.units||[]).forEach(u=>{ if(/^dt\d/.test(u.id)) us.push(u); }));
  await Promise.all(us.map(async u=>{ try{ const j=await (await fetch(`content/${u.id}.json`,{cache:"no-store"})).json();
    if(j.allInOne) R[u.id]={no:u.no, dtg:(j.dtg||[]).length, dtgx:(j.dtgx||[]).length, study:((j.study||{}).dtg||[]).length}; }catch(e){} }));
  DTCHK=R; DTCHK_ING=false; try{ renderIns(); }catch(e){} }
const vd=(p,done)=> (done!=null&&done<100) ? {k:"todo",n:`진행 ${done}%`}
                  : p>=VD_PASS?{k:"pass",n:"통과"}:p>=VD_PART?{k:"part",n:"부분 재시험"}:{k:"full",n:"전체 재시험"};
const vdPill=(p,done)=>`<span class="vd ${vd(p,done).k}">${vd(p,done).n}</span>`;
function unitByBook(book, uid){
  if(uid) for(const b of (MF.books||[])) for(const u of (b.units||[]))      // 저장된 단원 id가 있으면 그게 정답
    if(u.id===String(uid).replace(/ak$/,"")) return u;
  for(const b of (MF.books||[])) for(const u of (b.units||[]))   // 과목·출판사·과가 정확히 같은 단원 먼저
    if(book===`${b.subject} · ${b.publisher} · ${u.no}`) return u;
  for(const b of (MF.books||[])) for(const u of (b.units||[]))
    if(book && book.includes(u.no) && book.includes(b.publisher)) return u;
  for(const b of (MF.books||[])) for(const u of (b.units||[]))
    if(book && book.includes(u.no)) return u;
  return null;
}
const uidOf=rows=>{ const c={}; rows.forEach(x=>{ if(x.unit_id) c[x.unit_id]=(c[x.unit_id]||0)+1; });
  return (Object.entries(c).sort((a,b)=>b[1]-a[1])[0]||[])[0]||""; };
/* 학생의 '지금 보는 과' = 가장 최근 학습일에 가장 많이 푼 과 */
const dk0=v=>{const d=new Date(v);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
function mainBookOf(rows){
  if(!rows.length) return "";
  const last=rows.reduce((m,x)=>+new Date(x.created_at)>+new Date(m.created_at)?x:m,rows[0]), ld=dk0(last.created_at), w={};
  rows.filter(x=>dk0(x.created_at)===ld).forEach(x=>{w[x.book]=(w[x.book]||0)+x.total;});
  return Object.entries(w).sort((a,b)=>b[1]-a[1])[0][0];
}
const lastDayOf=rows=>{ if(!rows.length) return ""; const l=rows.reduce((m,x)=>+new Date(x.created_at)>+new Date(m.created_at)?x:m,rows[0]); const d=new Date(l.created_at),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const repHref=(n,rows)=>`report?student=${encodeURIComponent(n)}&book=${encodeURIComponent(mainBookOf(rows))}&day=${lastDayOf(rows)}`;   // 그 학생이 마지막으로 본 날 · 그날 과로 고정
function nPartsOf(rows){
  const mb=mainBookOf(rows), main=mb?[mb]:null;
  const u=main&&unitByBook(main[0], uidOf(rows.filter(x=>x.book===main[0])));
  return (u&&u.pts)?Object.keys(u.pts).length:7;
}
/* 학생의 주력 교재 소화율 = 응시한 파트 배점 합 ÷ 교재 전체 배점 */
function doneRateOf(rows){
  const byBook={};
  rows.forEach(r=>{const o=byBook[r.book]=byBook[r.book]||{t:0,parts:new Set()}; o.t+=r.total; o.parts.add(r.part);});
  const mb=mainBookOf(rows); if(!mb) return null;
  const main=[mb,byBook[mb]];
  const u=unitByBook(main[0], uidOf(rows.filter(x=>x.book===main[0])));
  if(!u || !u.pts || !u.total) return null;
  const done=Object.keys(u.pts).filter(k=>main[1].parts.has(k)).reduce((s,k)=>s+u.pts[k],0);
  return Math.min(100, Math.round(done/u.total*100));
}
const fmt=d=>{const x=new Date(d);const p=n=>String(n).padStart(2,"0");
  return `${x.getFullYear()}.${p(x.getMonth()+1)}.${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}`;};

  if(r.status===401){ const j=await r.json().catch(()=>({})); throw new Error(j.error||"비밀번호가 맞지 않습니다"); }
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||"불러오지 못했습니다"); }
  await loadHw();
  const j=await r.json(); ALL=(j.rows||[]).map(x=>({...x, book:String(x.book||"").replace(/\s*올킬\s*$/,"").trim()}));
  try{ const cr=await fetch("content/index.json",{cache:"no-store"}); if(cr.ok) MF=await cr.json(); }catch(e){}
}

          <span style="font-size:12.5px;color:var(--ink-3);margin-left:5px">정답률 · ${tc}/${tt}</span></div>

  $("#tiles").innerHTML=[

  const byP={};

  $("#parts").innerHTML=ORDER.map(p=>{
    const v=byP[p]; const pct=v?Math.round(v.c/v.t*100):null;

      <span class="tr"><i class="${pct==null?"":pct>=90?"hi":pct<75?"lo":""}" style="width:${pct||0}%"></i></span>

  /* 문항별 오답률 */
  const agg={};
  R.forEach(r=>(r.detail||[]).forEach(it=>(it.d||[]).forEach(x=>{
    const k=`${r.part}|${it.sec}|${it.no}|${x.l}`;

    a.n++; if(!x.ok){ a.w++; if(!a.ex) a.ex={m:x.m,r:x.r}; }

  const list=Object.values(agg).filter(a=>a.n>=2&&a.w>0)
    .filter(a=>TAB==="all"||a.part===TAB)

    .map(([k,n])=>`<button data-tab="${k}"${TAB===k?' class="on"':""}>${n}</button>`).join("");
  $("#items").innerHTML = list.length

  /* 최근 응시 */
  $("#recent").innerHTML=`<thead><tr><th>시각</th><th>이름</th><th>교재·과</th><th>파트</th><th>범위</th><th>점수</th><th></th></tr></thead><tbody>`+
    R.slice(0,60).map(r=>`<tr>
      <td style="color:var(--ink-3);font-size:13px">${fmt(r.created_at)}</td>
      <td style="font-weight:700">${esc(r.student)}</td>
      <td style="color:var(--ink-3);font-size:13px">${esc(r.book||"")}</td>
      <td>${PARTNAMES[r.part]||esc(r.part_name||r.part)}</td>
      <td style="color:var(--ink-3)">${r.scope==="all"?"전체":esc(r.scope)}</td>
      <td><span class="pill ${pctClass(r.pct)}">${r.pct}%</span> <span class="num" style="color:var(--ink-3);font-size:12px">${r.correct}/${r.total}</span></td>
      <td>${r.scope==="동형"?`<span style="font-size:12px;color:var(--ink-3)">📝 동형 OMR</span>`:r.scope==="지필"?`<span style="font-size:12px;color:var(--ink-3)">✍️ 수기 입력</span>`:`<button class="btn" data-att="${r.id}">오답 보기</button>`}</td></tr>`).join("")+`</tbody>`;
}

function openAttempt(id){
  const r=ALL.find(x=>x.id===id); if(!r) return;
  const wrong=[]; const notes=[];
  (r.detail||[]).forEach(it=>{
    (it.d||[]).forEach(x=>{ if(!x.ok) wrong.push({it,x}); });
    if(it.why||it.voc) notes.push(it);
  });
  $("#dlg-t").textContent=`${r.student} · ${PARTNAMES[r.part]||r.part_name||r.part} · ${r.pct}%`;
  $("#dlg-b").innerHTML = (wrong.length
    ? wrong.map(({it,x})=>`<div class="wrongrow">
        <div style="font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:3px">${esc(it.sec||"")} ${it.no} · ${esc(x.l)}</div>
        <span class="k">학생</span><span class="bad">${esc(x.m)}</span><br>
        <span class="k">정답</span><span class="good">${esc(x.r)}</span></div>`).join("")
    : `<div class="empty">틀린 문항이 없습니다 👏</div>`)
    + (notes.length ? `<div style="margin-top:14px;font-weight:800;font-size:13px">✍️ 학생 오답 정리</div>`
      + notes.map(it=>`<div class="wrongrow">
        <div style="font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:3px">${esc(it.sec||"")} ${it.no}</div>
        ${it.why?`<span class="k">틀린 이유</span>${esc(it.why)}<br>`:""}
        ${it.voc?`<span class="k">몰랐던 단어</span>${esc(it.voc)}`:""}</div>`).join("") : "");
  $("#dlg").showModal();
}
/* ───── 지필(종이) 테스트 점수 일괄 입력 → 데일리 리포트에 반영 ─────
   숙제 검사표처럼: 줄 = 학생, 칸 = 그날 본 지필 시험들. 한 번 저장으로 전부 반영 */
let HWS=null, PF={cid:"", day:"", bi:""}, COLS=[], PD={}, CK=0;   // PD["칸|학생"] = 선생님이 친 점수
const todayKST=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const dKST=v=>new Date(+new Date(v)+9*3600e3).toISOString().slice(0,10);
const unitsAll=()=>{ const L=[]; (MF.books||[]).forEach(b=>(b.units||[]).forEach(u=>L.push({label:`${b.subject} · ${b.publisher} · ${u.no}`, id:u.id, b, u}))); return L; };
const OTHER="지필 테스트";
const paperRows=()=>ALL.filter(r=>r.scope==="지필");
const QUICK=["단어 시험","어법 시험","본문 암기","서술형","통변형","동형 지필"];
function membersOf(cid){ return HWS?(HWS.members||[]).filter(m=>+m.class_id===+cid).map(m=>m.student).sort((a,b)=>a.localeCompare(b,"ko")):[]; }
function guessBook(cid){   // 반 학생들이 최근 2주에 가장 많이 푼 과
  const ms=new Set(membersOf(cid)), lim=Date.now()-14*864e5, w={};
  ALL.forEach(r=>{ if(ms.has(r.student)&&r.scope!=="지필"&&+new Date(r.created_at)>lim) w[r.book]=(w[r.book]||0)+r.total; });
  const top=(Object.entries(w).sort((a,b)=>b[1]-a[1])[0]||[])[0]; const i=unitsAll().findIndex(x=>x.label===top);
  return i>=0?String(i):OTHER; }
const biOf=label=>{ const i=unitsAll().findIndex(x=>x.label===label); return i>=0?String(i):OTHER; };
const bookOf=bi=>{ if(bi===OTHER) return {label:OTHER,id:""}; const x=unitsAll()[+bi]; return x?{label:x.label,id:x.id}:{label:OTHER,id:""}; };
const shortBook=bi=>{ if(bi===OTHER) return "교재 무관"; const x=unitsAll()[+bi]; return x?`${x.b.publisher.replace(/\(.*\)/,"")} ${x.u.no}`:"교재 무관"; };
function newCol(name){ return {k:"c"+(++CK), bi:PF.bi, name:name||"", total:"", orig:null, have:{}}; }
/* 📝 예비고1 데일리테스트(dt 단원): 영역 4칸(어휘·구문 단어·직독직해·어법)을 앱 시험과 같은 영역으로 저장 → 총점·반 석차에 반영 */
const DTP=[["wmean","A 어휘"],["dtv","B 구문 단어"],["dtr","C 직독직해"],["dtg","D 어법"]];
const isDtBi=bi=>bi!==OTHER&&!!unitsAll()[+bi]&&/^dt/.test(unitsAll()[+bi].id);
function dtCols(bi){ const x=unitsAll()[+bi]; if(!x) return; const P=x.u.pts||{};
  DTP.filter(([p])=>P[p]).forEach(([p,nm])=>{ if(COLS.some(c=>c.part===p&&c.bi===bi)) return;
    const empty=COLS.find(c=>!c.orig&&!c.name&&!Object.keys(PD).some(k=>k.startsWith(c.k+"|")));
    const c=empty||newCol(""); c.bi=bi; c.name=nm; c.total=String((x.u.paperPts||{})[p]||P[p]); c.part=p; if(!empty) COLS.push(c); }); }
function loadCols(){   // 이 반 · 이날 이미 넣은 지필 시험 → 칸으로
  const ms=new Set(membersOf(PF.cid)), g={};
  paperRows().forEach(r=>{ if(!ms.has(r.student)||dKST(r.created_at)!==PF.day) return;
    const dp=/^(wmean|dtv|dtr|dtg)$/.test(r.part)?r.part:"";
    const k=r.book+"\u0001"+r.part_name, o=g[k]=g[k]||{book:r.book,name:r.part_name.replace(/^지필 · /,"").replace(/ \(지필\)$/,""),total:r.total,part:dp,have:{}}; o.have[r.student]=r.correct; });
  COLS=Object.values(g).map(o=>({k:"c"+(++CK), bi:biOf(o.book), name:o.name, total:String(o.total), part:o.part, orig:{book:o.book,name:o.name,total:o.total,part:o.part}, have:o.have}));
  if(isDtBi(PF.bi)) dtCols(PF.bi);
  if(!COLS.length) COLS=[newCol("")];
  PD={};
}
async function openPaper(){
  $("#pdlg").showModal(); $("#p-body").innerHTML=`<div class="empty" style="padding:30px">불러오는 중…</div>`;
  if(!HWS){ try{ const r=await fetch("/api/hw",{headers:{"x-pin":PIN},cache:"no-store"}); HWS=await r.json(); if(!r.ok) throw new Error(HWS.error||"반 목록을 못 불러왔어요"); }catch(e){ HWS=null; $("#p-body").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; } }
  if(!PF.cid&&HWS.classes&&HWS.classes[0]) PF.cid=String(HWS.classes[0].id);
  if(!PF.day) PF.day=todayKST();
  if(!PF.bi) PF.bi=guessBook(PF.cid);
  loadCols(); drawPaper();
}
function bookOpts(sel){ const L=unitsAll(), groups=[...new Set(L.map(x=>x.b.subject+" · "+x.b.publisher))];
  return `<option value="${OTHER}"${sel===OTHER?" selected":""}>교재와 상관없는 지필 테스트</option>`+
    groups.map(g=>`<optgroup label="${esc(g)}">${L.map((x,i)=>x.b.subject+" · "+x.b.publisher===g?`<option value="${i}"${String(i)===sel?" selected":""}>${esc(x.u.no)}${x.u.title?" · "+esc(x.u.title):""}</option>`:"").join("")}</optgroup>`).join(""); }
function drawPaper(){
  const C=HWS.classes||[], studs=membersOf(PF.cid);
  $("#p-body").innerHTML=`

const colOf=k=>COLS.find(c=>c.k===k);
function pctSync(){

        saved+=j.saved; removed+=j.removed;

      await load(); render(); loadCols(); drawPaper();
      const m=$("#p-msg"); m.style.color="var(--ok)"; m.textContent=`저장했어요 · 시험 ${work.length}개 · 점수 ${saved}개 반영${removed?` · ${removed}개 지움`:""} · ${PF.day} 데일리 리포트에 나와요`;
    }catch(er){ err(er.message+" — 다시 저장을 눌러 주세요"); b.disabled=false; }
  }
});

<script>
"use strict";
/* ───── 📊 오늘의 인사이트 (11-19) — 반·날짜별: 진도 따라오는지 대시보드 / 통재시 명단 / 숙제 70% 미만 + 남은 숙제
   시험: 그날 본 기록 중 학생·과·파트마다 최고 기록 1개(재시험·오답노트 제외). 판정은 학생 앱과 같은 규칙(단원 verdict → 없으면 90/75).
   숙제: 그날(hw_items.day) 숙제의 칸 점수(완료 1 · 일부 = 미션 비율/앱 점수/0.5 · 안 함 0 · 면제·검사 전 제외) 평균. ───── */
let HW=null, INS={day:"", cid:"all"}, INS_COPY={};
async function loadHw(){ try{ const r=await fetch("/api/hw",{headers:{"x-pin":PIN},cache:"no-store"}); if(r.ok) HW=await r.json(); }catch(e){ HW=null; } }
const iDk=v=>{const d=new Date(v),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
const AREA_OF=p=>/^(wmean|wsyn|wsynw|wdef|dfa|dfb|vdc\d|vdm\d|vdt\d|vdw\d|vds|vmc|vmcr|dtv|vocab|vbb|vbbw|fixv)$/.test(p)?"어휘"
  :/^(gram|fix|fixg|gbb|gbbw|dtg|word|word2)$/.test(p)?"어법"
  :/^(dtr|cloze|tf|choice|sjt|order|insert|arrange|twrite|write|mwrite)$/.test(p)?"독해":"기타";
function iVerdict(r){ const u=unitByBook(r.book,r.unit_id), R=u&&u.verdict&&u.verdict[r.part], c=+r.correct, t=+r.total, pct=t?c/t*100:0;
  if(R){ if(R.pf!=null) return pct>=R.pf?"pass":"full";
    if(R.wrong) return (t-c)<=R.wrong[0]?"pass":(t-c)<=R.wrong[1]?"part":"full";
    if(R.pct) return pct>=R.pct[0]?"pass":pct>=R.pct[1]?"part":"full"; }
  return pct>=90?"pass":pct>=75?"part":"full"; }
const VN={pass:"통과",part:"부분재시",full:"통재시"};
const iJ=v=>{ try{ return Array.isArray(v)?v:v?JSON.parse(v):[]; }catch(e){ return []; } };
const iCred=(k,it)=>{ if(!k||!k.status||k.status==="skip") return null; if(k.status==="done") return 1; if(k.status!=="part") return 0;
  const m=iJ(it&&it.missions).length, d=iJ(k.ms).length; if(m&&d) return Math.min(1,d/m);
  if(k.auto&&k.score!=null) return Math.max(0,Math.min(1,k.score/100)); return 0.5; };
const r1=v=>Math.round(v*10)/10;
function insClasses(){ return (HW&&HW.classes)||[]; }
function insMembers(cid){ const M=(HW&&HW.members)||[]; return [...new Set(M.filter(m=>cid==="all"||+m.class_id===+cid).map(m=>m.student))]; }
function insClsOf(st){ const M=(HW&&HW.members)||[], C=insClasses(); return M.filter(m=>m.student===st).map(m=>(C.find(c=>+c.id===+m.class_id)||{}).name).filter(Boolean); }
/* 그날 시험 기록 → 학생·과·파트별 최고 1개 */
function insBest(day, inSet){
  const B={};
  ALL.forEach(r=>{ if(iDk(r.created_at)!==day||!(+r.total>0)||r.scope==="재시험"||/^오답노트/.test(r.part_name||"")||r.part==="review") return;
    if(inSet && !inSet.has(r.student)) return;
    const k=r.student+"|"+r.book+"|"+r.part, o=B[k];
    if(!o || r.correct/r.total>o.correct/o.total) B[k]=r; });
  return Object.values(B).map(r=>({...r, v:iVerdict(r), a:AREA_OF(r.part)}));
}
function insStat(rows){ const t=rows.reduce((s,x)=>s+ +x.total,0), c=rows.reduce((s,x)=>s+ +x.correct,0); return t?c/t*100:null; }
function insHw(day, studs){
  const its=((HW&&HW.items)||[]).filter(i=>i.day===day && (INS.cid==="all"||+i.class_id===+INS.cid));
  if(!its.length) return {its, per:[]};
  const K=(HW.checks||[]), M=(HW.members||[]);
  const per=[];
  studs.forEach(st=>{ const cids=new Set(M.filter(m=>m.student===st).map(m=>+m.class_id));
    const mine=its.filter(i=>cids.has(+i.class_id)); if(!mine.length) return;
    let s=0,n=0,pend=0; const todo=[];
    mine.forEach(it=>{ const k=K.find(x=>+x.item_id===+it.id && x.student===st); const c=iCred(k,it);
      if(!k||!k.status){ pend++; return; } if(c==null) return; s+=c; n++;
      if(c<1){ const ms=iJ(it.missions), dn=new Set(iJ(k.ms).map(Number));
        todo.push({t:it.title, st:k.status, left:ms.filter((x,j)=>!dn.has(j)), memo:it.memo||"", sc:k.auto&&k.score!=null?k.score:null}); } });
    per.push({st, pct:n?Math.round(s/n*100):null, s, n, tot:mine.length, pend, todo}); });
  return {its, per};
}
function insLine(cls,txt){ return `<div style="display:flex;gap:10px;padding:7px 0;font-size:14px;line-height:1.6"><span style="flex:none">${cls}</span><span>${txt}</span></div>`; }
function insCopyBtn(key,text){ INS_COPY[key]=text; return `<button class="btn" style="padding:5px 11px;font-size:11.5px" data-icopy="${key}">명단 복사</button>`; }
function renderIns(){
  const box=$("#ins"); if(!box) return;
  if(!INS.day) INS.day=iDk(new Date());
  $("#ins-day").value=INS.day;
  const C=insClasses();
  if(INS.cid!=="all" && !C.some(c=>String(c.id)===String(INS.cid))) INS.cid="all";
  $("#ins-cls").innerHTML=[["all","전체 반"]].concat(C.map(c=>[String(c.id),c.name])).map(([k,n])=>`<button data-icls="${esc(k)}"${String(INS.cid)===k?' class="on"':""}>${esc(n)}</button>`).join("");
  const day=INS.day, mem=insMembers(INS.cid), inSet=INS.cid==="all"?null:new Set(mem);
  const best=insBest(day, inSet);
  const took=[...new Set(best.map(r=>r.student))];
  const roster=INS.cid==="all"?[...new Set(mem.concat(took))]:mem;
  const absent=roster.filter(s=>!took.includes(s));
  // 직전 학습일
  const prevDays=[...new Set(ALL.filter(r=>(!inSet||inSet.has(r.student)) && iDk(r.created_at)<day).map(r=>iDk(r.created_at)))].sort();
  const pd=prevDays[prevDays.length-1], prevAvg=pd?insStat(insBest(pd,inSet)):null;
  const avg=insStat(best);
  const cnt={pass:0,part:0,full:0}; best.forEach(r=>cnt[r.v]++);
  const AR=["어휘","어법","독해"].map(a=>{ const rs=best.filter(r=>r.a===a); return {a, n:rs.length, pct:insStat(rs), pass:rs.filter(r=>r.v==="pass").length, full:rs.filter(r=>r.v==="full").length}; }).filter(x=>x.n);
  const H=insHw(day, roster), hwPer=H.per.filter(x=>x.pct!=null), hwAvg=hwPer.length?Math.round(hwPer.reduce((s,x)=>s+x.pct,0)/hwPer.length):null;
  const hwLow=hwPer.filter(x=>x.pct<70).sort((a,b)=>a.pct-b.pct);
  // 학생별 영역 통재시
  const byS={}; best.forEach(r=>{ (byS[r.student] ||= {어휘:[],어법:[],독해:[],기타:[]})[r.a].push(r); });
  const failOf=(s,a)=>(byS[s]&&byS[s][a]||[]).filter(r=>r.v==="full");
  const vocFull=took.filter(s=>failOf(s,"어휘").length);
  const gr=took.filter(s=>failOf(s,"어법").length), rd=took.filter(s=>failOf(s,"독해").length);
  const both=gr.filter(s=>rd.includes(s)), grOnly=gr.filter(s=>!rd.includes(s)), rdOnly=rd.filter(s=>!gr.includes(s));
  const pLab=r=>{ const u=unitByBook(r.book,r.unit_id), l=u&&u.labels&&u.labels[r.part]; return l?String(l).replace(/\s*\(.*\)\s*$/,"").replace(/^[A-Z]\s+/,""):(PARTNAMES[r.part]||r.part_name||r.part); };
  const failTxt=(s,a)=>failOf(s,a).map(r=>`${pLab(r)} ${r1(+r.correct)}/${r.total}`).join(" · ");
  // 많이 틀린 문항
  const W={};
  best.forEach(r=>iJ(r.detail).forEach(it=>(it.d||[]).forEach(d=>{ if(String(d.ok)!=="0"&&d.ok!==0) return;
    const k=r.part+"|"+(it.no||"")+"|"+(d.l||""); const o=W[k] ||= {p:r.part,no:it.no,l:d.l,r:d.r,n:new Set()}; o.n.add(r.student); })));
  const WT=Object.values(W).filter(x=>x.n.size>=2).sort((a,b)=>b.n.size-a.n.size).slice(0,5);
  // 한 줄 진단
  const L=[];
  if(!best.length) L.push(insLine("📭",`${day.slice(5).replace("-","/")}에 본 시험 기록이 없어요.`));
  else {
    const ap=Math.round(avg);
    L.push(insLine(ap>=85?"🟢":ap>=70?"🟡":"🔴", (ap>=85?`<b>잘 따라오고 있어요.</b> 평균 정답률 ${ap}%`:ap>=70?`<b>대체로 따라오지만 보강이 필요해요.</b> 평균 정답률 ${ap}%`:`<b>많이 버거워하고 있어요.</b> 평균 정답률 ${ap}%`)+(prevAvg!=null?` <span style="color:${avg-prevAvg>=0?"var(--ok)":"var(--no)"};font-weight:700">(직전 ${pd.slice(5).replace("-","/")} ${Math.round(prevAvg)}% → ${avg-prevAvg>=0?"▲":"▼"}${Math.abs(Math.round(avg-prevAvg))})</span>`:"")));
    if(AR.length>1){ const s=[...AR].sort((a,b)=>a.pct-b.pct), lo=s[0], hi=s[s.length-1];
      if(hi.pct-lo.pct>=8) L.push(insLine("🎯",`<b>${lo.a}</b>이 가장 약해요 (${Math.round(lo.pct)}%, 통재시 ${lo.full}건). ${hi.a}는 ${Math.round(hi.pct)}%로 가장 좋아요 → 다음 수업 ${lo.a} 보강 1순위.`));
      else L.push(insLine("🎯",`영역별 차이가 크지 않아요 (${AR.map(x=>`${x.a} ${Math.round(x.pct)}%`).join(" · ")}).`)); }
    const tot=cnt.pass+cnt.part+cnt.full;
    L.push(insLine("🧪",`판정 ${tot}건 중 통과 ${cnt.pass} · 부분재시 ${cnt.part} · <b style="color:var(--no)">통재시 ${cnt.full}</b> (${tot?Math.round(cnt.full/tot*100):0}%)${both.length?` · 어법·독해 둘 다 통재시 <b>${both.length}명</b>`:""}`));
    if(WT.length) L.push(insLine("❗",`가장 많이 틀린 곳: ${WT.filter((x,i,a)=>a.findIndex(y=>y.l===x.l)===i).slice(0,3).map(x=>`<b>${esc(x.l||x.no||"")}</b>(${x.n.size}명)`).join(", ")}`));
  }
  if(hwAvg!=null) L.push(insLine(hwAvg>=85?"📗":hwAvg>=70?"📒":"📕",`숙제 완료율 평균 <b>${hwAvg}%</b>${hwLow.length?` · 70% 미만 <b style="color:var(--no)">${hwLow.length}명</b>`:" · 70% 미만 없음 👏"}${H.per.some(x=>x.pend)?` <span style="color:var(--ink-3)">(검사 전 숙제는 빼고 계산)</span>`:""}`));
  else if(H.its.length) L.push(insLine("📒",`숙제 ${H.its.length}개 · 아직 검사 기록이 없어요.`));
  if(absent.length && roster.length) L.push(insLine("🙋",`미응시 ${absent.length}명: ${absent.map(esc).join(", ")}`));

  const tile=(v,l,c)=>`<div class="card tile"><b class="num"${c?` style="color:${c}"`:""}>${v}</b><span>${l}</span></div>`;
  const col=p=>p==null?"":p>=85?"var(--ok)":p<70?"var(--no)":"var(--accent)";
  // 반별 비교 (전체 반일 때)
  let cmp="";
  if(INS.cid==="all" && C.length>1){
    const rowsC=C.map(c=>{ const m=new Set(insMembers(c.id)), b=best.filter(r=>m.has(r.student)); if(!b.length) return null;
      const tk=new Set(b.map(r=>r.student)), av=insStat(b), fl=b.filter(r=>r.v==="full").length;
      const hp=H.per.filter(x=>m.has(x.st)&&x.pct!=null), ha=hp.length?Math.round(hp.reduce((s,x)=>s+x.pct,0)/hp.length):null;
      return `<tr><td><button style="font-weight:700;color:var(--accent)" data-icls="${c.id}">${esc(c.name)}</button></td><td class="num">${tk.size} / ${m.size}</td>
        <td><span class="pill ${av>=85?"p-hi":av>=70?"p-mid":"p-lo"}">${Math.round(av)}%</span></td><td class="num">${fl}건</td><td class="num">${ha==null?"—":ha+"%"}</td></tr>`; }).filter(Boolean);
    if(rowsC.length) cmp=`<div class="card scroll" style="margin-top:12px"><table><thead><tr><th>반</th><th>응시</th><th>평균 정답률</th><th>통재시</th><th>숙제 완료율</th></tr></thead><tbody>${rowsC.join("")}</tbody></table></div>`;
  }
  const meter=x=>`<div class="meter"><span class="lb">${x.a} <span style="font-size:11.5px;color:var(--ink-3)">${x.n}건</span></span><span class="tr"><i class="${x.pct>=85?"hi":x.pct<70?"lo":""}" style="width:${Math.round(x.pct)}%"></i></span><span class="vl">${Math.round(x.pct)}%</span></div>`;
  const nameRow=(s,sub)=>`<div style="display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)"><button style="font-weight:800;color:var(--accent);flex:none" data-stu="${esc(s)}">${esc(s)}</button>
    ${INS.cid==="all"?`<span style="font-size:11.5px;color:var(--ink-3);flex:none">${esc(insClsOf(s).join("·"))}</span>`:""}<span style="font-size:12.5px;color:var(--ink-2)">${sub}</span></div>`;
  const ttl=(t,n,copy)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><b style="font-size:14.5px">${t}</b><span class="pill p-lo">${n}명</span><span style="margin-left:auto">${n?copy:""}</span></div>`;
  const clsName=INS.cid==="all"?"전체":(C.find(c=>String(c.id)===String(INS.cid))||{}).name||"";
  // 🔁 데일리테스트 영역별 재시 현황: 그날 원래 시험에서 통과 못 한 영역 → 그 뒤 재시 기록(전부 맞으면 통과)
  const RE=ALL.filter(r=>r.scope==="재시험"&&/^재시 · /.test(r.part_name||"")&&+r.total>0);
  if(!DTCHK) dtChkLoad();
  const dtMiss=Object.entries(DTCHK||{}).filter(([k,v])=>v.dtg&&!(v.dtgx>=5));
  const reAllP=r=>/^dt/.test(r.unit_id||"")||/^(wmean|wsyn|wsynw|dfa|wdef|dfb|vdc\d|vdm\d|vdt\d|vds|vmc|vmcr|dtv)$/.test(r.part);   // 재시 통과: 데일리테스트·단어는 전부, 나머지 90점
  const reOK=(r,x)=>+x.total>0&&(reAllP(r)?+x.correct>=+x.total:+x.correct/+x.total>=0.9);
  const reT=best.filter(r=>r.v!=="pass").map(r=>{ const L=RE.filter(x=>x.student===r.student&&x.unit_id===r.unit_id&&x.part===r.part&&iDk(x.created_at)>=day);
      const ok=L.filter(x=>reOK(r,x)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))[0], bb=L.reduce((m,x)=>!m||x.correct/x.total>m.correct/m.total?x:m,null);
      return {r, n:L.length, ok, bb}; }).sort((a,b)=>(!!a.ok-!!b.ok)||a.r.student.localeCompare(b.r.student,"ko"));
  const reLeft=[...new Set(reT.filter(x=>!x.ok).map(x=>x.r.student))];
  const reDone=reT.filter(x=>x.ok).length, reTry=reT.filter(x=>!x.ok&&x.n).length, reNo=reT.filter(x=>!x.n).length;
  if(reT.length) L.push(insLine(reLeft.length?"🔁":"✅",`재시 대상 ${reT.length}건 → <b style="color:var(--ok)">재시 통과 ${reDone}</b> · 재시 중 ${reTry} · <b style="color:${reNo?"var(--no)":"var(--ink-3)"}">아직 안 봄 ${reNo}</b>${reLeft.length?` · 남은 학생 <b>${reLeft.length}명</b>`:" · 모두 통과 👏"}`));
  const reTxt=x=>x.ok?`✓ 재시 통과 (${iDk(x.ok.created_at).slice(5).replace("-","/")}${x.n>1?` · ${x.n}회`:""})`:x.n?`✗ 재시 ${x.n}회 · 최고 ${r1(+x.bb.correct)}/${x.bb.total}`:"아직 재시 안 봄";
  const dd=day.slice(5).replace("-","/");
  box.innerHTML=`
    <div class="tiles">
      ${tile(roster.length?`${took.length}<small style="font-size:15px;color:var(--ink-3)">/${roster.length}</small>`:took.length,"응시 인원")}
      ${tile(avg==null?"—":Math.round(avg)+"%","평균 정답률",col(avg))}
      ${tile(cnt.full,"통재시 (건)",cnt.full?"var(--no)":"")}
      ${tile(hwAvg==null?"—":hwAvg+"%","숙제 완료율",col(hwAvg))}
      ${tile(reT.length?`${reDone}<small style="font-size:15px;color:var(--ink-3)">/${reT.length}</small>`:"—","재시 통과 (영역)",reT.length?(reDone===reT.length?"var(--ok)":"var(--no)"):"")}
    </div>
    <div class="card" style="padding:16px 20px;margin-top:12px">${L.join("")}
      ${AR.length?`<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">${AR.map(meter).join("")}</div>`:""}
      ${WT.length?`<details style="margin-top:8px"><summary style="cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-3)">많이 틀린 문항 TOP ${WT.length}</summary>
        ${WT.map(x=>`<div class="wrongrow"><b>${esc(x.l||"")}</b> <span style="color:var(--ink-3);font-size:12px">${esc(PARTNAMES[x.p]||x.p)}${x.no?" · "+esc(x.no):""}</span> — <b style="color:var(--no)">${x.n.size}명</b> 틀림 · <span class="k">정답</span><span class="good">${esc(x.r||"")}</span></div>`).join("")}</details>`:""}
    </div>
    ${cmp}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px">
      <div class="card" style="padding:16px 20px">${ttl("🔤 어휘 통재시",vocFull.length,insCopyBtn("v",`[${clsName} ${dd}] 어휘 통재시 ${vocFull.length}명\n`+vocFull.map(s=>`${s} (${failTxt(s,"어휘")})`).join("\n")))}
        ${vocFull.length?vocFull.map(s=>nameRow(s,esc(failTxt(s,"어휘")))).join(""):`<div style="font-size:13px;color:var(--ink-3)">없어요 👏</div>`}</div>
      <div class="card" style="padding:16px 20px">${ttl("📐📖 어법·독해 모두 통재시",both.length,insCopyBtn("b",`[${clsName} ${dd}] 어법·독해 모두 통재시 ${both.length}명\n`+both.map(s=>`${s} (어법: ${failTxt(s,"어법")} / 독해: ${failTxt(s,"독해")})`).join("\n")))}
        ${both.length?both.map(s=>nameRow(s,`어법: ${esc(failTxt(s,"어법"))}<br>독해: ${esc(failTxt(s,"독해"))}`)).join(""):`<div style="font-size:13px;color:var(--ink-3)">없어요 👏</div>`}
        ${grOnly.length||rdOnly.length?`<div style="margin-top:8px;font-size:12.5px;color:var(--ink-3);line-height:1.7">${grOnly.length?`어법만 통재시: ${grOnly.map(esc).join(", ")}<br>`:""}${rdOnly.length?`독해만 통재시: ${rdOnly.map(esc).join(", ")}`:""}</div>`:""}</div>
    </div>
    ${dtMiss.length?`<div class="card" style="padding:14px 20px;margin-top:12px;border:2px solid var(--no)"><b style="font-size:14px;color:var(--no)">⚠ 데일리테스트 어법 통재시 추가 문제가 없어요</b><div style="font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.6">${dtMiss.map(([k,v])=>esc(v.no)).join(" · ")} — 어법 통재시 재시에 5문장을 더 넣을 문제 풀(dtgx)이 비어 있어서 지금은 원래 5문장만 나와요. Claude에게 "<b>${esc(dtMiss[0][1].no)} 어법 추가 문제 넣어줘</b>"라고 해 주세요.</div></div>`:""}
    ${!reT.length?`<div class="card" style="padding:16px 20px;margin-top:12px"><b style="font-size:14.5px">🔁 재시 현황</b><div style="font-size:13px;color:var(--ink-3);margin-top:6px">${dd}에 재시 대상(통과 못 한 영역)이 없어요.</div></div>`:""}
    ${reT.length?`<div class="card" style="padding:16px 20px;margin-top:12px">${ttl("🔁 재시 현황 <span style=\"font-size:12px;font-weight:600;color:var(--ink-3)\">파트 전체 다시 · 데일리테스트·단어는 다 맞아야, 나머지 90점</span>",reLeft.length,insCopyBtn("r",`[${clsName} ${dd}] 재시 남은 학생 ${reLeft.length}명\n`+reLeft.map(s=>`${s} (${reT.filter(x=>x.r.student===s&&!x.ok).map(x=>`${pLab(x.r)} ${reTxt(x)}`).join(" · ")})`).join("\n")))}
      ${reT.map(x=>nameRow(x.r.student,`<b>${esc(pLab(x.r))}</b> <span class="num" style="color:var(--ink-3)">${r1(+x.r.correct)}/${x.r.total} ${VN[x.r.v]}</span> → <span style="font-weight:800;color:${x.ok?"var(--ok)":x.n?"var(--no)":"var(--ink-3)"}">${reTxt(x)}</span>`)).join("")}</div>`:""}
    <div class="card" style="padding:16px 20px;margin-top:12px">${ttl(`📚 숙제 70% 미만 · 해야 할 숙제`,hwLow.length,insCopyBtn("h",`[${clsName} ${dd}] 숙제 70% 미만 ${hwLow.length}명\n`+hwLow.map(x=>`${x.st} ${x.pct}% → 해야 할 숙제: ${x.todo.map(t=>t.t+(t.left.length?` (남은 미션: ${t.left.join(", ")})`:t.st==="part"?" (일부만 함)":"")).join(" / ")}`).join("\n")))}
      ${!H.its.length?`<div style="font-size:13px;color:var(--ink-3)">${dd} 숙제가 없어요.</div>`
       :hwLow.length?hwLow.map(x=>nameRow(x.st,`<span class="pill p-lo" style="margin-right:6px">${x.pct}%</span><span class="num" style="color:var(--ink-3)">${r1(x.s)}/${x.n}${x.pend?` · 검사 전 ${x.pend}`:""}</span>
          <div style="margin-top:4px">${x.todo.map(t=>`<div style="padding:2px 0">▸ <b>${esc(t.t)}</b> <span class="vd ${t.st==="part"?"part":"full"}" style="margin-left:4px">${t.st==="part"?"일부":"안 함"}${t.sc!=null?` · 앱 ${t.sc}점`:""}</span>${t.left.length?`<div style="font-size:12px;color:var(--ink-3);margin-left:14px">남은 미션: ${t.left.map(esc).join(" · ")}</div>`:""}</div>`).join("")}</div>`)).join("")
       :`<div style="font-size:13px;color:var(--ink-3)">${hwPer.length?"모두 70% 이상이에요 👏":"아직 검사 기록이 없어요."}</div>`}
    </div>`;
}
$("#ins-day").addEventListener("change",e=>{ INS.day=e.target.value||iDk(new Date()); renderIns(); });
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-icls]"); if(c){ INS.cid=c.dataset.icls; renderIns(); return; }
  const sh=e.target.closest("[data-ishift]"); if(sh){ const d=new Date(INS.day+"T12:00:00"); d.setDate(d.getDate()+(+sh.dataset.ishift)); INS.day=iDk(d); renderIns(); return; }
  const cp=e.target.closest("[data-icopy]"); if(cp){ const t=INS_COPY[cp.dataset.icopy]||""; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{ cp.textContent="복사됨 ✓"; setTimeout(()=>cp.textContent="명단 복사",1500); }).catch(()=>prompt("복사하세요",t)); }
});
</script>
</body>
</html>
