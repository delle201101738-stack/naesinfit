<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>헤이즐 쌤 동형모의고사 성적표 · hazel_studylog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Archivo:wght@600;700;800&display=swap">
<script>document.documentElement.classList.add("js")</script>
<style>
.js #ssr{display:none}
:root{
  --navy:#1E2A4A; --ink:#1F2433; --ink2:#454B5C; --ink3:#7A7F8E; --line:#D9DCE5; --paper:#FFFFFF; --bg:#EEF0F4;
  --gold:#9A7B2F; --gold-soft:#F6F1E4; --cream:#FBF7EC; --cream-line:#EADFC2;
  --ok:#2E7D4F; --ok-soft:#E6F2EA; --no:#C0392B; --no-soft:#FBEAE8; --mid:#D08A1A; --cls:#A3A8B4; --hl:#FFE36E; --pink:#E0457B;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar b{font-size:15px} .bar .sp{flex:1}
.btn{font:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)} .btn:disabled{opacity:.5}
.list{max-width:900px;margin:12px auto;padding:0 16px}
.warn{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7;margin:10px 0}
.rep{margin:18px auto 28px;width:fit-content}
.rep-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px;font-size:13px;color:var(--ink2)}
.rep-h b{font-size:14px;color:var(--ink)}
.pages{display:flex;flex-direction:column;gap:14px}
.scaler{transform-origin:top left}
.msg{max-width:560px;margin:80px auto;text-align:center;color:var(--ink2);font-size:15px;line-height:1.7;padding:0 20px}
.n{font-family:'Archivo','Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums}

/* ── A4 ── */
.page{word-break:keep-all;overflow-wrap:break-word;width:210mm;height:297mm;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 2px 14px rgba(20,30,60,.12)}
.page .in{position:absolute;left:0;top:0;width:210mm;padding:13mm 14mm 0 14mm}
.page .ft{position:absolute;left:14mm;right:14mm;bottom:8mm;border-top:1px solid var(--line);padding-top:2.2mm;display:flex;justify-content:space-between;gap:10px;font-size:10.5pt;color:var(--ink3)}
.blk{margin-top:5mm} .blk:first-child{margin-top:0}
.eb{font-size:10.5pt;font-weight:900;letter-spacing:.3em;color:var(--gold)}
.h1{font-size:22pt;font-weight:900;color:var(--navy);letter-spacing:-.02em;margin:1.2mm 0 0;line-height:1.25}
.h1 .nm{font-size:30pt;background:linear-gradient(transparent 66%, #F3E3B0 66%);padding:0 .6mm}
.meta{font-size:12pt;color:var(--ink2);font-weight:700;margin-top:1.6mm}
.slim{display:flex;align-items:baseline;gap:3mm;border-bottom:2.4px solid var(--navy);padding-bottom:2.4mm}
.slim .t{font-size:20pt;font-weight:900;color:var(--navy)} .slim .m{font-size:11.5pt;color:var(--ink2);font-weight:700} .slim .eb{margin-left:auto;font-size:10pt}
.st{font-size:10.5pt;font-weight:900;letter-spacing:.38em;color:var(--gold);border-bottom:1.4px solid var(--ink);padding-bottom:1.6mm;margin-bottom:2.8mm;display:flex;justify-content:space-between;align-items:baseline}
.st small{letter-spacing:0;font-weight:700;color:var(--ink3);font-size:10pt}
.tiles{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;border:1.6px solid var(--navy);border-radius:3mm;overflow:hidden}
.tiles div{padding:3.2mm 3.4mm;border-left:1px solid var(--line)} .tiles div:first-child{border-left:0;background:var(--cream)}
.tiles small{display:block;font-size:10.5pt;color:var(--ink3);font-weight:700;letter-spacing:.06em}
.tiles b{display:block;font-size:24pt;font-weight:800;color:var(--navy);line-height:1.15;margin-top:1mm}
.tiles b em{font-style:normal;font-size:12pt;color:var(--ink3);font-weight:700;margin-left:1mm}
.tiles div:first-child b{font-size:32pt;color:var(--pink)}
.tiles span{display:block;font-size:10.5pt;color:var(--ink2);margin-top:.6mm}
.line{position:relative;height:16mm;margin:2mm 2mm 0}
.line .tr{position:absolute;left:0;right:0;top:8mm;height:2.4mm;border-radius:99px;background:#EEF0F4}
.line .pt{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:9.5pt;font-weight:700;color:var(--ink2);white-space:nowrap}
.line .pt i{display:block;width:3.4mm;height:3.4mm;border-radius:50%;margin:1.2mm auto 0;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.line .ax{position:absolute;top:12mm;font-size:9pt;color:var(--ink3)}
.cmt{background:var(--cream);border:1px solid var(--cream-line);border-radius:3mm;padding:4mm 5mm}
.cmt h3{margin:0 0 2.2mm;font-size:16.5pt;font-weight:900;color:var(--navy);line-height:1.35}
.cmt p{margin:0;font-size:12.6pt;line-height:1.72} .cmt p+p{margin-top:1.4mm}
mark.hl{background:linear-gradient(transparent 58%, var(--hl) 58%);color:inherit;font-weight:700;padding:0 .3mm}
.kd{display:grid;grid-template-columns:31mm 1fr 37mm 12mm;align-items:center;gap:2.4mm;padding:.75mm 0;border-bottom:1px dashed #E6E8EE;font-size:11pt}
.kd .v{white-space:nowrap}
.kd:last-child{border-bottom:0}
.kd .k{font-weight:900;color:var(--ink)}
.kd .tr{position:relative;height:4mm;border-radius:99px;background:#F1F2F6}
.kd .tr>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.kd .tr>s{position:absolute;top:-1.2mm;bottom:-1.2mm;width:0;border-left:2px dashed var(--ink2)}
.kd .v{text-align:right;font-weight:700;color:var(--ink2)} .kd .v b{color:var(--ink);font-weight:800}
.tg{display:inline-block;font-size:9.5pt;font-weight:900;padding:.6mm 2mm;border-radius:99px;text-align:center}
.tg.s{background:var(--ok-soft);color:var(--ok)} .tg.w{background:var(--no-soft);color:var(--no)} .tg.m{background:#F1F2F6;color:var(--ink3)}
.leg{display:flex;gap:4mm;font-size:9.5pt;color:var(--ink3);font-weight:700;margin-top:1.6mm}
.leg i{display:inline-block;width:6mm;height:2.6mm;border-radius:99px;vertical-align:middle;margin-right:1mm}
.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:0 4mm}
.qr{display:grid;grid-template-columns:8mm 1fr 9mm 9mm 7mm 11mm;align-items:center;gap:1mm;font-size:10.5pt;padding:.9mm 1mm;border-bottom:1px solid #EEF0F4}
.qr.h{font-size:9pt;color:var(--ink3);font-weight:700;border-bottom:1.2px solid var(--ink3)}
.qr .k{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9.5pt}
.qr .o{font-weight:900;text-align:center} .qr.x{background:var(--no-soft)} .qr.p{background:#FDF3E1}
.qr .o.y{color:var(--ok)} .qr .o.n{color:var(--no)} .qr .r{text-align:right;color:var(--ink3);font-size:9.5pt}
.wq{border:1px solid var(--line);border-radius:2.6mm;padding:2.4mm 3.2mm;break-inside:avoid}
.wpair{display:grid;grid-template-columns:1fr 1fr;gap:2.4mm;margin-top:2.4mm;align-items:start}
.wq .hd{display:flex;gap:1.8mm;align-items:baseline;flex-wrap:wrap;font-size:10.8pt}
.wq .hd b{font-size:13pt;color:var(--navy);font-weight:900}
.wq .hd .k{font-weight:700;color:var(--gold)}
.wq .hd .r{margin-left:auto;font-size:10pt;color:var(--ink3)}
.wq .mk{font-weight:800} .wq .mk .me{color:var(--no)} .wq .mk .an{color:var(--ok)}
.wq p{margin:1.2mm 0 0;font-size:10.6pt;line-height:1.58;color:var(--ink2)}
.wq p b{color:var(--ink)}
.trend svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<article id="ssr"></article>
<div id="gate" class="msg">불러오는 중…</div>
<div id="app" hidden></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const QS=new URLSearchParams(location.search);
const TOKEN=(location.pathname.match(/\/mo\/([^/?#]+)/)||[])[1]||QS.get("t")||"";
const PIN=(()=>{try{return localStorage.getItem("naesinfit.pin")||sessionStorage.getItem("naesinfit.pin")||""}catch(e){return ""}})();
const mdText=d=>{ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${+m}월 ${+dd}일 (${"일월화수목금토"[new Date(+y,+m-1,+dd).getDay()]})`; };
const md=d=>{ const [,m,dd]=String(d||"").split("-"); return `${+m}.${+dd}`; };
const circ=v=>String(v||"").split(",").map(x=>"①②③④⑤"[+x-1]||x).join(" ")||"빈칸";
const firstName=n=>{ const b=String(n||"").replace(/[A-Za-z0-9]+$/,""); return b.length>=3?b.slice(1):b; };
const hl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<mark class="hl">$1</mark>');
const fname=R=>`${R.name}_${R.exam.title}_동형모고성적표`.replace(/[\\/:*?"<>|]/g,"");

/* ── 블록 만들기 ── */
function headBig(R){ return `<div class="blk"><div class="eb">HAZEL'S MOCK EXAM REPORT</div>
  <div class="h1">헤이즐 쌤 동형모의고사 성적표 · <span class="nm">${esc(R.name)}</span></div>
  <div class="meta">${esc(R.exam.title)} · ${mdText(R.exam.day)}${R.exam.cls?` · ${esc(R.exam.cls)}`:""}</div></div>`; }
function headSlim(R){ return `<div class="blk"><div class="slim"><span class="t">${esc(R.name)}</span><span class="m">${esc(R.exam.title)} · ${md(R.exam.day)}</span><span class="eb">MOCK EXAM REPORT</span></div></div>`; }
function tiles(R){
  const pos=v=>Math.max(0,Math.min(100,R.total?v/R.total*100:0));
  return `<div class="blk"><div class="tiles">
    <div><small>내 점수</small><b class="n">${R.score}<em>/ ${R.total}점</em></b><span>정답률 ${R.pct}%</span></div>
    <div><small>${R.grade?"등급":"정답률"}</small><b class="n">${R.grade?esc(R.grade.label):R.pct+"%"}</b><span>${R.grade?esc(R.grade.note):"&nbsp;"}</span></div>
    <div><small>반 석차</small><b class="n">${R.rank}<em>등 / ${R.n}명</em></b><span>${R.rank===1?"반 1등":`상위 ${Math.max(1,Math.round(R.rank/R.n*100))}%`}</span></div>
    <div><small>반 평균</small><b class="n">${R.avg}<em>점</em></b><span>최고 ${R.max} · 최저 ${R.min}</span></div></div>
    <div class="line"><div class="tr"></div>
      <div class="pt" style="left:${pos(R.avg)}%;top:${Math.abs(pos(R.avg)-pos(R.score))<9?9.4:0}mm"><span>반 평균 ${R.avg}</span><i style="background:var(--cls)"></i></div>
      <div class="pt" style="left:${pos(R.max)}%;${Math.abs(pos(R.max)-pos(R.score))<9?"display:none":""}"><span>최고 ${R.max}</span><i style="background:var(--navy)"></i></div>
      <div class="pt" style="left:${pos(R.score)}%"><span style="color:var(--pink)">나 ${R.score}</span><i style="background:var(--pink);width:4.4mm;height:4.4mm"></i></div>
      <span class="ax" style="left:0">0</span><span class="ax" style="right:0">${R.total}</span></div></div>`; }
function comment(R){ const c=R.comment||{}; if(!c.body) return "";
  return `<div class="blk"><div class="st">헤이즐 쌤 코멘트</div><div class="cmt">${c.title?`<h3>${hl(c.title)}</h3>`:""}${String(c.body).split(/\n+/).filter(Boolean).map(p=>`<p>${hl(p)}</p>`).join("")}</div></div>`; }
function kinds(R){ if(!R.kinds.length) return "";
  const col=p=>p>=80?"var(--ok)":p>=60?"var(--mid)":"var(--no)";
  const tag=k=>k.cls==null?"":k.pct-k.cls>=12&&k.pct>=70?`<span class="tg s">강점</span>`:(k.pct-k.cls<=-12||k.pct<50)?`<span class="tg w">보완</span>`:`<span class="tg m">보통</span>`;
  return `<div class="blk"><div class="st">유형별 강약점 <small>막대 = ${esc(firstName(R.name))} · 점선 = 반 평균</small></div>
    ${R.kinds.map(k=>`<div class="kd"><span class="k">${esc(k.k)}</span><span class="tr"><i style="width:${k.pct}%;background:${col(k.pct)}"></i>${k.cls!=null?`<s style="left:${k.cls}%"></s>`:""}</span>
      <span class="v n"><b>${k.ok}/${k.n}</b> · ${k.pct}%${k.cls!=null?` <small style="color:var(--ink3)">(반 ${k.cls}%)</small>`:""}</span>${tag(k)}</div>`).join("")}</div>`; }
function trend(R){ const T=R.trend||[]; if(T.length<2) return "";
  const W=640,H=150,px=40,py=26, x=i=>px+(T.length===1?0:i*(W-2*px)/(T.length-1)), y=v=>py+(100-v)*(H-2*py)/100;
  const pts=T.map((t,i)=>`${x(i)},${y(t.pct)}`).join(" ");
  return `<div class="blk trend"><div class="st">동형모고 누적 추이 <small>정답률(%) · 반 석차</small></div>
    <svg viewBox="0 0 ${W} ${H+24}" role="img" aria-label="회차별 정답률">
      ${[0,50,100].map(v=>`<line x1="${px}" x2="${W-px}" y1="${y(v)}" y2="${y(v)}" stroke="#E6E8EE"/><text x="${px-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#7A7F8E">${v}</text>`).join("")}
      <polyline points="${pts}" fill="none" stroke="#1E2A4A" stroke-width="2.4"/>
      ${T.map((t,i)=>`<circle cx="${x(i)}" cy="${y(t.pct)}" r="${t.cur?6:4.5}" fill="${t.cur?"#E0457B":"#1E2A4A"}" stroke="#fff" stroke-width="2"/>
        <text x="${x(i)}" y="${y(t.pct)-11}" font-size="12.5" font-weight="800" text-anchor="middle" fill="${t.cur?"#E0457B":"#1F2433"}">${t.pct}%</text>
        <text x="${x(i)}" y="${H+4}" font-size="11.5" text-anchor="middle" fill="#454B5C">${md(t.day)}</text>
        <text x="${x(i)}" y="${H+19}" font-size="10.5" text-anchor="middle" fill="#7A7F8E">${t.rank}등/${t.n}명</text>`).join("")}
    </svg></div>`; }
function qgrid(R){
  const it=R.items, per=Math.ceil(it.length/3), cols=[0,1,2].map(c=>it.slice(c*per,(c+1)*per));
  const row=i=>`<div class="qr ${i.ok?"":i.part?"p":"x"}"><b class="n">${esc(i.n)}</b><span class="k">${esc(i.k||"")}</span>
    <span class="n" style="text-align:center">${i.t==="s"?`<b>${i.got}</b>`:esc(circ(i.mark).replace("빈칸","-"))}</span><span class="n" style="text-align:center">${i.t==="s"?`/${i.p}`:esc(circ(i.a))}</span>
    <span class="o ${i.ok?"y":"n"}">${i.ok?"O":i.part?"△":"X"}</span><span class="r n">${i.rate??"-"}%</span></div>`;
  const hd=`<div class="qr h"><span>번호</span><span>유형</span><span style="text-align:center">내 답</span><span style="text-align:center">정답</span><span></span><span class="r">반 정답</span></div>`;
  return `<div class="blk"><div class="st">문항별 결과 <small>O 맞음 · X 틀림 · △ 부분점수 · 반 정답 = 우리 반 정답률</small></div>
    <div class="qg">${cols.map(c=>`<div>${hd}${c.map(row).join("")}</div>`).join("")}</div></div>`; }
function wrongBlocks(R){
  const W=R.items.filter(i=>!i.ok); if(!W.length) return [`<div class="blk"><div class="st">틀린 문항 다시 보기</div><div class="cmt"><p>틀린 문항이 없어요. 🎉 만점입니다!</p></div></div>`];
  const card=i=>`<div class="wq">${i.t==="s"
      ?`<div class="hd"><b>서술형 ${esc(i.n)}</b><span class="k">${esc(i.k||"")}</span><span class="mk n">${i.got} / ${i.p}점</span><span class="r">반 ${i.rate??"-"}%</span></div>
        ${i.mark?`<p><b>내 답</b> ${esc(i.mark)}</p>`:""}${i.m?`<p><b>모범답안</b> ${esc(i.m)}</p>`:""}${i.why?`<p><b>감점 이유</b> ${esc(i.why)}</p>`:""}${i.e?`<p><b>해설</b> ${esc(i.e)}</p>`:""}`
      :`<div class="hd"><b>${esc(i.n)}번</b><span class="k">${esc(i.k||"")}</span><span class="mk">내 답 <span class="me">${esc(circ(i.mark))}</span> → 정답 <span class="an">${esc(circ(i.a))}</span></span><span class="r">반 ${i.rate??"-"}%</span></div>
        ${i.e?`<p>${esc(i.e)}</p>`:""}`}</div>`;
  const out=[];
  for(let k=0;k<W.length;k+=2){
    const head=k===0?`<div class="st">틀린 문항 다시 보기 <small>${W.length}문항 · '반 %'가 높은데 틀린 문항부터 꼭 다시 보세요</small></div>`:"";
    out.push(`<div class="blk" style="margin-top:${k?0:5}mm">${head}<div class="wpair">${card(W[k])}${W[k+1]?card(W[k+1]):""}</div></div>`); }
  return out; }

/* ── 쪽 나누기: 블록을 차례로 담다가 넘치면 다음 쪽 ── */
function buildReport(R,host){
  host.innerHTML="";
  const blocks=[headBig(R),tiles(R),comment(R),kinds(R),trend(R),qgrid(R),...wrongBlocks(R)].filter(Boolean);
  const mk=(first)=>{ const pg=document.createElement("div"); pg.className="page"; pg.innerHTML=`<div class="in">${first?"":headSlim(R)}</div><div class="ft"><span>헤이즐's 스터디로그 · ${esc(R.exam.title)}</span><span class="pn"></span></div>`; host.appendChild(pg); return pg; };
  let pg=mk(true), inn=pg.querySelector(".in");
  const limit=()=>pg.querySelector(".ft").offsetTop-6;
  for(const b of blocks){
    const tmp=document.createElement("div"); tmp.innerHTML=b; const el=tmp.firstElementChild; inn.appendChild(el);
    if(inn.offsetTop+inn.offsetHeight>limit() && inn.children.length>(pg===host.firstElementChild?1:1)){
      el.remove(); pg=mk(false); inn=pg.querySelector(".in");
      const t2=document.createElement("div"); t2.innerHTML=b.replace(/margin-top:0mm/,"margin-top:5mm"); inn.appendChild(t2.firstElementChild);
    }
  }
  const P=[...host.querySelectorAll(".page")]; P.forEach((p,i)=>p.querySelector(".pn").textContent=`${i+1} / ${P.length}`);
  return P;
}

/* ── 내보내기 ── */
function loadJS(src,test){ return test()?Promise.resolve():new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>no(new Error("도구를 불러오지 못했어요")); document.head.appendChild(s); }); }
async function libs(){
  await loadJS("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",()=>window.html2canvas);
  await loadJS("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",()=>window.jspdf);
  await document.fonts.ready;
}
async function pageCanvas(pg,dpi){ const sc=pg.closest(".scaler"); const prev=sc?sc.style.transform:""; if(sc) sc.style.transform="none";
  try{ return await html2canvas(pg,{scale:dpi/96,backgroundColor:"#ffffff",useCORS:true,logging:false}); } finally{ if(sc) sc.style.transform=prev; } }
async function reportPDF(pages,pdf){ const { jsPDF }=window.jspdf; pdf=pdf||new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true}); let first=!pdf.__used;
  for(const pg of pages){ const c=await pageCanvas(pg,200); if(!first) pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg",0.93),"JPEG",0,0,210,297); first=false; pdf.__used=true; } return pdf; }
async function reportPNGs(pages){ const out=[]; for(const pg of pages){ const c=await pageCanvas(pg,150); out.push(await new Promise(r=>c.toBlob(r,"image/png"))); } return out; }
function save(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }

/* ── 화면 ── */
let LIST=[];
function fitScreen(){ document.querySelectorAll(".scaler").forEach(s=>{ const w=s.firstElementChild?s.firstElementChild.offsetWidth:794, avail=Math.min(window.innerWidth-24,820);
  const k=Math.min(1,avail/w); s.style.transform=k<1?`scale(${k})`:""; s.parentElement.style.height=k<1?(s.offsetHeight*k)+"px":""; s.parentElement.style.width=k<1?(w*k)+"px":""; }); }
function render(teacher){
  const app=$("#app"), noC=LIST.filter(R=>!(R.comment&&R.comment.body)).map(R=>R.name);
  app.innerHTML=(teacher?`<div class="bar"><b>📝 동형모고 성적표 · ${esc(LIST[0].exam.title)} ${LIST.length}명</b><span class="sp"></span><button class="btn" id="b-links">🔗 학부모 링크 모두 복사</button>
      <button class="btn" id="b-all-pdf">📚 전체 합본 PDF</button><button class="btn pri" id="b-zip">📦 전부 받기 (개별 PDF · PNG · 합본)</button></div>
    <div class="list">${noC.length?`<div class="warn">코멘트가 없어 코멘트 칸을 뺀 학생: <b>${esc(noC.join(", "))}</b></div>`:""}</div>`
    :`<div class="bar"><b>${esc(LIST[0].name)} 동형모의고사 성적표</b><span class="sp"></span>${LIST.length>1?`<select class="btn" id="b-pick">${LIST.map((R,i)=>`<option value="${i}">${md(R.exam.day)} · ${esc(R.exam.title)}</option>`).join("")}</select>`:""}<button class="btn pri" id="b-one">📄 PDF 저장</button></div>`)
    +LIST.map((R,i)=>`<div class="rep" data-i="${i}"${!teacher&&i?" hidden":""}>${teacher?`<div class="rep-h"><b>${esc(R.name)}</b> ${R.score}/${R.total}점 · ${R.rank}등
      <button class="btn" data-pdf="${i}">PDF</button><button class="btn" data-png="${i}">PNG</button><button class="btn" data-link="${i}">🔗 학부모 링크 복사</button></div>`:""}<div><div class="scaler"><div class="pages" id="pg${i}"></div></div></div></div>`).join("");
  app.hidden=false; $("#gate").hidden=true;
  LIST.forEach((R,i)=>buildReport(R,$("#pg"+i)));
  fitScreen();
}
const pagesOf=i=>[...document.querySelectorAll(`#pg${i} .page`)];
const linkOf=R=>`${location.origin}/mo/${R.token}?e=${R.exam.id}`;
const linkTxt=R=>`헤이즐 쌤 동형모의고사 성적표 · ${R.name} (${md(R.exam.day)})\n${linkOf(R)}`;
document.addEventListener("click",async e=>{
  const t=e.target, busy=async(btn,fn)=>{ const tx=btn.textContent; btn.disabled=true; btn.textContent="만드는 중…"; try{ await libs(); await fn(); }catch(err){ alert(err.message); } btn.disabled=false; btn.textContent=tx; };
  const p=t.closest("[data-pdf]"); if(p){ const i=+p.dataset.pdf; return busy(p,async()=>save((await reportPDF(pagesOf(i))).output("blob"),fname(LIST[i])+".pdf")); }
  const g=t.closest("[data-png]"); if(g){ const i=+g.dataset.png; return busy(g,async()=>{ const b=await reportPNGs(pagesOf(i)); b.forEach((x,k)=>save(x,fname(LIST[i])+(b.length>1?`_${k+1}`:"")+".png")); }); }
  const l=t.closest("[data-link]"); if(l){ const R=LIST[+l.dataset.link]; try{ await navigator.clipboard.writeText(linkTxt(R)); l.textContent="복사했어요 ✓"; }catch(err){ prompt("링크",linkOf(R)); } return; }
  if(t.closest("#b-one")){ const i=+(($("#b-pick")||{}).value||0); return busy(t.closest("#b-one"),async()=>save((await reportPDF(pagesOf(i))).output("blob"),fname(LIST[i])+".pdf")); }
  if(t.closest("#b-links")){ const txt=LIST.map(linkTxt).join("\n\n"); try{ await navigator.clipboard.writeText(txt); t.closest("#b-links").textContent="복사했어요 ✓"; }catch(err){ prompt("링크",txt); } return; }
  if(t.closest("#b-all-pdf")) return busy(t.closest("#b-all-pdf"),async()=>{ let pdf=null; for(let i=0;i<LIST.length;i++) pdf=await reportPDF(pagesOf(i),pdf); save(pdf.output("blob"),`동형모고성적표_합본_${LIST[0].exam.title}.pdf`); });
  if(t.closest("#b-zip")) return busy(t.closest("#b-zip"),async()=>{
    await loadJS("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",()=>window.JSZip);
    const z=new JSZip(); let all=null;
    for(let i=0;i<LIST.length;i++){ const pg=pagesOf(i), nm=fname(LIST[i]);
      const one=await reportPDF(pg); z.file(`개별PDF/${nm}.pdf`,one.output("arraybuffer"));
      const pn=await reportPNGs(pg); pn.forEach((b,k)=>z.file(`PNG/${nm}${pn.length>1?`_${k+1}`:""}.png`,b));
      all=await reportPDF(pg,all); }
    z.file(`동형모고성적표_합본_${LIST[0].exam.title}.pdf`,all.output("arraybuffer"));
    z.file(`학부모링크.txt`,LIST.map(linkTxt).join("\n\n"));
    save(await z.generateAsync({type:"blob"}),`동형모고성적표_${LIST[0].exam.title}.zip`.replace(/[\\/:*?"<>|]/g,"")); });
});
document.addEventListener("change",e=>{ if(e.target.id==="b-pick"){ document.querySelectorAll(".rep").forEach(r=>r.hidden=r.dataset.i!==e.target.value); fitScreen(); } });
window.addEventListener("resize",fitScreen);

(async function start(){
  try{
    await document.fonts.ready;
    if(TOKEN){
      const r=await fetch(`/api/mock?t=${encodeURIComponent(TOKEN)}`,{cache:"no-store"}); const j=await r.json();
      if(!r.ok) throw new Error(j.error||"성적표를 불러오지 못했어요");
      let L=j.list||[]; const ex=+QS.get("e")||0; if(ex){ const k=L.findIndex(x=>+x.exam.id===ex); if(k>0) L=[L[k],...L.slice(0,k),...L.slice(k+1)]; }
      if(!L.length) throw new Error("아직 동형모고 성적표가 없어요");
      LIST=L; render(false);
    } else {
      if(!PIN) throw new Error("선생님 화면(동형모고)에서 열어 주세요");
      const ex=QS.get("exam")||"", st=QS.get("student")||"";
      const r=await fetch(`/api/mock?exam=${encodeURIComponent(ex)}&report=1${st?`&student=${encodeURIComponent(st)}`:""}`,{cache:"no-store",headers:{"x-pin":PIN}}); const j=await r.json();
      if(!r.ok) throw new Error(j.error||"불러오지 못했어요");
      LIST=j.list||[]; if(!LIST.length) throw new Error("확정된 OMR이 없어요");
      render(true);
      if(QS.get("auto")==="zip"){ const b=$("#b-zip"); if(b) setTimeout(()=>b.click(),600); }
    }
  }catch(err){ $("#gate").textContent=err.message; }
})();
</script>
