<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습 리포트 · hazel_studylog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Archivo:wght@500;600;700;800&display=swap">
<style>
:root{
  --page:#F1EFFA; --surface:#fff; --surface-2:#F7F6FC; --line:#E7E4F3; --line-2:#D9D5EC;
  --ink:#191627; --ink-2:#57516F; --ink-3:#8B85A6;
  --pri:#6B4EFF; --pri-2:#9A6BFF; --pri-soft:#EDE8FF;
  --ok:#12A150; --ok-soft:#E4F5EA; --no:#E5484D; --no-soft:#FCEAEA;
  --warn:#E8890C; --warn-soft:#FEF3E2; --info:#1F86E8; --info-soft:#E6F1FD;
  --gold:#D99A00;
  --sh:0 1px 2px rgba(25,22,39,.05), 0 10px 26px -18px rgba(25,22,39,.3);
  --grid:rgba(25,22,39,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0E0C1A; --surface:#1A1728; --surface-2:#221E33; --line:#2C2740; --line-2:#3A3453;
  --ink:#F1EFF9; --ink-2:#A9A3C0; --ink-3:#7D7799;
  --pri:#8E76FF; --pri-2:#B18BFF; --pri-soft:#251F44;
  --ok:#3ECF7E; --ok-soft:#12301F; --no:#FF6B6F; --no-soft:#38191C;
  --warn:#F2A93B; --warn-soft:#37280F; --info:#63B3F5; --info-soft:#132A3F;
  --gold:#F0C34B;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -20px rgba(0,0,0,.9);
  --grid:rgba(241,239,249,.09);
}}
:root[data-theme="dark"]{
  --page:#0E0C1A; --surface:#1A1728; --surface-2:#221E33; --line:#2C2740; --line-2:#3A3453;
  --ink:#F1EFF9; --ink-2:#A9A3C0; --ink-3:#7D7799;
  --pri:#8E76FF; --pri-2:#B18BFF; --pri-soft:#251F44;
  --ok:#3ECF7E; --ok-soft:#12301F; --no:#FF6B6F; --no-soft:#38191C;
  --warn:#F2A93B; --warn-soft:#37280F; --info:#63B3F5; --info-soft:#132A3F;
  --gold:#F0C34B;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -20px rgba(0,0,0,.9);
  --grid:rgba(241,239,249,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:'Gothic A1','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.6;word-break:keep-all}
.n{font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--sh)}
h2.s{margin:26px 0 11px;font-size:15px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}

/* 헤더 */
.top{background:linear-gradient(120deg,var(--pri),var(--pri-2));border-radius:20px;padding:18px 20px;color:#fff;
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.top .eb{font-family:'Archivo',sans-serif;font-size:12px;font-weight:800;letter-spacing:.13em}
.top .sb{font-size:12px;opacity:.9;margin-top:3px}
.top .rt{text-align:right}
.top .rt b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.top .rt span{display:block;font-size:11.5px;opacity:.85;margin-top:2px;font-family:'Archivo',sans-serif}

/* 히어로 */
.hero{margin-top:12px;background:linear-gradient(135deg,var(--pri),var(--pri-2));border-radius:20px;padding:20px;color:#fff;
  box-shadow:0 16px 40px -24px var(--pri)}
.hero-in{display:flex;gap:16px;align-items:flex-start}
.grade{flex:none;width:88px;text-align:center;background:rgba(255,255,255,.16);border-radius:16px;padding:12px 8px}
.grade b{display:block;font-family:'Archivo',sans-serif;font-size:34px;font-weight:800;line-height:1}
.grade span{display:block;font-size:10.5px;opacity:.9;margin-top:5px;font-weight:600}
.hero h1{margin:2px 0 0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.4}
.hero h1 mark{background:rgba(255,255,255,.24);color:#fff;padding:1px 7px;border-radius:7px}
.hero p{margin:8px 0 0;font-size:13px;line-height:1.65;opacity:.93}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.15);border-radius:12px;padding:10px 12px}
.chip i{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.88}
.chip b{display:block;font-family:'Archivo',sans-serif;font-size:19px;font-weight:800;margin-top:3px}

/* 성장 */
.grow{display:flex;gap:18px;align-items:center;padding:18px 20px;flex-wrap:wrap}
.grow .big{flex:none;text-align:center;min-width:96px}
.grow .big b{display:block;font-family:'Archivo',sans-serif;font-size:31px;font-weight:800;color:var(--ok);line-height:1}
.grow .big span{display:block;font-size:11px;color:var(--ink-3);font-weight:700;margin-top:5px}
.grow .txt{flex:1;min-width:220px}
.grow .txt b{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.grow .txt p{margin:5px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.steps{display:flex;align-items:center;gap:5px;margin-top:11px;flex-wrap:wrap}
.steps em{font-style:normal;font-family:'Archivo',sans-serif;font-size:11.5px;font-weight:700;color:var(--ink-3);
  background:var(--surface-2);border-radius:7px;padding:3px 9px}
.steps em:last-child{background:var(--pri);color:#fff}
.steps i{font-style:normal;color:var(--ink-3);font-size:10px}

/* 잘한 점 */
.good3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.g{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:15px 16px;position:relative;overflow:hidden}
.g::after{content:attr(data-no);position:absolute;right:12px;top:8px;font-family:'Archivo',sans-serif;
  font-size:23px;font-weight:800;color:var(--line-2)}
.g .ic{font-size:17px}
.g b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em;margin-top:5px}
.g p{margin:5px 0 0;font-size:12px;color:var(--ink-2);line-height:1.6}

/* 점수 카드 */
.sc4{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
.sc{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:14px 15px;border-top:4px solid var(--pri)}
.sc.a{border-top-color:var(--ok)} .sc.b{border-top-color:var(--info)} .sc.c{border-top-color:var(--warn)} .sc.d{border-top-color:var(--no)}
.sc i{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.sc b{display:block;font-family:'Archivo',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1}
.sc b em{font-style:normal;font-size:14px;color:var(--ink-3)}
.sc .avg{font-size:11.5px;color:var(--ink-3);margin-top:6px;font-family:'Archivo',sans-serif}
.sc .dt{margin-top:7px;font-size:11.5px;font-weight:800;font-family:'Archivo',sans-serif}
.up{color:var(--ok)} .down{color:var(--no)} .pass{color:var(--info)}

/* 차트 */
.charts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.charts{grid-template-columns:1fr 1fr}}
.ch{padding:15px 16px}
.ch h3{margin:0 0 2px;font-size:13px;font-weight:800;letter-spacing:-.01em}
.ch p{margin:0 0 10px;font-size:11.5px;color:var(--ink-3)}
.ch svg{width:100%;height:132px;display:block;overflow:visible}
.lgd{display:flex;gap:12px;font-size:11px;color:var(--ink-3);margin-bottom:7px;font-weight:600}
.lgd s{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.lgd s::before{content:"";width:13px;height:3px;border-radius:2px;background:var(--pri)}
.lgd s.avg::before{background:none;border-top:2px dashed var(--ink-3);height:0}

/* 막대 */
.bars{padding:16px 18px}
.bar{display:grid;grid-template-columns:74px 1fr 52px;align-items:center;gap:11px;padding:7px 0}
.bar .lb{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.bar .tr{position:relative;height:22px;border-radius:8px;background:var(--surface-2);overflow:visible}
.bar .tr>i{display:block;height:100%;border-radius:8px;background:var(--pri);position:relative}
.bar .tr>i.warn{background:var(--warn)} .bar .tr>i.bad{background:var(--no)}
.bar .tr>i>u{position:absolute;right:8px;top:0;line-height:22px;font-size:11px;font-weight:800;color:#fff;
  text-decoration:none;font-family:'Archivo',sans-serif}
.bar .tr>s{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink-3);text-decoration:none}
.bar .tr>s::after{content:attr(data-l);position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  font-size:9px;color:var(--ink-3);white-space:nowrap;font-family:'Archivo',sans-serif;font-weight:700}
.bar .dt{text-align:right;font-size:11.5px;font-weight:800;font-family:'Archivo',sans-serif}

/* 보완 */
.fix{background:var(--warn-soft);border-radius:16px;padding:16px 18px}
.fix b{font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.fix p{margin:6px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.7}
.miss{display:grid;gap:6px;margin-top:12px}
.miss div{display:flex;gap:8px;align-items:baseline;background:var(--surface);border-radius:10px;padding:8px 11px;font-size:12px}
.miss s{text-decoration:line-through;color:var(--no);font-weight:700;font-family:'Archivo',sans-serif}
.miss u{text-decoration:none;color:var(--ok);font-weight:700;font-family:'Archivo',sans-serif}
.miss span{color:var(--ink-3);font-size:11px;margin-left:auto;white-space:nowrap}
.home{margin-top:10px;background:var(--info-soft);border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.home b{color:var(--ink)}

/* 코멘트 */
.cmt{display:flex;gap:13px;padding:18px 20px}
.cmt .av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--pri-soft);display:grid;place-items:center;font-size:20px}
.cmt .who{font-size:12px;font-weight:800;color:var(--pri)}
.cmt p{margin:6px 0 0;font-size:13.5px;line-height:1.85}
.cmt p b{font-weight:800}
.cmt .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.cmt .tags em{font-style:normal;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-2);padding:4px 10px;border-radius:999px}
.foot{margin-top:22px;text-align:center;font-size:10.5px;color:var(--ink-3);line-height:1.8}
@media print{body{background:#fff}.wrap{padding:0}.card,.g,.sc{box-shadow:none;border:1px solid var(--line)}}
</style><style>
.gate{max-width:400px;margin:16vh auto;padding:0 22px;text-align:left}
.gate .eb{font-family:'Archivo',sans-serif;font-size:12px;font-weight:800;letter-spacing:.13em;color:var(--pri)}
.gate h1{margin:8px 0 6px;font-size:26px;font-weight:800;letter-spacing:-.03em}
.gate p{margin:0 0 22px;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.gate input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line-2);
  background:var(--surface);font-size:16px;font-weight:600;color:var(--ink)}
.gate input:focus{border-color:var(--pri);outline:none}
.gate button{width:100%;margin-top:10px;padding:15px;border-radius:14px;border:0;background:var(--pri);
  color:#fff;font-size:15.5px;font-weight:800;font-family:inherit;cursor:pointer}
.gate .err{color:var(--no);font-size:13px;font-weight:700;margin-top:10px;min-height:19px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.act button{padding:9px 15px;border-radius:11px;border:0;background:var(--surface);box-shadow:var(--sh);
  font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.empty{text-align:center;padding:70px 24px;color:var(--ink-3)}
.empty h3{margin:0 0 6px;font-size:18px;font-weight:800;color:var(--ink)}
@media print{.act{display:none}}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="eb">DAILY REPORT</div>
  <h1>학습 리포트</h1>
  <p>이름을 입력하면 오늘과 누적 성취를 한 장으로 보여드려요.</p>
  <input id="nm" placeholder="이름 (예: 김지민)" autocomplete="name">
  <button id="go">리포트 보기</button>
  <div class="err" id="err"></div>
</div>

<div class="wrap" id="app" hidden></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n0=v=>Math.round(v);
const PARTORDER=["wmean","wsyn","wsynw","wdef","twrite","cloze","vocab","gram","word","word2","fix","fixg","fixv","tf","choice","sjt","gbbw","gbb","vbbw","vbb","order","insert","arrange","mwrite","write"];
const PARTBASE={wmean:"단어 뜻 쓰기",wsyn:"유의어 객관식",wsynw:"유의어 주관식",wdef:"영영풀이",vocab:"어휘 선택",gram:"어법 선택",word:"단어 밑줄",word2:"통변형 ②",fixg:"통변형 ③ 어법 집중",fixv:"통변형 ④ 어휘 집중",fix:"어법 오류 수정",
  tf:"내용일치 TF",order:"순서 배열",insert:"문장 삽입",arrange:"단어배열",write:"영작",twrite:"주제문 영작",cloze:"빈칸 추론",choice:"독해",sjt:"영문선지 비법 TEST",gbbw:"어법 비법 밑줄 고치기",gbb:"어법 비법 TEST",vbbw:"어휘 비법 밑줄 고치기",vbb:"어휘 비법 TEST",mwrite:"중요 문장 영작"};

/* ── 등급 (절대평가) ── */
const GRADES=[[95,"A+"],[90,"A"],[85,"A-"],[80,"B+"],[75,"B"],[70,"B-"],[65,"C+"],[60,"C"],[55,"C-"],[50,"D"]];
const gradeOf=s=>{ for(const [k,g] of GRADES) if(s>=k) return g; return "F"; };
const VD_PASS=90, VD_PART=75;
const vdOf=(s,done)=> done<100 ? {k:"todo", n:"진행 중", c:"#6B4EFF"}
                    : s>=VD_PASS ? {k:"pass", n:"통과",        c:"#12A150"}
                    : s>=VD_PART ? {k:"part", n:"부분 재시험", c:"#B87A00"}
                                 : {k:"full", n:"전체 재시험", c:"#E5484D"};

/* ── 오답 패턴 분류 ── */
const L=s=>String(s||"").toLowerCase().trim();
function classify(mine,right,part){
  const m=L(mine), r=L(right), both=m+" | "+r;
  const has=(x,re)=>re.test(x);
  const BE=/\b(is|are|was|were|be|been|being)\b/;
  if(/(순서|삽입|내용일치)/.test(part)) return "글의 흐름 · 지시어";
  if(/(어휘|단어)/.test(part) && !BE.test(both)) return "어휘 혼동";
  if(has(m,BE)!==has(r,BE) || /\b(been|be)\s+\w+ed\b/.test(both)) return "수동태";
  if(/^(is|are)$/.test(m)&&/^(is|are)$/.test(r)) return "주어–동사 수일치";
  if(/^(was|were)$/.test(m)&&/^(was|were)$/.test(r)) return "주어–동사 수일치";
  if(/^(has|have)$/.test(m)&&/^(has|have)$/.test(r)) return "주어–동사 수일치";
  if(/^(does|do)$/.test(m)&&/^(does|do)$/.test(r)) return "주어–동사 수일치";
  if(m.replace(/s$/,"")===r.replace(/s$/,"") && m!==r) return "주어–동사 수일치";
  if(/^to\s/.test(m)!==/^to\s/.test(r)) return "to부정사 · 동명사";
  if(/ing$/.test(m)!==/ing$/.test(r) && /ed$/.test(both)) return "분사 (능동·수동)";
  if(/ing$/.test(m)!==/ing$/.test(r)) return "준동사 자리";
  if(/^(that|what|which|where|when|how|whatever|whichever)$/.test(m)&&
     /^(that|what|which|where|when|how|whatever|whichever)$/.test(r)) return "관계사 · 접속사";
  if(/ed$/.test(m)!==/ed$/.test(r)) return "시제";
  return "어휘 혼동";
}
const TIPS={
  "수동태":"주어가 그 동작을 <b>하는지 받는지</b>부터 보게 하세요. 자동사(occur, happen, arise)는 수동태 자체가 안 됩니다.",
  "주어–동사 수일치":"동사를 만나면 <b>주어가 무엇인지</b> 손으로 짚고 단수·복수를 확인하는 습관을 들여 주세요.",
  "to부정사 · 동명사":"앞의 동사가 무엇을 목적어로 받는지 <b>동사별로 외우는</b> 게 빠릅니다 (manage to, enjoy -ing).",
  "분사 (능동·수동)":"수식받는 명사가 <b>감정을 느끼는 쪽인지 주는 쪽인지</b> 물어보게 하세요.",
  "준동사 자리":"한 문장에 <b>정동사는 하나</b>입니다. 접속사가 없으면 뒤 동사는 분사로 바뀝니다.",
  "관계사 · 접속사":"뒤에 오는 절이 <b>완전한지 불완전한지</b>로 갈립니다. 목적어가 없으면 what입니다.",
  "시제":"문장 안의 <b>시간 표현</b>을 먼저 찾고 동사를 맞추게 하세요.",
  "어휘 혼동":"철자가 비슷한 짝을 <b>뜻과 함께</b> 묶어 외우게 하세요 (affect–effect, adapt–adopt).",
  "글의 흐름 · 지시어":"연결어(However, So)와 지시어(this, they)가 <b>무엇을 받는지</b> 표시하며 읽게 하세요."
};

/* ── 데이터 ── */
let MF=null;
const dkey=v=>{const d=new Date(v);const p=x=>String(x).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;};
const fmtDate=v=>dkey(v).replace(/-/g,".");

async function load(name){
  const [mr,cr]=await Promise.all([
    fetch(`api/report?student=${encodeURIComponent(name)}`,{cache:"no-store"}),
    fetch("content/index.json",{cache:"no-store"})
  ]);
  if(!mr.ok){ const j=await mr.json().catch(()=>({})); throw new Error(j.error||"불러오지 못했습니다"); }
  MF=cr.ok?await cr.json():{books:[]};
  return mr.json();
}
function unitByBook(book, uid){
  if(uid) for(const b of (MF.books||[])) for(const u of (b.units||[]))      // 저장된 단원 id가 있으면 그게 정답
    if(u.id===String(uid).replace(/ak$/,"")) return {b,u};
  for(const b of (MF.books||[])) for(const u of (b.units||[]))   // 과목·출판사·과가 정확히 같은 단원 먼저
    if(book===`${b.subject} · ${b.publisher} · ${u.no}`) return {b,u};
  for(const b of (MF.books||[])) for(const u of (b.units||[]))
    if(book && book.includes(u.no) && book.includes(b.publisher)) return {b,u};
  for(const b of (MF.books||[])) for(const u of (b.units||[]))
    if(book && book.includes(u.no)) return {b,u};
  return null;
}

    const D=await load(name);
    $("#gate").hidden=true; LASTD=D; render(D);
    history.replaceState(null,"",`report?student=${encodeURIComponent(name)}${SELBOOK?`&book=${encodeURIComponent(SELBOOK)}`:""}`);
  }catch(e){ $("#err").textContent=e.message||"불러오지 못했습니다"; }
}
$("#go").onclick=()=>{ const v=$("#nm").value.trim(); if(v.length<2) return $("#err").textContent="이름을 입력해 주세요"; start(v); };
$("#nm").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#go").click(); });
(()=>{ const q=new URL(location.href).searchParams.get("student"); if(q) start(q); })();
</script>
