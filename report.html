<!doctype html>
<html lang="ko">
<head>
<script>document.documentElement.classList.add("js")</script>
<style>.js #ssr{display:none}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습 리포트 · hazel_studylog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Archivo:wght@500;600;700;800&display=swap">
<style>
:root{
  --page:#F1EFFA; --surface:#fff; --surface-2:#F7F6FC; --line:#E7E4F3; --line-2:#D9D5EC;
  --ink:#191627; --ink-2:#57516F; --ink-3:#8B85A6;
  --pri:#6B4EFF; --pri-2:#9A6BFF; --pri-soft:#EDE8FF;
  --ok:#12A150; --ok-soft:#E4F5EA; --no:#E5484D; --no-soft:#FCEAEA;
  --warn:#E8890C; --warn-soft:#FEF3E2; --info:#1F86E8; --info-soft:#E6F1FD;
  --gold:#D99A00;
  --sh:0 1px 2px rgba(25,22,39,.05), 0 10px 26px -18px rgba(25,22,39,.3);
  --grid:rgba(25,22,39,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0E0C1A; --surface:#1A1728; --surface-2:#221E33; --line:#2C2740; --line-2:#3A3453;
  --ink:#F1EFF9; --ink-2:#A9A3C0; --ink-3:#7D7799;
  --pri:#8E76FF; --pri-2:#B18BFF; --pri-soft:#251F44;
  --ok:#3ECF7E; --ok-soft:#12301F; --no:#FF6B6F; --no-soft:#38191C;
  --warn:#F2A93B; --warn-soft:#37280F; --info:#63B3F5; --info-soft:#132A3F;
  --gold:#F0C34B;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -20px rgba(0,0,0,.9);
  --grid:rgba(241,239,249,.09);
}}
:root[data-theme="dark"]{
  --page:#0E0C1A; --surface:#1A1728; --surface-2:#221E33; --line:#2C2740; --line-2:#3A3453;
  --ink:#F1EFF9; --ink-2:#A9A3C0; --ink-3:#7D7799;
  --pri:#8E76FF; --pri-2:#B18BFF; --pri-soft:#251F44;
  --ok:#3ECF7E; --ok-soft:#12301F; --no:#FF6B6F; --no-soft:#38191C;
  --warn:#F2A93B; --warn-soft:#37280F; --info:#63B3F5; --info-soft:#132A3F;
  --gold:#F0C34B;
  --sh:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -20px rgba(0,0,0,.9);
  --grid:rgba(241,239,249,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:'Gothic A1','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.6;word-break:keep-all}
.n{font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--sh)}
h2.s{margin:26px 0 11px;font-size:15px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}

/* 헤더 */
.top{background:linear-gradient(120deg,var(--pri),var(--pri-2));border-radius:20px;padding:18px 20px;color:#fff;
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.top .eb{font-family:'Archivo',sans-serif;font-size:12px;font-weight:800;letter-spacing:.13em}
.top .sb{font-size:12px;opacity:.9;margin-top:3px}
.top .rt{text-align:right}
.top .rt b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.top .rt span{display:block;font-size:11.5px;opacity:.85;margin-top:2px;font-family:'Archivo',sans-serif}

/* 히어로 */
.hero{margin-top:12px;background:linear-gradient(135deg,var(--pri),var(--pri-2));border-radius:20px;padding:20px;color:#fff;
  box-shadow:0 16px 40px -24px var(--pri)}
.hero-in{display:flex;gap:16px;align-items:flex-start}
.grade{flex:none;width:88px;text-align:center;background:rgba(255,255,255,.16);border-radius:16px;padding:12px 8px}
.grade b{display:block;font-family:'Archivo',sans-serif;font-size:34px;font-weight:800;line-height:1}
.grade span{display:block;font-size:10.5px;opacity:.9;margin-top:5px;font-weight:600}
.hero h1{margin:2px 0 0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.4}
.hero h1 mark{background:rgba(255,255,255,.24);color:#fff;padding:1px 7px;border-radius:7px}
.hero p{margin:8px 0 0;font-size:13px;line-height:1.65;opacity:.93}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.15);border-radius:12px;padding:10px 12px}
.chip i{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.88}
.chip b{display:block;font-family:'Archivo',sans-serif;font-size:19px;font-weight:800;margin-top:3px}

/* 성장 */
.grow{display:flex;gap:18px;align-items:center;padding:18px 20px;flex-wrap:wrap}
.grow .big{flex:none;text-align:center;min-width:96px}
.grow .big b{display:block;font-family:'Archivo',sans-serif;font-size:31px;font-weight:800;color:var(--ok);line-height:1}
.grow .big span{display:block;font-size:11px;color:var(--ink-3);font-weight:700;margin-top:5px}
.grow .txt{flex:1;min-width:220px}
.grow .txt b{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.grow .txt p{margin:5px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.steps{display:flex;align-items:center;gap:5px;margin-top:11px;flex-wrap:wrap}
.steps em{font-style:normal;font-family:'Archivo',sans-serif;font-size:11.5px;font-weight:700;color:var(--ink-3);
  background:var(--surface-2);border-radius:7px;padding:3px 9px}
.steps em:last-child{background:var(--pri);color:#fff}
.steps i{font-style:normal;color:var(--ink-3);font-size:10px}

/* 잘한 점 */
.good3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.g{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:15px 16px;position:relative;overflow:hidden}
.g::after{content:attr(data-no);position:absolute;right:12px;top:8px;font-family:'Archivo',sans-serif;
  font-size:23px;font-weight:800;color:var(--line-2)}
.g .ic{font-size:17px}
.g b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em;margin-top:5px}
.g p{margin:5px 0 0;font-size:12px;color:var(--ink-2);line-height:1.6}

/* 점수 카드 */
.sc4{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
.sc{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:14px 15px;border-top:4px solid var(--pri)}
.sc.a{border-top-color:var(--ok)} .sc.b{border-top-color:var(--info)} .sc.c{border-top-color:var(--warn)} .sc.d{border-top-color:var(--no)}
.sc i{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.sc b{display:block;font-family:'Archivo',sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1}
.sc b em{font-style:normal;font-size:14px;color:var(--ink-3)}
.sc .avg{font-size:11.5px;color:var(--ink-3);margin-top:6px;font-family:'Archivo',sans-serif}
.sc .dt{margin-top:7px;font-size:11.5px;font-weight:800;font-family:'Archivo',sans-serif}
.up{color:var(--ok)} .down{color:var(--no)} .pass{color:var(--info)}

/* 차트 */
.charts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.charts{grid-template-columns:1fr 1fr}}
.ch{padding:15px 16px}
.ch h3{margin:0 0 2px;font-size:13px;font-weight:800;letter-spacing:-.01em}
.ch p{margin:0 0 10px;font-size:11.5px;color:var(--ink-3)}
.ch svg{width:100%;height:132px;display:block;overflow:visible}
.lgd{display:flex;gap:12px;font-size:11px;color:var(--ink-3);margin-bottom:7px;font-weight:600}
.lgd s{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.lgd s::before{content:"";width:13px;height:3px;border-radius:2px;background:var(--pri)}
.lgd s.avg::before{background:none;border-top:2px dashed var(--ink-3);height:0}

/* 막대 */
.bars{padding:16px 18px}
.bar{display:grid;grid-template-columns:74px 1fr 52px;align-items:center;gap:11px;padding:7px 0}
.bar .lb{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.bar .tr{position:relative;height:22px;border-radius:8px;background:var(--surface-2);overflow:visible}
.bar .tr>i{display:block;height:100%;border-radius:8px;background:var(--pri);position:relative}
.bar .tr>i.warn{background:var(--warn)} .bar .tr>i.bad{background:var(--no)}
.bar .tr>i>u{position:absolute;right:8px;top:0;line-height:22px;font-size:11px;font-weight:800;color:#fff;
  text-decoration:none;font-family:'Archivo',sans-serif}
.bar .tr>s{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink-3);text-decoration:none}
.bar .tr>s::after{content:attr(data-l);position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  font-size:9px;color:var(--ink-3);white-space:nowrap;font-family:'Archivo',sans-serif;font-weight:700}
.bar .dt{text-align:right;font-size:11.5px;font-weight:800;font-family:'Archivo',sans-serif}

/* 보완 */
.fix{background:var(--warn-soft);border-radius:16px;padding:16px 18px}
.fix b{font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.fix p{margin:6px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.7}
.miss{display:grid;gap:6px;margin-top:12px}
.miss div{display:flex;gap:8px;align-items:baseline;background:var(--surface);border-radius:10px;padding:8px 11px;font-size:12px}
.miss s{text-decoration:line-through;color:var(--no);font-weight:700;font-family:'Archivo',sans-serif}
.miss u{text-decoration:none;color:var(--ok);font-weight:700;font-family:'Archivo',sans-serif}
.miss span{color:var(--ink-3);font-size:11px;margin-left:auto;white-space:nowrap}
.home{margin-top:10px;background:var(--info-soft);border-radius:14px;padding:13px 15px;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.home b{color:var(--ink)}

/* 코멘트 */
.cmt{display:flex;gap:13px;padding:18px 20px}
.cmt .av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--pri-soft);display:grid;place-items:center;font-size:20px}
.cmt .who{font-size:12px;font-weight:800;color:var(--pri)}
.cmt p{margin:6px 0 0;font-size:13.5px;line-height:1.85}
.cmt p b{font-weight:800}
.cmt .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.cmt .tags em{font-style:normal;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-2);padding:4px 10px;border-radius:999px}
.cmpb{padding:16px 18px}
.cmpb .lg{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:10px}
.cmpb .lg span::before{content:"";display:inline-block;width:12px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cmpb .lg .me::before{background:var(--pri)} .cmpb .lg .cl::before{background:var(--ink-3);opacity:.45}
.cmpb .sum{background:var(--surface-2);border-radius:11px;padding:9px 12px;font-size:12.5px;margin-bottom:6px}
.cmpb .sum .dt{font-weight:800;font-family:'Archivo',sans-serif;margin-left:4px}
.cmpb .cg{padding:11px 0;border-top:1px solid var(--line)}
.cmpb .cg:first-of-type{border-top:0}
.cmpb .cn{display:flex;align-items:baseline;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.cmpb .cn b{font-size:13.5px;font-weight:800} .cmpb .cn small{font-size:11px;color:var(--ink-3);font-family:'Archivo',sans-serif}
.cmpb .cn .dt{margin-left:auto;font-size:11.5px;font-weight:800;font-family:'Archivo',sans-serif}
.cmpb .cr{display:grid;grid-template-columns:40px 1fr 44px;align-items:center;gap:8px;margin-top:4px}
.cmpb .cr .who{font-size:11px;font-weight:800;color:var(--ink-3)}
.cmpb .cr .tr{height:16px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.cmpb .cr .tr i{display:block;height:100%;border-radius:6px}
.cmpb .cr i.me{background:var(--pri)} .cmpb .cr i.me.warn{background:var(--warn)} .cmpb .cr i.me.bad{background:var(--no)}
.cmpb .cr i.cl{background:var(--ink-3);opacity:.45}
.cmpb .cr em{font-style:normal;text-align:right;font-family:'Archivo',sans-serif;font-weight:800;font-size:13px}
.cmpb .cr em.c{color:var(--ink-3)}
.cmpb .cr.none .na{grid-column:2 / 4;font-size:11px;color:var(--ink-3)}
.cmpb .cnote{font-size:10.5px;color:var(--ink-3);text-align:right;margin-top:2px}
.areas{display:grid;gap:10px}
.area{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;border-left:5px solid var(--pri)}
.area.weak{border-left-color:var(--no)} .area.mid{border-left-color:var(--warn)} .area.strong{border-left-color:var(--ok)}
.area .ah{display:flex;align-items:baseline;gap:8px}
.area .ah b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.area .lvb{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.area.weak .lvb{background:var(--no-soft,#fde8e8);color:var(--no)} .area.strong .lvb{background:var(--ok-soft,#e3f6ea);color:var(--ok)}
.area .ah em{margin-left:auto;font-style:normal;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800}
.area .ah em small{font-size:12px;color:var(--ink-3)}
.area .cnt{font-size:11.5px;color:var(--ink-3);font-family:'Archivo',sans-serif}
.area .abar{height:7px;border-radius:5px;background:var(--surface-2);margin:8px 0 10px;overflow:hidden}
.area .abar i{display:block;height:100%;background:var(--pri);border-radius:5px}
.area.weak .abar i{background:var(--no)} .area.mid .abar i{background:var(--warn)} .area.strong .abar i{background:var(--ok)}
.area .arow{display:flex;gap:10px;font-size:12.5px;line-height:1.7;margin-top:3px}
.area .arow .k{flex:none;width:52px;font-weight:800;font-size:11.5px;padding-top:1px}
.area .arow .k.no{color:var(--no)} .area .arow .k.ok{color:var(--ok)}
.area .arow b{color:var(--no);font-family:'Archivo',sans-serif} .area .arow small{color:var(--ink-3);font-family:'Archivo',sans-serif}
.area .atip{margin-top:8px;background:var(--surface-2);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.65;color:var(--ink-2)}
.hwc{padding:14px 16px}
.cum{padding:14px 16px}
.cum svg{width:100%;height:140px;display:block;overflow:visible;margin:4px 0 10px}
.lgd2{display:flex;gap:14px;font-size:11.5px;font-weight:700;color:var(--ink-3)}
.lgd2 span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.lgd2 .h::before{background:var(--ok)} .lgd2 .t::before{background:var(--pri)}
.cumt{width:100%;border-collapse:collapse;font-size:12.5px}
.cumt th{text-align:left;font-size:11px;color:var(--ink-3);padding:6px 4px;border-bottom:1px solid var(--line)}
.cumt td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.cumt tr.cur td{background:var(--pri-soft)}
.cumt td b{font-family:'Archivo',sans-serif} .cumt small{color:var(--ink-3)} .cumt em{font-style:normal;font-size:10px;color:var(--pri);font-weight:800}
.cumt .up,.cumt .down{font-size:11px;font-weight:800;white-space:nowrap}
.duo{flex:none;display:flex;gap:8px}
.duo .grade{width:78px}
@media(max-width:520px){.hero-in{flex-direction:column;gap:12px}.duo{width:100%}.duo .grade{flex:1;width:auto}}
.grade i{display:block;font-style:normal;font-size:10.5px;font-weight:800;opacity:.9;margin-bottom:5px}
.grade b small{font-size:14px;opacity:.8}
.hbig{display:flex;gap:14px;align-items:center;border-radius:14px;padding:14px;background:var(--surface-2);margin-bottom:10px;border-left:5px solid var(--ink-3)}
.hbig.ok{background:var(--ok-soft);border-color:var(--ok)} .hbig.warn{background:var(--warn-soft);border-color:var(--warn)} .hbig.no{background:var(--no-soft);border-color:var(--no)}
.hbn{flex:none;font-family:'Archivo',sans-serif;line-height:1}
.hbn b{font-size:40px;font-weight:800} .hbn span{font-size:18px;font-weight:700;color:var(--ink-3)}
.hbig.ok .hbn b{color:var(--ok)} .hbig.warn .hbn b{color:var(--warn)} .hbig.no .hbn b{color:var(--no)}
.hbt{flex:1;min-width:0} .hbt>b{display:block;font-size:14.5px;font-weight:800}
.hbar{height:8px;border-radius:5px;background:rgba(0,0,0,.08);margin:7px 0 6px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:5px;background:var(--ink-3)}
.hbig.ok .hbar i{background:var(--ok)} .hbig.warn .hbar i{background:var(--warn)} .hbig.no .hbar i{background:var(--no)}
.hbt small{font-size:11.5px;color:var(--ink-2)}
.hredo{border:1.5px solid var(--no);background:var(--no-soft);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:12.5px;line-height:1.7}
.hredo b{color:var(--no);display:block;margin-bottom:2px} .hredo span{color:var(--ink-2)}
.hwc .hsum{background:var(--surface-2);border-radius:11px;padding:9px 12px;font-size:12.5px;margin-bottom:4px}
.hwc .hsum small{color:var(--ink-3)}
.hwc .hi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.hwc .hi:last-of-type{border-bottom:0}
.hwc .hs{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-3)}
.hwc .hi.ok .hs{background:var(--ok-soft);color:var(--ok)} .hwc .hi.warn .hs{background:var(--warn-soft);color:var(--warn)} .hwc .hi.no .hs{background:var(--no-soft);color:var(--no)}
.hwc .hb b{display:block;font-size:13.5px;font-weight:800}
.hwc .hb small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-top:2px}
.hwc .hb p{margin:5px 0 0;font-size:12px;color:var(--ink-2);background:var(--warn-soft);border-radius:8px;padding:5px 9px}
.hwc .hn{text-align:right;font-size:12px;white-space:nowrap}
.hwc .hn b{display:block;font-family:'Archivo',sans-serif;font-size:15px}
.hwc .hn small{display:block;color:var(--ink-3);font-size:10.5px;margin-top:2px}
.hwc .hh{font-size:11px;font-weight:800;color:var(--ink-3);margin:12px 0 4px;letter-spacing:.02em}
.hwc .hp{display:grid;grid-template-columns:38px 1fr auto;gap:8px;font-size:12px;padding:5px 0;border-top:1px dashed var(--line)}
.hwc .hp span{color:var(--ink-3);font-family:'Archivo',sans-serif} .hwc .hp b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hwc .hp em{font-style:normal;color:var(--ink-2);white-space:nowrap}
.foot{margin-top:22px;text-align:center;font-size:10.5px;color:var(--ink-3);line-height:1.8}
@media print{body{background:#fff}.wrap{padding:0}.card,.g,.sc{box-shadow:none;border:1px solid var(--line)}}
</style><style>
.gate{max-width:400px;margin:16vh auto;padding:0 22px;text-align:left}
.gate .eb{font-family:'Archivo',sans-serif;font-size:12px;font-weight:800;letter-spacing:.13em;color:var(--pri)}
.gate h1{margin:8px 0 6px;font-size:26px;font-weight:800;letter-spacing:-.03em}
.gate p{margin:0 0 22px;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.gate input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line-2);
  background:var(--surface);font-size:16px;font-weight:600;color:var(--ink)}
.gate input:focus{border-color:var(--pri);outline:none}
.gate button{width:100%;margin-top:10px;padding:15px;border-radius:14px;border:0;background:var(--pri);

function classify(mine,right,part){
  const m=L(mine), r=L(right), both=m+" | "+r;
  const has=(x,re)=>re.test(x);
  const BE=/\b(is|are|was|were|be|been|being)\b/;

  if(/^(is|are)$/.test(m)&&/^(is|are)$/.test(r)) return "주어–동사 수일치";
  if(/^(was|were)$/.test(m)&&/^(was|were)$/.test(r)) return "주어–동사 수일치";

  if(/^(does|do)$/.test(m)&&/^(does|do)$/.test(r)) return "주어–동사 수일치";
  if(m.replace(/s$/,"")===r.replace(/s$/,"") && m!==r) return "주어–동사 수일치";

     /^(that|what|which|where|when|how|whatever|whichever)$/.test(r)) return "관계사 · 접속사";

}

function lexical(f,t){

  (D.cls||[]).filter(x=>bk(x.book)===mainBook && x.day===day).forEach(x=>{const o=clsP[x.part]=clsP[x.part]||{t:0,c:0,s:0,ps:0};

  const tests=PARTORDER.concat(Object.keys(best).filter(k=>!PARTORDER.includes(k))).filter(k=>best[k]).map(k=>{

    ${topCats.length?`<div class="home">📌 ${topCats.map(([c,n])=>`<b>${esc(c)}</b> ${n}개`).join(" · ")}</div>`:""}
    ${mainCat?`<p style="margin-top:10px">${TIPS[mainCat]||""}</p>`:""}
    <div class="miss">${DW.filter(w=>w.mine&&w.right_&&!/^[TF]$/i.test(w.right_)&&!/^[\d①-⑤]/.test(String(w.right_))&&!/^[A-E](\s*-\s*[A-E])+$/.test(w.right_)).slice(0,6).map(w=>
      `<div><s>${esc(String(w.mine).slice(0,40))}</s> → <u>${esc(String(w.right_).slice(0,40))}</u><span>${esc(name(w.part,w.part_name))} ${esc(w.no||"")}</span></div>`).join("")}</div>
  </div>`:""}

  ${rep.length?`<h2 class="s">🔁 ${esc(mainBook.split(" · ").pop())}에서 여러 번 틀린 자리 <span style="font-size:11px;font-weight:600;color:var(--ink-3)">(같은 과 지난 기록 포함)</span></h2>
  <div class="fix"><div class="miss" style="margin-top:0">${rep.map(w=>
      `<div><s>${esc(w.mine)}</s> → <u>${esc(w.right_)}</u><span>${w.cnt}회 · ${esc(w.sec||"")} ${esc(w.no||"")}</span></div>`).join("")}</div></div>`:""}

  ${RE.n?`<h2 class="s">📝 오답노트 재시험</h2>
  <div class="card" style="padding:15px 18px;font-size:13px;line-height:1.7">${TD} ${RE.n}회 · ${RE.c}/${RE.t} 정답 (${RE.t?Math.round(RE.c/RE.t*100):0}%) — 정답률 계산에는 넣지 않았어요.</div>`:""}

  ${cumHTML(CUM, day, D.student)}

  ${series.length>1?`<h2 class="s">📉 ${esc(mainBook.split(" · ").pop())} 학습일별 정답률 <span style="font-size:11px;font-weight:600;color:var(--ink-3)">(같은 과만)</span></h2>
  <div class="card ch">
    <h3>${esc(D.student)} · ${esc(mainBook)}</h3><p>그날 완료한 시험 기준 · 최근 ${series.length}일</p>
    <svg viewBox="0 0 ${W2} ${H2}" preserveAspectRatio="none" role="img" aria-label="학습일별 정답률 ${series.map(s=>s.pct).join(", ")}">
      ${[100,50,0].map(v=>`<line x1="18" x2="${W2-10}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--grid)"/><text x="${v===100?0:v===50?2:8}" y="${ys(v)+3}" font-size="8" fill="var(--ink-3)" font-family="Archivo">${v}</text>`).join("")}
      <path d="${path}" fill="none" stroke="var(--pri)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${series.map((s,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(s.pct).toFixed(1)}" r="${i===series.length-1?5:3.4}" fill="var(--pri)" stroke="var(--surface)" stroke-width="2"/>
        <text x="${xs(i).toFixed(1)}" y="${(ys(s.pct)-9).toFixed(1)}" font-size="9" font-weight="700" fill="${i===series.length-1?"var(--pri)":"var(--ink-3)"}" text-anchor="middle" font-family="Archivo">${s.pct}</text>
        <text x="${xs(i).toFixed(1)}" y="${H2-2}" font-size="8.5" fill="${i===series.length-1?"var(--pri)":"var(--ink-3)"}" text-anchor="middle" font-family="Archivo">${s.d.slice(5).replace("-",".")}</text>`).join("")}
    </svg>
  </div>`:""}

  <h2 class="s">💬 선생님 코멘트 <span style="font-size:11px;font-weight:600;color:var(--ink-3)">(자동 초안 · 수정해서 쓰세요)</span></h2>
  <div class="card cmt">
    <div class="av">🧑‍🏫</div>
    <div>
      <div class="who">헤이즐쌤 · 담당 선생님</div>
      <p contenteditable="true" style="outline:none">${cmt.join("<br><br>")}</p>
      ${AR.length?`<div class="tags">${AR.map(a=>`<em>${a.a} ${a.pct}%</em>`).join("")}${allWrongSubs.slice(0,3).map(x=>`<em>${esc(x.k)}</em>`).join("")}</div>`
        :topCats.length?`<div class="tags">${topCats.map(([c])=>`<em>${esc(c)}</em>`).join("")}</div>`:""}
    </div>
  </div>

  <div class="foot">
    hazel_studylog · 앱에 쌓인 실제 채점 기록으로 자동 생성됩니다.<br>
    정답률 = <b>그날 완료한 시험</b>의 맞힌 문항 ÷ 전체 문항 (같은 시험을 여러 번 봤으면 최고 기록 · 오답노트 재시험은 제외)<br>
    등급 95↑ A+ · 90↑ A · 85↑ A- · 80↑ B+ · 75↑ B … (절대평가) · 반평균 = 같은 날 같은 시험을 본 학생들의 평균 (학생마다 그날 최고 기록).</div>`;
  $("#app").hidden=false;
  const go_=()=>{ history.replaceState(null,"",`report?student=${encodeURIComponent(D.student)}${SELBOOK?`&book=${encodeURIComponent(SELBOOK)}`:""}&day=${SELDAY||day}`); render(LASTD); window.scrollTo(0,0); };
  const s1=$("#bksel"); if(s1) s1.onchange=()=>{ SELBOOK=s1.value; SELDAY=day; go_(); };
  const s2=$("#daysel"); if(s2) s2.onchange=()=>{ SELBOOK=""; SELDAY=s2.value; go_(); };
}
let LASTD=null, CURURL="";
/* 링크 복사 — 카톡·문자에 바로 붙여넣기 */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select();
    const ok=document.execCommand("copy"); a.remove(); return ok; }catch(e){ return false; }
}
function flash(msg){ const e=document.createElement("div"); e.textContent=msg;
  e.style.cssText="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#16151F;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:99";
  document.body.appendChild(e); setTimeout(()=>e.remove(),1800); }
document.addEventListener("click",async e=>{ if(!e.target.closest("[data-cplink]")) return;
  const ok=await copyText(CURURL?location.origin+"/"+CURURL.replace(/^report\?/,"r?"):location.href); /* /r = 서버에서 글로 채운 리포트 (어디 붙여도 바로 읽힘) */ flash(ok?"리포트 링크를 복사했어요 · 바로 붙여넣으세요":"복사가 안 돼요 · 주소창 링크를 복사해 주세요"); });

async function start(name){
  $("#err").textContent="";
  try{
    const D=await load(name);
    $("#gate").hidden=true; LASTD=D; await render(D);
    history.replaceState(null,"",`report?student=${encodeURIComponent(name)}${SELBOOK?`&book=${encodeURIComponent(SELBOOK)}`:""}`);
  }catch(e){ $("#err").textContent=e.message||"불러오지 못했습니다"; }
}
$("#go").onclick=()=>{ const v=$("#nm").value.trim(); if(v.length<2) return $("#err").textContent="이름을 입력해 주세요"; start(v); };
$("#nm").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#go").click(); });
(()=>{ const q=new URL(location.href).searchParams.get("student"); if(q) start(q); })();
</script>
</body>
