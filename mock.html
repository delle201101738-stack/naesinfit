<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hazel_studylog · 동형모고 OMR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Archivo:wght@500;600;700&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root{
  --ground:#EEEFF5; --surface:#fff; --surface-2:#F7F7FB; --surface-3:#EFEFF6;
  --line:#E4E4EF; --line-2:#D8D8E6; --ink:#16151F; --ink-2:#55536A; --ink-3:#8A87A0;
  --accent:#6B4EFF; --accent-soft:#EDE9FF; --on-accent:#fff;
  --ok:#12A150; --ok-soft:#E4F5EA; --no:#E5484D; --no-soft:#FCEBEB; --warn:#E8890C; --warn-soft:#FDF1E0; --hl:#FFF3B0;
  --shadow:0 1px 2px rgba(22,21,31,.05), 0 10px 26px -16px rgba(22,21,31,.30);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E0E17; --surface:#1A1A27; --surface-2:#21212F; --surface-3:#282838;
  --line:#2C2C3D; --line-2:#3A3A4E; --ink:#F1F0F8; --ink-2:#A7A4BB; --ink-3:#7B7894;
  --accent:#8E76FF; --accent-soft:#241F42; --on-accent:#12101F;
  --ok:#3ECF7E; --ok-soft:#12301F; --no:#FF6B6F; --no-soft:#3A1B1E; --warn:#F2A93B; --warn-soft:#382712; --hl:#4A3F10;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -18px rgba(0,0,0,.85);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Gothic A1','Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:'Archivo',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.bar .sub{font-size:12.5px;color:var(--ink-3)}
.btn{display:inline-block;padding:9px 15px;border-radius:11px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-3)} .btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);color:var(--on-accent)} .btn.ok{background:var(--ok);color:#fff} .btn.no{color:var(--no)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px;flex-wrap:wrap}
.sec h2{margin:0;font-size:15px;font-weight:800}
.note{font-size:12.5px;color:var(--ink-3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;font-weight:800;color:var(--ink-2)}
.chip.on{background:var(--accent);color:var(--on-accent)} .chip small{font-weight:600;opacity:.75;margin-left:4px}
.fld{padding:9px 11px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);font-size:14px}
.fld:focus{border-color:var(--accent);outline:none}
textarea.fld{width:100%;min-height:60px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink-3)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.steps button{padding:10px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;font-weight:800;color:var(--ink-2)}
.steps button.on{background:var(--ink);color:var(--surface)}
.steps button i{font-style:normal;font-size:11px;margin-left:6px;padding:2px 7px;border-radius:99px;background:var(--surface-3);color:var(--ink-3)}
.steps button.on i{background:rgba(255,255,255,.18);color:inherit}
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ex{text-align:left;padding:16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.ex b{display:block;font-size:15px} .ex span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow:auto;max-height:70vh}
td input.fld,td select.fld{padding:6px 8px;font-size:13px;border-radius:8px}
tr.diff td{background:var(--warn-soft)} tr.nokey td{background:var(--no-soft)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-no{background:var(--no-soft);color:var(--no)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-mute{background:var(--surface-3);color:var(--ink-3)}
.drop{border:2px dashed var(--line-2);border-radius:16px;padding:22px;text-align:center;color:var(--ink-2)}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.prog{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:10px 0} .prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.log{font-size:12.5px;color:var(--ink-2);max-height:180px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.q{border-radius:10px;padding:6px 8px;background:var(--surface-2);font-size:12.5px;text-align:left;border:1.5px solid transparent}
.q b{font-family:'Archivo',sans-serif} .q .m{font-weight:800;font-size:14px}
.q.ok{background:var(--ok-soft)} .q.x{background:var(--no-soft)} .q.flag{border-color:var(--warn);background:var(--hl)}
.sheetimg{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.crop{display:block;max-width:100%;border-radius:6px;border:1px solid var(--line);margin:4px 0;background:#fff}
.pick{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pick button{min-width:34px;padding:6px 8px;border-radius:8px;background:var(--surface-3);font-weight:800;font-size:13px}
.pick button.on{background:var(--accent);color:var(--on-accent)}
.subbox{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:60;max-width:90vw}
.gate{max-width:400px;margin:14vh auto;padding:0 20px}
.gate h2{margin:0 0 6px;font-size:23px;font-weight:800}
.gate input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);font-size:16px;font-weight:600}
.gate button{width:100%;margin-top:12px;padding:15px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:15.5px;font-weight:800}
.err{color:var(--no);font-size:13px;font-weight:700;margin-top:10px;min-height:19px}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin:10px 0}
details summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-2)}
@media (max-width:700px){ .wrap{padding:0 12px 80px} .bar-in{padding:10px 12px} .card{padding:14px} }
</style>
</head>
<body>
<div id="gate" class="gate">
  <h2>동형모고 OMR</h2>
  <p style="font-size:14px;color:var(--ink-2)">선생님 비밀번호를 입력하세요.</p>
  <input id="pin" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="pin-go">들어가기</button>
  <div class="err" id="pin-err"></div>
</div>
<div id="app" hidden>
  <header class="bar"><div class="bar-in">
    <div style="flex:1"><h1>📝 동형모고 OMR 리포트</h1><div class="sub">정답 확정 → OMR 뽑기 → 찍어 올리기 → 리포트 보내기</div></div>
    <a class="btn" href="hw">← 반별 관리</a>
  </div></header>
  <div class="wrap">
    <div class="sec"><h2>반</h2><span class="note">한 반에 시험 하나씩 만들어요</span></div>
    <div class="chips" id="classes"></div>
    <div id="main"></div>
  </div>
</div>
<input type="file" id="f-omr" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="f-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="f-xls" accept=".xlsx,.xls,.csv" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script charset="utf-8" src="omr.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const fmtD=d=>{ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${+m}.${+dd} (${"일월화수목금토"[new Date(+y,+m-1,+dd).getDay()]})`; };
const baseNm=n=>String(n||"").replace(/[A-Za-z0-9]+$/,"");
let PIN=(()=>{try{return localStorage.getItem("naesinfit.pin")||sessionStorage.getItem("naesinfit.pin")||""}catch(e){return ""}})();
let AREAS=["대의파악","세부정보","어법·어휘","빈칸추론","간접쓰기","장문독해","서술형","듣기"], BP45=[], DB=null, CUR=+(localStorage.getItem("hw.class")||0), EXAMS=null, KINDS=[], AI=false, EX=null, STATS=null, STEP=localStorage.getItem("mock.step")||"key", OPEN=null, PENDING=[], BUSY="";
const QS=new URLSearchParams(location.search);
function toast(t,ms){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ms||2600); }
function loadJS(src,test){ return test()?Promise.resolve():new Promise((ok,no)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>no(new Error("도구를 불러오지 못했어요")); document.head.appendChild(s); }); }
async function libsPDF(){ await loadJS("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",()=>window.jspdf); }
async function libsPDFJS(){ await loadJS("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",()=>window.pdfjsLib); window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
async function api(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",headers:{"x-pin":PIN,"content-type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  const j=await r.json().catch(()=>({})); if(!r.ok){ const e=new Error(j.error||"서버 오류"); e.noKey=j.noKey; throw e; } return j;
}
const mock=b=>api("/api/mock",b);
async function loadAll(){ DB=await api("/api/hw"); if(!DB.classes.find(c=>+c.id===CUR)) CUR=DB.classes[0]?+DB.classes[0].id:0; await loadExams(); }
async function loadExams(){ const j=await api(`/api/mock?list=1&class_id=${CUR}`); EXAMS=j.exams; KINDS=j.kinds; AI=j.ai; if(j.areas) AREAS=j.areas; if(j.blueprint) BP45=j.blueprint; }
async function openExam(id){ const same=EX&&+EX.id===+id; const j=await api(`/api/mock?exam=${id}`); EX=j.exam; STATS=j.stats; KINDS=j.kinds; AI=j.ai; if(j.areas) AREAS=j.areas; if(j.blueprint) BP45=j.blueprint; if(!same){ OPEN=null; PENDING=[]; } else if(OPEN&&!sheetOf(OPEN)) OPEN=null; }
const members=()=>DB.members.filter(m=>+m.class_id===CUR).map(m=>m.student).sort((a,b)=>a.localeCompare(b,"ko"));
const cls=()=>DB.classes.find(c=>+c.id===CUR)||{};
const items=()=>((EX&&EX.cfg.items)||[]);
const omrItems=()=>((EX&&EX.cfg.omr&&EX.cfg.omr.items)||items());
const sheetOf=s=>(EX.sheets||[]).find(x=>x.student===s);
const roster=()=>(EX.cfg.roster||[]);
const sortN=(a,b)=>{ const sa=/^서/.test(a.n), sb=/^서/.test(b.n); if(sa!==sb) return sa?1:-1; return (parseFloat(String(a.n).replace(/\D/g,""))||0)-(parseFloat(String(b.n).replace(/\D/g,""))||0); };

/* ───────── 화면 ───────── */
function render(){
  $("#classes").innerHTML=DB.classes.map(c=>`<button class="chip${+c.id===CUR?" on":""}" data-cls="${c.id}">${esc(c.name)}<small>${DB.members.filter(m=>+m.class_id===+c.id).length}명</small></button>`).join("");
  if(!CUR){ $("#main").innerHTML=`<div class="card empty" style="margin-top:14px">반 관리에서 반을 먼저 만들어 주세요.</div>`; return; }
  if(!EX){ $("#main").innerHTML=listHTML(); return; }
  const S=[["key","① 시험 · 정답", items().length?`${items().length}문항${EX.cfg.keyDone?" ✓":""}`:""],["print","② OMR 뽑기",""],["scan","③ OMR 올리기 · 확인",`${EX.sheets.filter(s=>s.confirmed).length}/${members().length}`],["report","④ 리포트 보내기",""]];
  $("#main").innerHTML=`<div class="sec"><h2>${esc(EX.title)} <span class="note">${fmtD(EX.day)} · ${esc(cls().name||"")}</span></h2><span class="row"><button class="btn sm" id="ex-back">← 시험 목록</button><button class="btn sm no" id="ex-del">시험 삭제</button></span></div>
    <div class="steps">${S.map(([k,n,c])=>`<button class="${STEP===k?"on":""}" data-step="${k}">${n}${c?`<i>${c}</i>`:""}</button>`).join("")}</div>
    <div id="step">${STEP==="key"?keyHTML():STEP==="print"?printHTML():STEP==="scan"?scanHTML():reportHTML()}</div>`;
  if(STEP==="scan"&&OPEN) paintOpen();
}
function listHTML(){
  const L=EXAMS||[];
  return `<div class="sec"><h2>${esc(cls().name)} 동형모고</h2><button class="btn pri" id="ex-new">+ 새 동형모고</button></div>
  ${L.length?`<div class="exams">${L.map(e=>`<button class="ex" data-ex="${e.id}"><b>${esc(e.title)}</b><span>${fmtD(e.day)} · ${e.nItems}문항 ${e.keyDone?"· 정답 확정 ✓":"· 정답 확정 전"}</span><span>OMR ${e.sheets}장 · 확정 ${e.confirmed}명</span></button>`).join("")}</div>`
  :`<div class="card empty">아직 동형모고가 없어요. <b>+ 새 동형모고</b>로 시작하세요.</div>`}
  ${AI?"":`<div class="warnbox">🤖 AI 키(ANTHROPIC_API_KEY)가 아직 없어요 — 정답 AI 추출·검수, 서술형 채점, 코멘트는 키를 넣으면 켜져요. 객관식 OMR 인식·채점·리포트는 지금도 돼요.</div>`}`;
}

/* ── ① 시험·정답 ── */
const CUT5=[90,83,70,60,50];   // 기본 등급: 내신 5등급제 커트라인 (선생님 지정)
let KEYF={key:null,paper:null}, AILOG="", AIP=0;
const fnames=fs=>fs.length===1?fs[0].name:`${fs[0].name} 외 ${fs.length-1}개`;
/* 사진·PDF 여러 개 → AI용 페이지. 못 읽은 파일 이름은 따로 알려 줌 (아이폰 HEIC 등) */
async function pagesOf(fs,log){ if(!fs) return []; const out=[];
  for(const f of fs){ const pg=await OMR.pagesForAI(f).catch(e=>{ log(`✗ ${f.name}: ${e.message}`); return []; });
    if(!pg.length) log(`✗ ${f.name}을(를) 읽지 못했어요${/heic|heif/i.test(f.type+f.name)?" — 아이폰 HEIC 사진은 PDF나 JPG로 바꿔 올려 주세요":" — PDF나 JPG·PNG인지 확인해 주세요"}`);
    out.push(...pg); }
  return out; }
function keyHTML(){
  const it=items().slice().sort(sortN), g=EX.cfg.grade||{mode:"cut",cuts:CUT5};
  const tot=it.filter(x=>x.fx!=="out").reduce((s,x)=>s+(+x.p||0),0), nDiff=it.filter(x=>x.chk==="diff").length, nNo=it.filter(x=>x.t!=="s"&&!x.a&&x.fx!=="all"&&x.fx!=="out").length, nOut=it.filter(x=>x.fx==="out").length;
  const areaOpts=v=>`<option value="">영역</option>`+AREAS.map(k=>`<option${k===v?" selected":""}>${esc(k)}</option>`).join("");
  const kindOpts=v=>`<option value="">세부유형</option>`+KINDS.map(k=>`<option${k===v?" selected":""}>${esc(k)}</option>`).join("")+(v&&!KINDS.includes(v)?`<option selected>${esc(v)}</option>`:"");
  return `<div class="card">
    <div class="row" style="align-items:flex-end">
      <label class="f" style="flex:2;min-width:220px">시험 이름<input class="fld" id="k-title" value="${esc(EX.title)}"></label>
      <label class="f">날짜<input class="fld" type="date" id="k-day" value="${EX.day}"></label>
      <label class="f">학원명 (리포트 머리글)<input class="fld" id="k-acad" value="${esc(EX.cfg.academy||"헤이즐 영어")}" style="width:150px"></label>
      <label class="f">리포트 영역<select class="fld" id="k-amode" title="레벨테스트처럼 어휘·어법·독해로만 나눠 보여 줄 수 있어요">
        <option value="auto"${EX.cfg.areaMode==="auto"?" selected":""}>🤖 AI가 시험지·해설지 보고 정함</option>
        <option value="csat"${!EX.cfg.areaMode||EX.cfg.areaMode==="csat"?" selected":""}>수능형 7영역</option>
        <option value="lvl"${EX.cfg.areaMode==="lvl"?" selected":""}>레벨테스트형 · 어휘·어법·독해</option></select></label>
      <label class="f">등급 기준<select class="fld" id="k-gmode">
        <option value="cut"${g.mode==="cut"?" selected":""}>내신 5등급제 · 커트라인</option>
        <option value="score"${g.mode==="score"?" selected":""}>점수만 (등급 없음)</option>
        <option value="csat"${g.mode==="csat"?" selected":""}>수능 모의고사 · 절대평가 등급</option></select></label>
      ${g.mode==="cut"?`<label class="f" style="min-width:220px">커트라인 (1~5등급, 이 점수 이상)<input class="fld" id="k-cuts" placeholder="90 83 70 60 50" value="${esc(((g.cuts&&g.cuts.length)?g.cuts:CUT5).join(" "))}"></label>`:""}
    </div>
  </div>
  <div class="sec"><h2>🤖 AI로 정답 · 유형 · 해설 채우기</h2><span class="note">해설지에서 정답을 뽑고, 시험지는 AI가 직접 풀어 정답과 다른 문항만 ⚠ 로 알려 줘요</span></div>
  <div class="card">
    <div class="row">

const KAREA={"목적":"대의파악","심경·분위기":"대의파악","주장":"대의파악","함축의미":"대의파악","요지":"대의파악","주제":"대의파악","제목":"대의파악",

  "연결어":"빈칸추론","무관한 문장":"간접쓰기","순서":"간접쓰기","삽입":"간접쓰기","요약문":"간접쓰기","지칭":"장문독해"};

function stemKind(q){ const s=String(q||"").replace(/\s+/g," "); if(!s.trim()) return null;
  if(/우리말과 (일치|같)|번째|배열/.test(s)) return null;   // 우리말 짝 고르기·배열형은 발문만으로 못 정함
  const R=[[/가리키는 대상|가리키는 것이 나머지|지칭/,"지칭"],[/영영\s*풀이|뜻풀이|단어(의)? ?설명/,"영영풀이"],[/어법/,"어법"],[/연결어|연결사|접속(어|사)/,"연결어"],[/요약/,"요약문"],
    [/순서/,"순서"],[/주어진 문장.*(들어|위치)|들어갈 곳|들어가기에|들어갈 위치/,"삽입"],[/흐름.*(관계|무관|맞지|어색)|관계\s*없는|무관한/,"무관한 문장"],
    [/낱말|어휘|쓰임|의 뜻(으로|은|이)?(\s|$|\?)/,"어휘"],[/제목/,"제목"],[/주제/,"주제"],[/요지/,"요지"],[/주장/,"주장"],[/목적/,"목적"],[/심경|분위기|태도/,"심경·분위기"],
    [/의미|뜻하는|함축|가리키는 바/,"함축의미"],[/도표|그래프/,"도표"],[/안내문|광고|공지|포스터/,"실용문"],
    [/일치|언급되지|언급된|부합|바르게 이해|답할 수 없는|알 수 없는/,"내용일치"]];

  const it=items(), by=n=>it.find(x=>x.n===n);
  const add=(n,t)=>{ let x=by(n); if(!x){ x={n,t:t==="s"?"s":"o",a:"",p:t==="s"?5:2,k:"",e:"",m:"",r:""}; it.push(x); } return x; };
  K.forEach(k=>{ const x=add(k.n,k.t); if(k.t) x.t=k.t==="s"?"s":"o"; if(x.t!=="s"&&k.a) x.a=String(k.a).replace(/[①-⑤]/g,c=>"①②③④⑤".indexOf(c)+1).replace(/\s+/g,"");
    if(k.e) x.e=k.e; if(k.m) x.m=k.m; if(k.r) x.r=k.r; if(k.k||k.d) x._kt={k:k.k||"",d:k.d||"",w:String(k.kw||"").trim()}; if(k.q&&!x.q) x.q=k.q; if(k.g&&!x.g&&x.gm!=="me") x.g=String(k.g).trim().slice(0,12); if(k.p!=null&&+k.p>0&&x.ps!=="me"){ x.p=+k.p; x.ps="ai"; } });
  const best={}; P.forEach(p=>{ if(!best[p.n]||(p.full&&!best[p.n].full)) best[p.n]=p; else if(p.full&&best[p.n].full&&String(p.ai)!==String(best[p.n].ai)) best[p.n].dis=String(p.ai); });
  Object.values(best).forEach(p=>{ const x=add(p.n,p.t); if(p.k||p.d) x._pt={k:p.k||"",d:p.d||""}; if(p.q) x.q=p.q; if(p.g&&x.gm!=="me") x.g=String(p.g).trim().slice(0,12); if(!(x.ps==="me"||(x.ps==="ai"&&!K.length))&&p.p!=null&&+p.p>0&&!K.find(k=>k.n===p.n&&k.p)){ x.p=+p.p; x.ps="ai"; }
    if(p.full!==false&&p.ai!==""&&p.ai!=null){ x.ai=String(p.ai).replace(/[①-⑤]/g,c=>"①②③④⑤".indexOf(c)+1).trim(); x.why=(p.why||"")+(p.dis?` (다른 풀이에선 ${p.dis}번)`:""); } });
  it.forEach(x=>{ if(x.t==="s"||!x.ai||!x.a){ if(x.t!=="s"&&x.a&&!x.ai) x.chk=""; return; }
    x.chk=x.a.split(",").includes(x.ai)&&!(x.why||"").includes("다른 풀이")?"ok":"diff"; });
  // 유형: 해설지·시험지 따로 분류한 것을 맞춰 봄. 해설지에 유형이 글자로 적혀 있으면 그게 우선, 아니면 둘이 같으면 그대로,
  // 다르면 시험지(발문을 직접 본 쪽)를 넣고 ⚠ 표시해서 선생님이 고르게 함. 선생님이 직접 고친 유형(dk=me)은 안 건드림.
  const okD=d=>AREAS.concat("서술형").includes(d);
  it.forEach(x=>{ const K1=x._kt, P1=x._pt; delete x._kt; delete x._pt; if(!K1&&!P1) return;
    if(x.dk==="me"){ x.kchk=""; return; }
    let pick, why="";
    if(K1&&P1){ if(K1.k===P1.k){ pick=P1; x.kchk="ok"; } else if(K1.w){ pick=K1; x.kchk="ok"; why=`해설지 표기 '${K1.w}'`; } else { pick=P1; x.kchk="diff"; x.kalt=K1.k; } }
    else { pick=K1||P1; x.kchk="one"; }
    if(pick.k) x.k=pick.k; if(okD(pick.d)) x.d=pick.d; x.bp=0; if(x.kchk!=="diff") delete x.kalt; x.kwhy=why; });
  applyStem(it);   // 발문 글자로 한 번 더 확정
  // 시험지를 읽었는데 AI가 듣기 문항을 하나도 못 찾았으면, 예전 수능 청사진에서 남은 '듣기' 유형은 비움
  if((P.length||K.length)&&!P.concat(K).some(p=>p.d==="듣기"||p.k==="듣기")) it.forEach(x=>{ if(x.dk!=="me"&&x.d==="듣기"){ x.d=""; x.k=""; x.bp=0; } });
  it.sort(sortN); EX.cfg.items=it;
}

/* 엑셀·CSV 답안: 머리글 줄에 '이름'이 있고, 문항 열 머리글이 1, 2, … (서술형은 서1 …) */
async function importXLS(f){
  try{
    await loadJS("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",()=>window.XLSX);
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const ws=wb.Sheets[wb.SheetNames.find(n=>/학생답안/.test(n))||wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
    const hi=rows.findIndex(r=>r.some(c=>String(c).trim()==="이름")); if(hi<0) throw new Error("'이름' 머리글 줄을 찾지 못했어요");
    const H=rows[hi].map(c=>String(c).trim()), ci=H.indexOf("이름"), its=omrItems().length?omrItems():items();
    const col={}; its.forEach(x=>{ const k=H.indexOf(String(x.n)); if(k>=0) col[x.n]=k; });
    if(!Object.keys(col).length) throw new Error("문항 번호 머리글(1, 2, …)을 찾지 못했어요");
    const mem=members(), find=nm=>{ nm=String(nm||"").trim(); if(!nm) return null; if(mem.includes(nm)) return nm; const c=mem.filter(m=>baseNm(m)===nm||baseNm(m)===baseNm(nm)); return c.length===1?c[0]:null; };
    let ok=0; const miss=[];
    for(const r of rows.slice(hi+1)){ const nm=String(r[ci]||"").trim(); if(!nm) continue; const st=find(nm); if(!st){ miss.push(nm); continue; }
      const marks={}, subs={}; its.forEach(x=>{ if(col[x.n]==null) return; const v=String(r[col[x.n]]??"").trim();
        if(x.t==="s"){ if(v!=="") subs[x.n]=v; } else marks[x.n]=/^[1-5]$/.test(v)?v:/^[①-⑤]$/.test(v)?String("①②③④⑤".indexOf(v)+1):""; });
      await mock({action:"sheet.save",exam_id:EX.id,student:st,kind:"obj",marks,flags:{},img:""}); ok++;
      for(const [n,v] of Object.entries(subs)) await mock({action:"sheet.set",exam_id:EX.id,student:st,sub:{n,score:/^[0-9.]+$/.test(v)?v:"",read:/^[0-9.]+$/.test(v)?"":v,why:""}});
    }
    await openExam(EX.id); render();
    toast(`엑셀에서 ${ok}명 답안을 넣었어요${miss.length?` · 명단에 없는 이름: ${miss.join(", ")}`:""}`,6000);
  }catch(e){ toast(e.message,5000); }
}

let RP={busy:false,log:""};
/* ── 보내기 전 채점 점검 ── 문제가 있으면 '확인했어요'를 눌러야 리포트·링크가 열림 */
function auditExam(){
  const it=items().filter(x=>x.fx!=="out"), obj=it.filter(x=>x.t!=="s"), done=EX.sheets.filter(s=>s.confirmed), n=done.length, R=[];
  const add=(lv,txt)=>R.push({lv,txt});   // lv: bad(빨강) · warn(노랑) · info
  const tot=Math.round(it.reduce((a,x)=>a+(+x.p||0),0)*10)/10;
  if(tot!==100) add("warn",`총점이 ${tot}점이에요 (100점 아님). ① 시험 · 정답에서 배점을 확인하세요.`);
  const noKey=obj.filter(x=>!String(x.a||"").trim()&&x.fx!=="all"); if(noKey.length) add("bad",`정답이 비어 있는 문항: ${noKey.map(x=>x.n+"번").join(", ")}`);
  const dflt=it.filter(x=>!(x.ps==="ai"||x.ps==="me")&&!x.bp); if(dflt.length&&tot!==100) add("warn",`배점을 시험지에서 못 읽은(기본값) 문항 ${dflt.length}개`);
  const sub=it.filter(x=>x.t==="s"), subMiss=done.filter(s=>sub.some(x=>{ const v=(s.subs||{})[x.n]; return !v||v.score==null||v.score===""; }));
  if(sub.length&&subMiss.length) add("bad",`서술형 점수가 빈 학생 ${subMiss.length}명: ${subMiss.map(s=>baseNm(s.student)||s.student).join(", ")}`);
  const pend=EX.sheets.filter(s=>!s.confirmed); if(pend.length) add("info",`OMR은 올렸지만 아직 확정 안 한 학생 ${pend.length}명 (리포트에서 빠져요): ${pend.map(s=>baseNm(s.student)||s.student).join(", ")}`);
  const nmD=st=>{ const b=baseNm(st)||st; return done.filter(o=>(baseNm(o.student)||o.student)===b).length>1?st:b; };
  // ① OMR 판독 애매(두 개·흐림·지운 자국) 칸을 확인 안 하고 확정한 학생
  const fl=done.map(s=>({s,ns:obj.filter(x=>flagOn(s,x)).map(x=>x.n)})).filter(o=>o.ns.length);
  if(fl.length) add("bad",`OMR 판독이 애매한 칸(두 개 칠함·흐림·지운 자국)을 확인 안 한 학생 ${fl.length}명: ${fl.map(o=>`${nmD(o.s.student)}(${o.ns.slice(0,6).join("·")}${o.ns.length>6?"…":""}번)`).join(", ")} — ③에서 노란 칸을 눌러 확인·저장하세요`);
  const bl=done.map(s=>({s,b:obj.filter(x=>!String((s.marks||{})[x.n]||"").trim()).length})).filter(o=>obj.length&&o.b>=Math.max(3,Math.ceil(obj.length*0.3)));
  if(bl.length) add("warn",`답이 빈 칸이 많은 학생: ${bl.map(o=>`${nmD(o.s.student)} ${o.b}칸`).join(", ")} — OMR이 잘못 읽혔거나 다른 장일 수 있어요`);
  // ② 석차·평균에 들어가는 학생 확인
  const mem=members(), out=done.filter(s=>!mem.includes(s.student)); if(out.length) add("bad",`반 명단에 없는 학생이 석차에 들어가요: ${out.map(s=>s.student).join(", ")} — ③에서 다른 학생으로 옮기거나 지우세요`);
  const bn={}; done.forEach(s=>{ const b=baseNm(s.student)||s.student; (bn[b]=bn[b]||[]).push(s.student); }); const dup=Object.values(bn).filter(a=>a.length>1);
  if(dup.length) add("warn",`같은 이름 OMR이 여러 장: ${dup.map(a=>a.join("·")).join(", ")} — 동명이인이 맞는지, 한 학생 OMR이 두 번 들어간 건 아닌지 확인`);
  const miss=mem.filter(m=>!EX.sheets.some(s=>s.student===m)); if(miss.length&&done.length) add("info",`OMR이 없는 학생 ${miss.length}명 (결시 · 석차·평균에서 빠져요): ${miss.map(m=>baseNm(m)||m).join(", ")}`);
  // ③ 서술형 점수
  const badS=[], aiS=[]; done.forEach(s=>sub.forEach(x=>{ const v=(s.subs||{})[x.n]; if(!v||v.score==null||v.score==="") return; const sc=+v.score, nm=nmD(s.student);
    if(!(sc>=0&&sc<=(+x.p||0))||Math.abs(sc*2-Math.round(sc*2))>1e-9) badS.push(`${nm} ${x.n}(${sc}/${x.p}점)`); else if(v.src==="ai") aiS.push(`${nm} ${x.n}`); }));
  if(badS.length) add("bad",`서술형 점수가 배점을 넘거나 0.5점 단위가 아니에요: ${badS.join(", ")}`);
  if(aiS.length) add("info",`AI가 매긴 서술형 점수를 선생님이 아직 안 본 칸 ${aiS.length}개: ${aiS.slice(0,10).join(", ")}${aiS.length>10?" …":""} (저장을 누르면 '선생님 수정'으로 바뀌어요)`);
  const lis=obj.filter(x=>x.d==="듣기"||x.k==="듣기"); if(lis.length) add("bad",`듣기 유형으로 된 문항 ${lis.length}개 (${lis.length>6?lis[0].n+"~"+lis[lis.length-1].n:lis.map(x=>x.n).join(", ")}번). 이 시험에 듣기가 없으면 ① 시험 · 정답에서 시험지를 다시 넣고 AI를 돌리거나 영역·유형을 고치세요. 리포트 영역 분석·학습 처방이 틀려져요.`);
  const sm=it.filter(x=>x.t!=="s"&&x.dk!=="me"&&stemKind(x.q)&&stemKind(x.q)!==x.k); if(sm.length) add("warn",`발문과 세부유형이 안 맞는 문항 ${sm.length}개: ${sm.slice(0,8).map(x=>`${x.n}번(발문 '${String(x.q).slice(0,14)}' → ${stemKind(x.q)}, 지금 ${x.k||"없음"})`).join(", ")} — ① 시험 · 정답의 '🔁 발문으로 유형 다시 정하기'`);
  const kd=it.filter(x=>x.kchk==="diff"); if(kd.length) add("warn",`시험지·해설지 유형 분류가 다른 문항 ${kd.length}개: ${kd.map(x=>`${x.n}번(${x.k}/${x.kalt})`).join(", ")} — ① 시험 · 정답에서 골라 주세요`);
  const noK=obj.filter(x=>!x.d&&!x.k); if(noK.length) add("warn",`영역·유형이 빈 문항 ${noK.length}개: ${noK.map(x=>x.n+"번").join(", ")} (리포트에선 '대의파악'으로 묶여요)`);
  const norm=v=>[...new Set(String(v||"").split(/[,\s/]+/).filter(Boolean))].sort().join(",");
  obj.forEach(x=>{ const acc=String(x.a||"").split(/[,\s/]+/).filter(Boolean); if(!acc.length&&x.fx!=="all") return;
    const marks=done.map(s=>norm((s.marks||{})[x.n])), ok=done.map(s=>markOkC(acc,(s.marks||{})[x.n],x.fx)), nOk=ok.filter(Boolean).length;
    // ① 학생 답이 정답과 똑같은데 오답 처리 (채점 규칙 오류)
    const same=marks.map((m,i)=>m&&m===norm(x.a)&&!ok[i]).filter(Boolean).length;
    if(same) add("bad",`${x.n}번: 정답과 똑같이 칠한 학생 ${same}명이 오답으로 처리됨 — 채점 오류`);
    if(acc.length>1&&x.fx!=="multi"){ const both=marks.filter(m=>m===norm(x.a)).length, one=marks.filter(m=>m&&!m.includes(",")&&acc.includes(m)).length;
      add("warn",`${x.n}번 정답 ${x.a} (두 개 고르기): 둘 다 칠한 학생 ${both}명 → 정답 · 하나만 칠한 학생 ${one}명 → 오답. 둘 중 하나만 맞아도 되는 문항이면 '정정 → 복수 정답'으로 바꾸세요.`); }
    if(n>=3){ const rate=nOk/n;
      const cnt={}; marks.forEach(m=>{ if(m) cnt[m]=(cnt[m]||0)+1; }); const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];

/* 배점 합계 100점 맞추기: 시험지에서 읽은 배점(📄)·직접 고친 배점은 그대로 두고, 기본값 문항에 남은 점수를 고르게 나눔.
   모든 배점이 읽힌/고친 값이면 비율대로 늘리거나 줄임. 0.1점 단위, 끝수는 마지막 문항에. */
const r10=v=>Math.round(v*10)/10;
function evenOut(list,target){   // 합계가 target이 되도록 0.1점씩 앞 문항부터 나눠 더하거나 뺌 (한 문항에 몰리지 않게)
  let d=Math.round((target-list.reduce((a,x)=>a+(+x.p||0),0))*10), i=0;
  while(d!==0&&list.length){ const x=list[i%list.length]; x.p=r10(x.p+(d>0?0.1:-0.1)); d+=d>0?-1:1; i++; } }
function fitTo100(){
  const it=items().filter(x=>x.fx!=="out"); if(!it.length) return "";
  const fixed=it.filter(x=>x.ps==="ai"||x.ps==="me"), free=it.filter(x=>!(x.ps==="ai"||x.ps==="me"));
  const fsum=r10(fixed.reduce((a,x)=>a+(+x.p||0),0));
  if(free.length && fsum<100){
    const rest=r10(100-fsum), each=Math.floor(rest/free.length*10)/10;
    free.forEach(x=>x.p=each); evenOut(free,rest);
    return `배점을 못 읽은 ${free.length}문항에 남은 ${rest}점을 나눴어요(문항당 약 ${each}점). 📄 읽은 ${fixed.length}문항은 그대로예요.`;
  }
  const sum=r10(it.reduce((a,x)=>a+(+x.p||0),0)); if(!sum) return "";
  it.forEach(x=>x.p=r10((+x.p||0)*100/sum)); evenOut(it,100);
  return `배점 비율은 그대로 두고 합계 ${sum}점 → 100점으로 맞췄어요.`;
}
/* 서버(_mock.js markOk)와 같은 객관식 판정: '3,4' = 둘 다 골라야 정답, 정정 '복수 정답'이면 하나만 골라도 정답 */
function flagOn(sh,x){ const f=(sh.flags||{})[x.n]||""; if(!f||f==="blank") return ""; if(f==="multi"){ const k=items().find(i=>i.n===x.n)||{}; const acc=String(k.a||"").split(/[,\s/]+/).filter(Boolean); if(acc.length>1&&markOkC(acc,(sh.marks||{})[x.n],k.fx)) return ""; } return f; }
function markOkC(acc,m,fx){ if(fx==="all"||acc.includes("*")) return true; const ms=[...new Set(String(m||"").split(/[,\s/]+/).filter(Boolean))];
  if(!ms.length||!acc.length) return false; if(ms.length===acc.length&&ms.every(x=>acc.includes(x))) return true; return fx==="multi"&&ms.length===1&&acc.includes(ms[0]); }
/* 문항 정정: 점수 바뀐 학생 알려 주기 */
function scoreSnap(){ return JSON.parse(JSON.stringify((STATS&&STATS.scores)||{})); }
function scoreDiff(before){ const now=(STATS&&STATS.scores)||{}, ch=[];
  Object.keys(now).forEach(s=>{ const a=(before[s]||{}).score, b=now[s].score; if(a!=null&&a!==b) ch.push(`${baseNm(s)||s} ${a}→${b}`); });
  return ch.length?`점수 바뀐 학생 ${ch.length}명: ${ch.slice(0,6).join(", ")}${ch.length>6?" 외":""}`:""; }

    if(t.dataset.f==="fx"){ if((x.fx==="change"||x.fx==="multi")&&!x.fo) x.fo=old; if(!x.fx) delete x.fo; }
    render(); return; }
